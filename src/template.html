<title>废柴仙途</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：竖屏单列游戏机——顶栏 / 像素场景 / 修为条 / 消息卷 / 底部五键；弹窗是展开的卷轴 */
@font-face {
  font-family: "XPixel";
  src: url(data:font/woff2;base64,/*FONT_B64*/) format("woff2");

}
:root {

  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),

}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }

#cult .row { display: flex; gap: 8px; align-items: baseline; }
#cult #realm { color: var(--gold); flex: none; }
#cult #xpTxt { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cult #pw { color: var(--muted); flex: none; }
#cult .xbar { display: block; height: 8px; background: var(--panel-lo); position: relative; box-shadow: 0 0 0 1px var(--ink); }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(var(--jade), #2f9a76); }

#cult.ready { background: #4a2a1a; animation: readyPulse 1s steps(2) infinite; }

#stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
#stats button { border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-width: 0;
  background: var(--panel); color: var(--text);

#stats button .k { color: var(--muted); white-space: nowrap; }

@keyframes readyPulse { 50% { background: #6a3a1a; } }
#date { color: var(--muted); white-space: nowrap; }

}

.float {

}

@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }

.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }

  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;

}

#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;

  background: var(--paper); color: var(--paper-ink);

#nav button {
  position: relative; border: 0; cursor: pointer; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel-hi); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--panel-lo), inset 0 2px 0 0 #4d4370;
}

.badge {

  padding: 0 2px; text-align: center; box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { transform: translateY(-2px); } }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#modal { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 6, 14, .72); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
#modal.mid { align-items: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 86%; display: flex; flex-direction: column; box-sizing: border-box;
  margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); margin-bottom: 10px;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--paper-lo), inset 0 3px 0 0 #fff6dc;
  animation: unroll .22s steps(5);
}

.sheet .rod { height: 8px; background: #7b4b2a; box-shadow: inset 0 2px 0 #a8693d, inset 0 -2px 0 #4a2a16; flex: none; }

.sheet .foot { padding: 8px 12px 12px; display: flex; gap: 8px; flex: none; }
.btn {
  flex: 1; border: 0; cursor: pointer; padding: 8px 10px; background: var(--seal); color: #fff6e6; text-align: center;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 #8e1f27, inset 0 2px 0 0 #e8636b;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn.alt { background: var(--paper-lo); color: var(--paper-ink); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 #b9a77c, inset 0 2px 0 0 #f2e6c9; }
.btn.gold { background: var(--gold); color: var(--paper-ink); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 #b98b1c, inset 0 2px 0 0 #fff0a8; }

.card {

  box-shadow: 0 -2px 0 0 #b9a77c, 0 2px 0 0 #b9a77c, -2px 0 0 0 #b9a77c, 2px 0 0 0 #b9a77c;
}

.card .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card .name { font-size: var(--fs); }
.card .right { text-align: right; flex: none; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.tag { padding: 0 4px; color: #1b1424; white-space: nowrap; }
.tag.rainbow { background: linear-gradient(90deg, #ff7a7a, #ffd36b, #7dff9a, #7ad7ff, #c48bff); }
.chip { padding: 0 4px; white-space: nowrap; background: var(--paper-lo); color: var(--paper-ink); }

.bar { height: 6px; background: #cbb98f; position: relative; box-shadow: 0 0 0 1px #a8946a; }

.muted { color: var(--paper-mute); }
.num { font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }

.big { font-size: calc(var(--fs) * 2); line-height: 1.25; }
.center { text-align: center; }
.seal { color: var(--seal); }
.goldt { color: #a8740b; }
.jadet { color: #1d8a63; }
.sep { height: 2px; background: #cdbb92; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 8px; background: #f7eed6; box-shadow: 0 0 0 2px #b9a77c; }
.check .box { width: 14px; height: 14px; background: #fff; box-shadow: 0 0 0 2px var(--paper-ink); flex: none; position: relative; }
.check.on .box::after { content: ""; position: absolute; inset: 3px; background: var(--seal); }
input.txt { background: #fff9ea; border: 0; padding: 6px 8px; color: var(--paper-ink); box-shadow: 0 0 0 2px var(--paper-ink); width: 100%; box-sizing: border-box; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; }

/* 功法（panel-arts.js）：五行标记、三个大槽、列表行、共鸣揭晓 */
.el { display: inline-block; min-width: 1.5em; text-align: center; padding: 0 3px; color: #1b1424; white-space: nowrap; box-shadow: 0 0 0 1px rgba(27, 20, 36, .35); }
