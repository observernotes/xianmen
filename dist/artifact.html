:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 6px;
  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }
#top .row { display: flex; align-items: center; gap: 8px; }
#pName { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#lifeBox.low b { color: var(--red); animation: blink 1s steps(2) infinite; }
#cult { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 0; color: var(--text); text-align: left; cursor: pointer; flex: none; }
#cult .row { display: flex; gap: 8px; align-items: baseline; }
#cult #realm { color: var(--gold); flex: none; }
#cult #xpTxt { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cult #pw { color: var(--muted); flex: none; }
#cult .xbar { display: block; height: 8px; background: var(--panel-lo); position: relative; box-shadow: 0 0 0 1px var(--ink); }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(var(--jade), #2f9a76); }
#cult .xbar i::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.35); }
#cult.ready { background: #4a2a1a; animation: readyPulse 1s steps(2) infinite; }
#cult.ready .xbar i { background: linear-gradient(var(--gold), #c08a1a); }
#cult.ready #xpTxt { color: var(--gold); }
#cult.away { opacity: .85; }
@keyframes readyPulse { 50% { background: #6a3a1a; } }
#date { color: var(--muted); white-space: nowrap; }
.res { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-weight: normal; }
#top .row.r2 { justify-content: space-between; }
.iconbtn {
  background: var(--panel-hi); border: 0; padding: 2px 6px; min-width: 32px; height: 24px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--panel-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 16px; height: 16px; }
.iconbtn.on { background: var(--jade); color: var(--ink); }
/* 场景 */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 5 / 4; max-width: 100%; flex: none; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: calc(var(--fs) * 2); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink);
}
#banner small { display: block; font-size: var(--fs); color: var(--text); }
#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--paper-lo);
}
#tip img { width: 32px; height: 32px; flex: none; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; }
/* 目标 */
#goal { display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 22px; }
#goal .lab { color: var(--seal); background: var(--paper); padding: 0 4px; flex: none; }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; }
/* 消息 */
#feed { flex: 1; min-height: 40px; overflow: hidden; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
#feed div { flex: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed div:first-child { color: var(--text); }
#feed .gold { color: var(--gold) !important; }
#feed .jade { color: var(--jade) !important; }
#feed .red { color: var(--red) !important; }
#feed span { color: #6f6690; margin-right: 6px; }
/* 底部按键 */
#nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: none; padding-bottom: 2px; }
#nav button {
  position: relative; border: 0; cursor: pointer; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel-hi); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--panel-lo), inset 0 2px 0 0 #4d4370;
}
#nav button:active { transform: translateY(2px); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink); }
#nav img { width: 24px; height: 24px; }
.badge {
  position: absolute; top: -6px; right: -4px; background: var(--seal); color: #fff; min-width: 14px; height: 14px; line-height: 14px;
  padding: 0 2px; text-align: center; box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { transform: translateY(-2px); } }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* 卷轴弹窗 */
#modal { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 6, 14, .72); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
#modal.mid { align-items: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 86%; display: flex; flex-direction: column; box-sizing: border-box;
  margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); margin-bottom: 10px;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--paper-lo), inset 0 3px 0 0 #fff6dc;
  animation: unroll .22s steps(5);
}
@keyframes unroll { from { transform: scaleY(.1); } to { transform: scaleY(1); } }
.sheet .rod { height: 8px; background: #7b4b2a; box-shadow: inset 0 2px 0 #a8693d, inset 0 -2px 0 #4a2a16; flex: none; }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; flex: none; }
.sheet header h2 { margin: 0; font-size: calc(var(--fs) * 2); font-weight: normal; line-height: 1.2; flex: 1; text-wrap: balance; }
.sheet header .close { background: none; border: 0; cursor: pointer; color: var(--paper-mute); font-size: calc(var(--fs) * 2); line-height: 1; padding: 0 4px; }
.sheet .body { overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.sheet .sub { color: var(--paper-mute); }
.sheet .foot { padding: 8px 12px 12px; display: flex; gap: 8px; flex: none; }
.btn {
  flex: 1; border: 0; cursor: pointer; padding: 8px 10px; background: var(--seal); color: #fff6e6; text-align: center;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 #8e1f27, inset 0 2px 0 0 #e8636b;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn.alt { background: var(--paper-lo); color: var(--paper-ink); box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 #b9a77c, inset 0 2px 0 0 #f2e6c9; }

<script>/* 废柴仙途 · 事件库（数据） */
(function (root) {
'use strict';
const EVENTS = [

/* ============================================================
 * 一、主线剧情（story）
 * 设定：戒中老祖 = 上古玄霄剑仙残魂。大徒弟陆天衡在其渡劫时背后偷袭，
 * 夺《玄霄剑典》上卷，改名《天剑九式》开创天剑宗；二徒弟墨离拼死将师尊
 * 残魂封入戒指，反背三千年“弑师”骂名。墨无痕是墨离后人，奉祖训寻戒。
 * 老祖记忆残缺，只记得墨离持剑刺来（实为刺向他身后的陆天衡）。合体期揭晓。
 * ============================================================ */
{
  id: 'story_r1', where: 'story', trigger: 'realm:1', speaker: 'elder',
  title: '混沌初醒',
  text: '筑基功成，丹田里杂乱的五色灵根竟融成一团混沌。戒指滚烫，老祖沉默半晌，声音头一回发颤：“混沌圣体……三千年了，本座只在一个人身上见过。”你追问是谁，老祖骂道：“问那么多，修炼去！”',
  choices: [
    { t: '追问到底', ok: { text: '老祖装睡，鼾声打得震天响。你却隐约听见一句梦呓：“……天衡，你那一剑，真狠啊。”', fx: { xp: 5, flag: 'st_r1' } } },
    { t: '乖乖修炼', ok: { text: '“这还差不多。”老祖哼了一声，悄悄渡来一缕精纯剑意，助你稳固境界。', fx: { xp: 8, flag: 'st_r1' } } }
  ]
},
{
  id: 'story_sect', where: 'story', trigger: 'sect', maxR: 7, speaker: 'elder',
  title: '入宗第一天',
  text: '你拜入{sect}，领了外门弟子的灰袍。管事师兄斜眼打量：“杂灵根出身？柴房正缺个劈柴的。”四周一阵哄笑。老祖在戒中打了个哈欠：“小家伙，劈给他看。”',
  choices: [
    { t: '一掌劈试剑石', duel: 0.8,
      ok: { text: '试剑石裂成两半，全场死寂。管事师兄的茶杯砸在自己脚面上，硬是没敢喊疼。', fx: { contrib: 3, xp: 4, title: '劈柴宗师' } },
      fail: { text: '试剑石纹丝不动，你的手肿了三圈。哄笑声更大了——这笔账，你记下了。', fx: { inj: 2 } } },
    { t: '真去劈柴', ok: { text: '你劈了一夜柴，每一斧都暗合剑理。清晨，柴堆整齐如剑阵，路过的长老驻足良久。', fx: { xp: 6, contrib: 1 } } }
  ]
},
{
  id: 'story_pet', where: 'story', trigger: 'pet',
  title: '认主',
  text: '灵宠落进你怀里，先冲着你指间的锈戒又嗅又拱，仿佛认得里头的气息，接着转头舔了舔你的手，尾巴摇得飞快。从今往后，洞府里多了一张要吃饭的嘴。',
  choices: [
    { t: '喂它灵草', cost: { herbs: 2 }, ok: { text: '它吃饱了打个嗝，喷出一小团灵火，把你的眉毛燎掉半边。看来战力是不用愁了。', fx: { buff: { atk: 1.3, ticks: 8 } } } },
    { t: '给它起名', ok: { text: '你想了十几个威风名字，它一个不理，唯独听到“饭桶”时耳朵竖了起来。就这么定了。', fx: { xp: 3, title: '饭桶之主' } } }
  ]
},
{
  id: 'story_r2', where: 'story', trigger: 'realm:2', npc: 'mo', speaker: 'mo',
  title: '夜半黑衣',
  text: '金丹初成的当夜，一道黑影无声立在你榻前，指尖已触到戒指。“把它给我，”黑衣人声音冷得像井水，“你不知道里面关着什么。”老祖罕见地没有开骂，只吐出两个字：“墨家。”',
  choices: [
    { t: '拔剑', duel: 1.5,
      ok: { text: '你拼着金丹震荡逼退他半步。黑衣人挑眉：“有点意思。我叫墨无痕，戒指先寄在你这。”', fx: { xp: 6, aff: { mo: 5 }, flag: 'st_mo_seen' } },
      fail: { text: '你被一指点飞，撞塌半面墙。黑衣人却收了手：“太弱。等你配得上它，我再来取。”', fx: { inj: 2, flag: 'st_mo_seen' } } },
    { t: '质问来意', ok: { text: '“问它当年做过什么。”黑衣人看了戒指一眼，转身没入夜色，窗台上留下一枚墨色剑穗。', fx: { aff: { mo: 3 }, xp: 3, flag: 'st_mo_seen' } } }

{
  id: 'story_r3', where: 'story', trigger: 'realm:3', speaker: 'elder',
  title: '残缺的剑诀',
  text: '元婴大成，天剑宗遣赵乾送来“贺礼”，实为示威。赵乾当众演了一式天剑九式，剑气削平半座山头。老祖冷笑：“好一招天河倒悬——可惜只偷了上半句，下半句在本座这里。”',
  choices: [
    { t: '当场补全', p: 0.7,
      ok: { text: '你依老祖所授随手一剑，剑气倒卷天河。赵乾脸色煞白：“你怎会我宗不传之秘！”仓皇而逃。', fx: { xp: 8, power: 0.03, flag: 'st_sword_flaw', title: '偷师的是你' } },

  ]
},
{
  id: 'story_rank12', where: 'story', trigger: 'rank:12',
  title: '榜上有名',
  text: '天骄榜金光一闪，你的名字挤进前十二。当年落霞城看你笑话的人，如今挤破头想讨一杯喜酒。榜首处，云无极的名字微微一亮——那位天下第一天骄，隔着万里看了你一眼。',
  choices: [
    { t: '遥遥举杯', ok: { text: '万里之外传来一声轻笑：“我在榜首等你，别让我等太久。”满城修士哗然。', fx: { xp: 6, title: '榜上钉子户' } } },
    { t: '大摆流水席', cost: { stones: 10 }, ok: { text: '流水席摆了三天。慕容家的贺礼被你原封退回，附言四字：当日之赐。', fx: { xp: 4, buff: { cul: 1.5, ticks: 10 } } } }

},
{
  id: 'story_boss5', where: 'story', trigger: 'boss:5', maxR: 7, speaker: 'elder',
  title: '万剑低眉',
  text: '剑冢之主倒下，漫山残剑忽然齐齐转向，剑尖朝下，如同行礼——拜的不是你，是你指间那枚锈戒。老祖许久才开口：“都是老伙计了……本座，回来晚了。”',
  choices: [
    { t: '代老祖还礼', ok: { text: '你躬身一拜，万剑齐鸣。一柄断剑自行飞入你手，剑脊铭文被人刻意磨去，只剩半个“霄”字。', fx: { item: 'w', itemUp: 1, flag: 'st_stele' } } },
    { t: '问这是何处', ok: { text: '“本座的旧居。”老祖只答了五个字，再不肯多说。一缕古老剑意却悄然渡入你的经脉。', fx: { power: 0.03, xp: 6, flag: 'st_stele' } } }

},
{
  id: 'story_r4', where: 'story', trigger: 'realm:4', npc: 'mo', speaker: 'mo',
  title: '半块玉简',
  text: '化神之日，墨无痕不请自来，将半块玉简拍在桌上：“我墨家祖训只有一句——寻回锈戒，问师祖：可曾信过墨离？”戒指骤然冰凉。老祖声音嘶哑：“墨离……那个逆徒，也配问？”',
  choices: [
    { t: '请老祖说完', ok: { text: '老祖只道记忆残缺，唯记得最后一幕：墨离持剑向他刺来。墨无痕攥紧玉简，指节发白，未发一言。', fx: { xp: 6, aff: { mo: 5 }, flag: 'st_half' } } },
    { t: '收下玉简', ok: { text: '你把玉简贴身收好。“另外半块，在天剑宗手里。”墨无痕走到门口顿了顿，“别死在我前头。”', fx: { xp: 4, aff: { mo: 8 }, flag: 'st_half' } } }

{

  choices: [
    { t: '一剑斩画', duel: 1.2,
      ok: { text: '画像一分为二，夹层里掉出半块玉简。楚天阔道心剧震，天剑宗众人鸦雀无声。', fx: { xp: 10, flag: 'st_lu', title: '欺师灭画' } },
      fail: { text: '你被画中剑意震退，却也震出了夹层里的半块玉简，一把抄在手中，扬长而去。', fx: { inj: 2, xp: 5, flag: 'st_lu' } } },
    { t: '当众质问', ok: { text: '你只问一句：“天剑九式，为何从无第十式？”天剑宗长老面色大变，草草收兵。夜里，有人把半块玉简放在了你门前。', fx: { xp: 7, flag: 'st_lu' } } }
  ]

{
  id: 'story_r6', where: 'story', trigger: 'realm:6', speaker: 'elder',
  title: '玄霄',
  text: '合体之日，两块玉简合二为一，三千年前的一幕重现：陆天衡自背后偷袭渡劫的师尊，墨离那一剑，刺的是师尊身后之人。他拼死将师尊残魂封入戒中，自己背了三千年弑师骂名。',

// ---------- 公式 ----------
L.si = p => p.r * 4 + p.s;
L.need = i => Math.floor(P.needBase * Math.pow(P.needGrow, i));
L.pNeed = p => L.need(L.si(p));
L.stageName = p => p.r >= 9 ? '真仙' : L.REALMS[p.r].n + L.STAGES[p.s];
L.isReady = st => !st.exp && st.p.s === 3 && st.p.xp >= L.pNeed(st.p) && st.p.r <= L.MAXR;
L.has = (st, k) => st.p.tr.includes(k);
L.lifespan = function (st) {
  const p = st.p;
  if (p.r >= 9) return Infinity;
  let y = L.REALMS[p.r].life * (1 + 0.05 * st.home.cave);
  if (L.has(st, 'longev')) y *= 1.5;
  if (L.friend(st, 'mo')) y *= 1.1;
  return y + (st.lifeBonus || 0);
};
L.lifeLeft = st => L.lifespan(st) - st.p.age;
L.desperate = st => st.p.r <= L.MAXR && L.lifeLeft(st) < L.lifespan(st) * 0.12;
L.gain = function (st) {
  const p = st.p, i = L.si(p);
  const base = L.need(i) / (P.monBase * Math.pow(P.monGrow, i));
  let m = L.TALENTS[p.t].cul * L.ARTS[p.a].m * L.arrayMult(st.home.array) * (1 + 0.5 * st.rebirth);
  const sc = L.sectOf(st); if (sc) m *= sc.cul;
  if (L.has(st, 'wise')) m *= 1.3;
  m *= L.culMult(st);
  if (p.inj > 0) m *= 0.5;
  if (st.exp) m *= 0.5;
  return base * m;
};
L.power = function (st) {
  const p = st.p, i = L.si(p);
  let v = P.pw0 * Math.pow(P.pwStage, i) * Math.pow(P.pwRealm, p.r);
  v *= L.TALENTS[p.t].atk * L.WEAPONS[p.w].m * L.PETS[p.pet ? p.pet.tier : 0].m * (1 + 0.25 * st.rebirth);
  if (L.has(st, 'sword')) v *= 1.5;
  const sc = L.sectOf(st); if (sc) v *= sc.atk;
  v *= L.atkMult(st);
  if (p.inj > 0) v *= 0.6;
  return v;
};
L.income = function (st) {
  let s = L.fieldInc(st.home.field) + 3 * Math.pow(2.1, st.p.r) + L.pay(st);
  if (L.has(st, 'koi')) s *= 1.5;
  return s;
};
L.hCost = (k, lv) => { const b = L.HOME.find(x => x.k === k); return Math.floor(b.base * Math.pow(b.grow, lv)); };
L.btRate = function (st, usePill) {
  const p = st.p;
  let v = L.REALMS[p.r].rate + st.home.furnace * 0.02 + p.fails * 0.12;
  if (usePill) v += 0.2;
  if (L.has(st, 'hero')) v += 0.1;
  if (L.has(st, 'alch')) v += 0.15;
  if (L.desperate(st)) v += 0.25;
  const sc = L.sectOf(st); if (sc) v += sc.bt;
  if (st.flags.sureBt) v = 1;
  return clamp(v, 0.05, 1);
};
L.expChance = function (st, k) {
  const T = L.power(st);
  const ratio = T / L.DREC[k];
  return { T, ratio, p: clamp(0.75 + 0.3 * Math.log2(Math.max(ratio, 1e-9)), 0.05, 0.98) };
};
L.unlocked = (st, k) => k <= st.p.r + 2;

// 天骄榜对手战力（按排名与周天数插值，由模拟校准）
const RA = [[1, 18.39], [2, 17.9], [4, 16.52], [12, 14.14], [30, 12.62], [45, 9.71], [60, 6.9], [72, 5.08], [85, 3.78], [100, 2.08]];
L.rivalPower = function (st, q) {
  const t = st.tick;
  let a = RA[RA.length - 1][1];
  for (let j = 0; j < RA.length - 1; j++) {
    const [q0, a0] = RA[j], [q1, a1] = RA[j + 1];
    if (q >= q0 && q <= q1) { a = a0 + (a1 - a0) * (q - q0) / (q1 - q0); break; }
  }
  const G = 0.026 * Math.min(t, 180) + 0.012 * Math.max(0, t - 180);
  return Math.exp(a + G);
};
L.rivalAt = function (st, q) { if (q === st.rank) return null; return st.ladder[q < st.rank ? q - 1 : q - 2]; };
L.rivalRank = function (st, id) { const i = st.ladder.findIndex(x => x.id === id); if (i < 0) return 0; return i + 1 < st.rank ? i + 1 : i + 2; };

  { t: '登顶天骄榜第一', c: st => st.bestRank <= 1, rw: 1e7 },
  { t: '踏入渡劫', c: st => (st.flags.maxR || 0) >= 8, rw: 2e7 },
  { t: '渡过飞升天劫，白日飞升', c: st => st.p.r >= 9, rw: 0 },
];
L.goalText = (st, g) => g.t.replace('{EX}', st.exName);
L.checkGoals = function (st) {
  while (st.goal < L.GOALS.length && L.GOALS[st.goal].c(st)) {
    const g = L.GOALS[st.goal];
    st.stones += g.rw;
    st.goal++;
    emit('goal', { t: L.goalText(st, g), rw: g.rw });
    if (g.rw) L.log(st, `【目标达成】${L.goalText(st, g)}，奖励灵石 ${L.fmt(g.rw)}`, 'gold');
  }
};

// ---------- 修为 ----------
function addXp(st, g) {
  const p = st.p;
  if (p.r > L.MAXR) return;
  p.xp += g;
  let ups = 0;
  while (p.s < 3 && p.xp >= L.pNeed(p)) { p.xp -= L.pNeed(p); p.s++; ups++; }
  if (p.s === 3 && p.xp >= L.pNeed(p)) {
    p.xp = L.pNeed(p);
    if (!st.flags.readyNotified && !st.exp) { st.flags.readyNotified = 1; emit('ready', p); }
  } else st.flags.readyNotified = 0;
  if (ups) emit('stageUp', { ups });
}
L.addXp = addXp;

// ---------- 洞府 ----------
L.upgrade = function (st, k) {
  const b = L.HOME.find(x => x.k === k);
  const lv = st.home[k];
  if (lv >= b.max) return false;
  const c = L.hCost(k, lv);
  if (st.stones < c) return false;
  st.stones -= c;
  st.home[k]++;
  L.log(st, `${b.n}升至 ${st.home[k]} 级${k === 'cave' ? '：' + caveName(st.home[k]) : ''}`);
  L.checkGoals(st);
  return true;
};

// ---------- 宝物 ----------
function rollTier(st, base, max) {
  const lucky = L.has(st, 'lucky') ? 2 : L.has(st, 'hero') ? 1.4 : 1;
  let t = base;
  if (R() < 0.2 * lucky) t++;
  if (R() < 0.05 * lucky) t++;
  if (R() < 0.15) t--;
  return clamp(t, 1, max);
}
L.giveItem = function (st, kind, tier) {
  const p = st.p;
  if (kind === 'pet') {
    const T = L.PETS[tier];
    const it = { kind, tier, name: pick(T.names) };
    if (!p.pet || p.pet.tier < tier) { const first = !p.pet; p.pet = { tier, name: it.name }; it.equip = true; if (first) L.fireTrigger(st, 'pet'); }
    else { it.value = Math.floor(L.price(st, 'egg') * 0.3); st.stones += it.value; }
    return it;
  }
  const list = kind === 'w' ? L.WEAPONS : L.ARTS;
  tier = clamp(tier, 1, list.length - 1);
  const it = { kind, tier, name: pick(list[tier].names) };
  if (p[kind] < tier) { p[kind] = tier; p[kind + 'n'] = it.name; it.equip = true; }
  else { it.value = Math.floor(L.price(st, 'box') * 0.3); st.stones += it.value; }
  return it;
};
L.buy = function (st, k) {
  const c = L.price(st, k);
  if (st.stones < c) return null;
  const r = st.p.r;
  if (k === 'life') {
    const used = st.lifePills[r] || 0;
    if (used >= 3) return null;
    st.lifePills[r] = used + 1;
    const add = Math.floor(L.REALMS[r].life * 0.1);
    st.lifeBonus += add;
    st.stones -= c;
    L.log(st, `服下延寿丹，寿元增加 ${add} 年`, 'jade');
    return { k, add };
  }
  st.stones -= c;
  if (k === 'pill') { st.pills++; return { k }; }
  if (k === 'box') {
    const kind = R() < 0.55 ? 'w' : 'a';
    const it = L.giveItem(st, kind, rollTier(st, 1 + Math.floor(r * (kind === 'w' ? 0.75 : 0.6)), kind === 'w' ? 7 : 6));
    return { k, it };
  }
  if (k === 'egg') {
    const it = L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(r * 0.6), 6));
    L.checkGoals(st);
    return { k, it };
  }
  return null;
};

// ---------- 突破 ----------
L.breakthrough = function (st, usePill) {
  if (!L.isReady(st)) return null;
  const p = st.p;
  if (usePill && st.pills <= 0) usePill = false;
  const rate = L.btRate(st, usePill);
  if (usePill) st.pills--;
  const ok = R() < rate;
  const sure = !!st.flags.sureBt; st.flags.sureBt = 0;
  const desp = L.desperate(st);
  const from = p.r;
  const before = L.power(st);
  const res = { ok, from, to: from + 1, rate, usedPill: usePill, before, trib: L.REALMS[Math.min(from + 1, 8)].trib, ascend: from === L.MAXR, lifeBefore: L.lifespan(st) };
  st.stats.bt++;
  if (ok) {
    p.r++; p.s = 0; p.xp = 0; p.fails = 0; st.flags.readyNotified = 0;
    st.flags.maxR = Math.max(st.flags.maxR || 0, p.r);
    if (p.r === 1 && !st.flags.awoke && st.rebirth === 0) { st.flags.awoke = 1; res.awaken = { from: p.t, to: 6 }; p.t = 6; }
    if (desp) st.stats.despWin++;
    res.sure = sure;
    L.fireTrigger(st, 'realm:' + p.r);
    if (p.r >= 9) { res.ascend = true; st.flags.ascended = 1; L.log(st, `★ ${p.name} 渡过九九天劫，白日飞升！`, 'gold'); }
    else L.log(st, `突破成功，踏入${L.REALMS[p.r].n}期！寿元增至 ${L.fmt(L.lifespan(st))} 年`, p.r >= 2 ? 'gold' : 'jade');
    res.after = L.power(st);
    res.lifeAfter = L.lifespan(st);
  } else {
    p.fails++; st.stats.btFails++;
    if (!L.has(st, 'steady')) { p.xp = Math.floor(L.pNeed(p) * 0.7); p.inj = Math.max(p.inj, 2); }
    else p.xp = Math.floor(L.pNeed(p) * 0.95);
    st.flags.readyNotified = 0;
    res.after = L.power(st);
    L.log(st, `冲击${from >= L.MAXR ? '飞升' : L.REALMS[from + 1].n}失败……下次成功率 +12%`, 'red');
  }
  L.checkGoals(st);
  return res;
};

// ---------- 历练 ----------
L.startExp = function (st, k) {
  if (st.exp || !L.unlocked(st, k)) return false;
  const rg = L.REGIONS[k];
  st.exp = { k, left: rg.mon, total: rg.mon };
  L.log(st, `御剑出发，前往【${rg.n}】历练`);
  return true;
};
L.resolveExp = function (st) {
  const e = st.exp; if (!e) return null;
  st.exp = null;
  const k = e.k;
  const ch = L.expChance(st, k);
  const ok = R() < ch.p;
  const res = { k, ok, ratio: ch.ratio, p: ch.p, items: [], stones: 0, pills: 0 };
  st.stats.exp++;
  const luck = L.has(st, 'lucky') ? 3 : L.has(st, 'hero') ? 2 : 1;
  if (ok) {
    st.stats.expWin++;
    const leap = ch.ratio < 0.6;
    res.leap = leap;
    let stones = L.DREW[k] * (0.85 + R() * 0.3);
    if (L.has(st, 'koi')) stones *= 1.5;
    if (L.friend(st, 'ye')) stones *= 1.2;
    if (leap) { stones *= 2; st.stats.leapWins++; }
    res.stones = Math.floor(stones);
    res.herbs = Math.round((1 + k * 0.5) * (0.6 + R() * 0.8) * (1 + st.p.r * 0.5));
    st.herbs += res.herbs;
    if (R() < 0.04 + k * 0.006) { res.treasure = 1; st.treasure++; }
    st.regionWins[k] = (st.regionWins[k] || 0) + 1;
    st.stones += res.stones;
    res.xp = L.gain(st) * 2 * L.REGIONS[k].mon * 0.75; // gain 已按历练减半，这里折回
    addXp(st, res.xp);
    if (R() < 0.6) res.pills++;
    if (k >= 4 && R() < 0.5) res.pills++;
    st.pills += res.pills;
    if (R() < 0.38) res.items.push(L.giveItem(st, 'w', rollTier(st, 1 + Math.floor(k * 0.62), 7)));
    if (R() < 0.32) res.items.push(L.giveItem(st, 'a', rollTier(st, 1 + Math.floor(k * 0.5), 6)));
    if (R() < 0.12 * luck) res.items.push(L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(k * 0.5), 6)));
    if (R() < 0.08 * luck) {
      const g = L.gain(st) * 2 * 12;
      addXp(st, g);
      res.fortune = pick(['坠落山崖，误入上古传承之地，得前辈遗泽，修为暴涨！', '于瀑布后发现一处洞天，内有千年灵乳，饮之修为大进！', '救下一位重伤的老者，老者临终传你毕生感悟！']);
    }
    if (st.sect) { res.contrib = L.contribFor(k) * (leap ? 2 : 1); st.sect.total += res.contrib; st.sect.pts += res.contrib; }
    L.log(st, `【${L.REGIONS[k].n}】历练${leap ? '越级' : ''}成功！灵石+${L.fmt(res.stones)}`, leap ? 'gold' : 'jade');
  } else {
    res.stones = Math.floor(L.DREW[k] * 0.1);
    st.stones += res.stones;
    st.p.inj = Math.max(st.p.inj, 3);
    L.log(st, `【${L.REGIONS[k].n}】历练失利，负伤而归`, 'red');
  }
  L.checkGoals(st);
  return res;
};

// ---------- 对决 ----------
L.duelChance = (P1, P2) => clamp(0.5 + 0.55 * Math.log2(P1 / P2), 0.03, 0.97);
// 三年之约：对手战力（约等于炼气圆满、带一件法器）
L.pactPower = () => P.pw0 * Math.pow(P.pwStage, 3.4) * 1.3 * 1.7;
L.pactDuel = function (st) {
  let S = L.power(st);
  const Q = L.pactPower();
  // 第一世尚未筑基时，戒中老祖借你一缕神魂之力
  const assist = st.rebirth === 0 && st.p.r === 0;
  if (assist) S *= 2.5;
  const p = L.duelChance(S, Q);
  const win = R() < p;
  st.pact = win ? 1 : -1;
  const res = { S, Q, p, win, assist };
  if (win) {
    st.beaten.mu = 1;
    res.stones = 600; st.stones += 600;
    L.log(st, `三年之约，${st.p.name}当众击败${st.exName}！满城哗然`, 'gold');
  } else L.log(st, `三年之约惜败于${st.exName}……来日天骄榜上再见分晓`, 'red');
  L.checkGoals(st);
  return res;
};
L.tournament = function (st) {
  const S = L.power(st);
  st.stats.tour++;
  const res = { n: st.stats.tour, startRank: st.rank, rounds: [], S };
  const mults = [0.5, 0.85, 1.2];
  for (let j = 0; j < 3; j++) {
    let q;
    if (st.rank === 1) q = 2;
    else {
      const target = S * mults[j];
      q = st.rank - 1; let best = Infinity;
      for (let x = st.rank - 1; x >= 1; x--) {
        const pw = L.rivalPower(st, x);
        const dlt = Math.abs(Math.log(pw / target));
        if (dlt < best) { best = dlt; q = x; }
        if (pw > target * 3) break;
      }
      // 宿敌优先：若范围内有宿敌，则挑战宿敌
      for (let x = st.rank - 1; x >= Math.max(1, q - 6); x--) { const rv = L.rivalAt(st, x); if (rv && rv.id && !st.beaten[rv.id] && L.rivalPower(st, x) < S * 1.6) { q = x; break; } }
    }
    const rv = L.rivalAt(st, q);
    const Q = L.rivalPower(st, q);
    const p = L.duelChance(S, Q);
    const win = R() < p;
    const round = { q, rv, P: Q, p, win };
    if (win) {
      if (st.rank === 1) round.defend = true; else st.rank = q;
      const rw = Math.floor(L.income(st) * 4 + L.DREW[Math.min(10, st.p.r + 1)] * 0.4 + 50);
      round.stones = rw; st.stones += rw;
      if (st.sect) { round.contrib = L.contribFor(Math.min(10, st.p.r + 1)); st.sect.total += round.contrib; st.sect.pts += round.contrib; }
      if (rv && rv.id) { round.first = !st.beaten[rv.id]; st.beaten[rv.id] = (st.beaten[rv.id] || 0) + 1; }
    }
    res.rounds.push(round);
    if (!win) break;
  }
  st.bestRank = Math.min(st.bestRank, st.rank);
  if (st.rank <= 12) L.fireTrigger(st, 'rank:12');
  res.endRank = st.rank;
  L.log(st, `第${res.n}届天骄论道落幕，${st.p.name}位列天骄榜第 ${st.rank}`, st.rank < res.startRank ? 'gold' : '');
  L.checkGoals(st);
  return res;
};

// ---------- 宗门 ----------
L.joinSect = function (st, id) {
  const sc = L.SECTS.find(x => x.id === id); if (!sc || st.sect) return false;
  st.sect = { id, rank: 0, total: 0, pts: 0, joined: st.tick, veins: 0, order: L.NINE.map(x => x.id), meets: 0, best: 9 };
  st.sect.best = L.sectPos(st);
  L.log(st, `拜入${sc.n}，成为外门弟子`, 'gold');
  L.fireTrigger(st, 'sect');
  L.checkGoals(st);
  return true;
};
// 原圣子（或圣女）的战力：约等于元婴初期、灵器加身
L.heirPower = () => P.pw0 * Math.pow(P.pwStage, 12) * Math.pow(P.pwRealm, 3) * 1.5 * 2.3;
L.promote = function (st) {
  if (!L.canPromote(st)) return null;
  const nx = L.SRANKS[st.sect.rank + 1];
  const res = { from: st.sect.rank, to: st.sect.rank + 1 };
  if (nx.duel) {
    const S = L.power(st), Q = L.heirPower();
    const p = L.duelChance(S, Q);
    res.duel = { S, Q, p, win: R() < p };
    if (!res.duel.win) { L.log(st, `挑战原${L.srankName(st, st.sect.rank + 1)}失利，来日再战`, 'red'); return res; }
  }
  st.sect.rank++;
  res.ok = true;
  L.log(st, `全宗震动！晋升${L.SECTS.find(x => x.id === st.sect.id).n}${L.srankName(st, st.sect.rank)}`, 'gold');
  L.checkGoals(st);
  return res;
};
L.vaultBuy = function (st, k) {
  if (!st.sect) return null;
  const c = L.vaultCost(st, k);
  if (st.sect.pts < c) return null;
  if (k === 'vpill') { st.sect.pts -= c; st.pills += 2; return { k }; }
  const tier = L.vaultTier(st, k);
  const key = k === 'vart' ? 'a' : 'w';
  if (st.p[key] >= tier) return null;
  st.sect.pts -= c;
  return { k, it: L.giveItem(st, key, tier) };
};
// 天剑宗来犯：对手是天剑宗长老团（约等于炼虚中期的强者）
L.warPower = () => P.pw0 * Math.pow(P.pwStage, 21) * Math.pow(P.pwRealm, 5) * 7;
L.sectWar = function (st) {
  const S = L.power(st), Q = L.warPower();
  const p = L.duelChance(S, Q);
  const win = R() < p;
  const res = { S, Q, p, win };
  if (win) {
    st.flags.warWon = 1;
    res.contrib = L.contribFor(Math.min(10, st.p.r + 2)) * 3;
    res.stones = Math.floor(L.DREW[Math.min(10, st.p.r + 1)] * 2);
    st.sect.total += res.contrib; st.sect.pts += res.contrib; st.stones += res.stones;
    L.log(st, '天剑宗大举来犯，你一人一剑立于山门，杀退来敌！', 'gold');
  } else {
    st.flags.war = st.tick + 24;
    L.log(st, '天剑宗来犯，宗门苦战方才退敌……此仇必报', 'red');
  }
  L.checkGoals(st);
  return res;
};

// 九宗会武：你作为本宗代表，挑战排名更高的宗门
L.sectMeet = function (st) {
  if (!st.sect) return null;
  st.sect.meets++;
  const S = L.power(st);
  const res = { n: st.sect.meets, start: L.sectPos(st), rounds: [], S };
  for (let j = 0; j < 3; j++) {
    const pos = L.sectPos(st);
    const q = pos === 1 ? 2 : pos - 1;
    const foe = L.nineAt(st, q);
    const Q = L.ninePower(st, q);
    const p = L.duelChance(S, Q);
    const win = R() < p;
    const rd = { q, foe, Q, p, win, defend: pos === 1 };
    if (win) {
      if (pos > 1) { const o = st.sect.order; [o[pos - 1], o[q - 1]] = [o[q - 1], o[pos - 1]]; }
      rd.contrib = L.contribFor(Math.min(10, st.p.r + 1)) * 2; st.sect.total += rd.contrib; st.sect.pts += rd.contrib;
      rd.stones = Math.floor(L.income(st) * 5 + 100); st.stones += rd.stones;
      if (foe.id === 'tianjian') st.flags.beatTianjian = (st.flags.beatTianjian || 0) + 1;
    }
    res.rounds.push(rd);
    if (!win || rd.defend) break;
  }
  res.end = L.sectPos(st);
  st.sect.best = Math.min(st.sect.best, res.end);
  L.log(st, `第${res.n}届九宗会武落幕，${L.sectOf(st).n}位列天下第 ${res.end} 宗`, res.end < res.start ? 'gold' : '');
  L.checkGoals(st);
  return res;
};

// ---------- 随机事件 ----------
L.randomEvent = function (st) {
  const p = st.p;
  const inc = L.income(st);
  const opts = [['enl', 22], ['cave', 18], ['rain', 10], ['pill', 8], ['bandit', 10], ['taunt', 9], ['fairy', 6], ['recruit', 6], ['ring', 3]];
  if (!p.pet || p.pet.tier < 3) opts.push(['beast', 5]);
  const kind = wpick(opts);
  const ev = { kind };
  switch (kind) {
    case 'enl': addXp(st, L.gain(st) * 6); ev.text = '观云海翻涌，忽有所悟——顿悟！修为大涨'; ev.cls = 'jade'; ev.pop = '顿悟！'; break;
    case 'cave': { const v = Math.floor(inc * 8 + 40); st.stones += v; ev.text = `于后山寻得一处古修洞府，得灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '洞府！'; break; }
    case 'rain': addXp(st, L.gain(st) * 3); ev.text = '天降灵雨，修为精进'; ev.cls = 'jade'; ev.pop = '灵雨'; break;
    case 'pill': { const n = 1 + (R() < 0.3 ? 1 : 0); st.pills += n; ev.text = `游方丹师路过洞府，赠下破境丹 ×${n}`; ev.cls = 'jade'; ev.pop = '赠丹'; break; }
    case 'bandit': {
      const S = L.power(st), Q = S * (0.45 + R() * 0.8);
      if (S >= Q * (0.8 + R() * 0.4)) { const v = Math.floor(inc * 5 + 60); st.stones += v; ev.text = `劫修夜闯洞府，被一剑斩退！缴获灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '斩敌'; }
      else { const v = Math.floor(st.stones * 0.1); st.stones -= v; ev.text = `劫修夜闯洞府，抢走灵石 ${L.fmt(v)}……此仇必报！`; ev.cls = 'red'; ev.pop = '被劫'; }
      break;
    }
    case 'taunt': ev.text = pick(['天剑宗弟子路过：“哟，这不是当年被逐出师门的废物吗？”——一指点出，那人倒飞三里。', '某世家少爷当街拦路：“乡下散修，见了本少爷还不让路？”——随手一挥，少爷跪地求饶。', '有人在酒楼嘲笑“杂灵根也想修仙”，看清你的修为后，吓得连杯子都摔了。']); ev.cls = 'gold'; ev.pop = '打脸！'; ev.stones = Math.floor(inc * 2 + 30); st.stones += ev.stones; break;
    case 'fairy': { const v = Math.floor(inc * 10 + 100); st.stones += v; ev.text = `救下一位被妖兽追杀的仙子，她临走时留下一只储物袋，内有灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '仙缘'; break; }
    case 'recruit': { const v = Math.floor(inc * 6 + 80); st.stones += v; ev.text = `某大宗长老亲自登门，欲收你为亲传弟子，被你婉拒。长老留下见面礼灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '招揽'; break; }
    case 'ring': {
      if (p.a < L.ARTS.length - 2) { p.a++; p.an = pick(L.ARTS[p.a].names); ev.text = `夜深人静，戒指微微发烫……“小子，你的根基够了，老夫传你《${p.an}》！”`; ev.cls = 'gold'; ev.big = true; }
      else { addXp(st, L.gain(st) * 10); ev.text = '戒中老祖为你讲道一夜，修为大进'; ev.cls = 'jade'; ev.pop = '讲道'; }
      break;
    }
    case 'beast': {
      const it = L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(p.r * 0.5), 6));
      ev.item = it; ev.big = true;

L.addAff = function (st, id, d) {

L.culMult = function (st) {

// ---------- 事件引擎（数据见 events.js） ----------
L.events = () => (root.EVENTS || (typeof require === 'function' ? (() => { try { return require('./events.js'); } catch (e) { return []; } })() : []));
L.fill = function (st, text) {
  const sc = L.sectOf(st);
  return String(text || '').replace(/\{su\}/g, L.npcName(st, 'su')).replace(/\{ye\}/g, L.npcName(st, 'ye')).replace(/\{ex\}/g, st.exName)
    .replace(/\{sect\}/g, sc ? sc.n : '宗门').replace(/\{name\}/g, st.p.name);
};
function flagOn(st, f) { return !!(st.eflags && st.eflags[f]); }
L.eligible = function (st, ev, where, ctx) {
  ctx = ctx || {};
  if (ev.where !== where) return false;
  const r = st.p.r;
  if (where === 'story') { if (ev.trigger !== ctx.trigger) return false; if (st.evDone[ev.id]) return false; }
  if (ev.once && st.evDone[ev.id]) return false;
  if (ev.minR !== undefined && r < ev.minR) return false;
  if (ev.maxR !== undefined && r > ev.maxR) return false;
  if (ev.need && !ev.need.every(f => flagOn(st, f))) return false;
  if (ev.not && ev.not.some(f => flagOn(st, f))) return false;
  if (ev.npc && ev.aff) { const a = L.aff(st, ev.npc); if (a < ev.aff[0] || a > ev.aff[1]) return false; }
  if (ev.sect === true && !st.sect) return false;
  if (ev.sect === false && st.sect) return false;
  if (ev.daolv === true && !st.daolv) return false;
  if (ev.daolv === false && st.daolv) return false;
  if (where === 'exp' && ev.bg && ctx.bg && !ev.bg.includes(ctx.bg)) return false;
  if (where !== 'story' && st.evLast[ev.id] !== undefined && st.tick - st.evLast[ev.id] < 40) return false;
  return true;
};
L.pickEvent = function (st, where, ctx) {
  const list = L.events().filter(ev => L.eligible(st, ev, where, ctx));
  if (!list.length) return null;
  // 尚未出现过的事件优先
  const fresh = list.filter(ev => st.evLast[ev.id] === undefined);
  const pool = fresh.length && R() < 0.75 ? fresh : list;
  return wpick(pool.map(ev => [ev, (ev.weight || 1) * (ev.npc ? 2.5 : 1)]));
};
L.fireTrigger = function (st, key) {
  for (const ev of L.events()) if (ev.where === 'story' && ev.trigger === key && !st.evDone[ev.id] && !st.storyQ.includes(ev.id) && L.eligible(st, ev, 'story', { trigger: key })) st.storyQ.push(ev.id);
};
L.eventById = id => L.events().find(e => e.id === id);
L.herbScale = st => 1 + st.p.r;
L.costOk = function (st, cost) {
  if (!cost) return true;
  if (cost.stones && st.stones < cost.stones * Math.max(L.income(st), 20)) return false;
  if (cost.pills && st.pills < cost.pills) return false;
  if (cost.herbs && st.herbs < cost.herbs * L.herbScale(st)) return false;
  return true;
};
L.costText = function (st, cost) {
  const a = [];
  if (cost.stones) a.push('灵石 ' + L.fmt(cost.stones * Math.max(L.income(st), 20)));
  if (cost.pills) a.push('破境丹 ' + cost.pills);
  if (cost.herbs) a.push('灵草 ' + L.fmt(cost.herbs * L.herbScale(st)));
  return a.join('、');
};
L.applyFx = function (st, fx) {
  const out = [];
  if (!fx) return out;
  const p = st.p, f = L.fmt;
  if (fx.xp) { const g = L.gain(st) * (st.exp ? 2 : 1) * fx.xp; addXp(st, g); out.push('修为 +' + f(g)); }
  if (fx.stones) { const v = Math.round(fx.stones * Math.max(L.income(st), 20)); st.stones = Math.max(0, st.stones + v); out.push('灵石 ' + (v >= 0 ? '+' : '') + f(v)); }
  if (fx.pills) { st.pills = Math.max(0, st.pills + fx.pills); out.push('破境丹 ' + (fx.pills > 0 ? '+' : '') + fx.pills); }
  if (fx.herbs) { const v = Math.round(fx.herbs * L.herbScale(st)); st.herbs = Math.max(0, st.herbs + v); out.push('灵草 ' + (v > 0 ? '+' : '') + f(v)); }
  if (fx.treasure) { st.treasure = Math.max(0, st.treasure + fx.treasure); out.push('天材地宝 ' + (fx.treasure > 0 ? '+' : '') + fx.treasure); }
  if (fx.life && p.r <= L.MAXR) { const v = Math.round(L.REALMS[p.r].life * fx.life / 100); st.lifeBonus += v; out.push('寿元 ' + (v >= 0 ? '+' : '') + f(v) + ' 年'); }
  if (fx.inj) { p.inj = Math.max(p.inj, fx.inj); out.push('负伤 ' + fx.inj + ' 周天'); }
  if (fx.item) {
    const kind = fx.item, up = fx.itemUp || 0;
    const base = kind === 'w' ? 1 + Math.floor(p.r * 0.75) : kind === 'a' ? 1 + Math.floor(p.r * 0.6) : 1 + Math.floor(p.r * 0.6);
    const it = L.giveItem(st, kind, base + up);
    const tn = kind === 'w' ? L.WEAPONS[it.tier].n : kind === 'a' ? L.ARTS[it.tier].n : L.PETS[it.tier].n;
    out.push((it.equip ? '获得' : '得到（已有更好的，换成灵石）') + tn + (kind === 'a' ? '《' + it.name + '》' : '【' + it.name + '】'));
    out.item = it;
  }
  if (fx.aff) for (const id in fx.aff) { const d = L.addAff(st, id, fx.aff[id]); if (d) out.push(`好感 ${L.npcName(st, id)} ${d > 0 ? '+' : ''}${d}`); }
  if (fx.flag) for (const fl of [].concat(fx.flag)) st.eflags[fl] = 1;
  if (fx.unflag) for (const fl of [].concat(fx.unflag)) delete st.eflags[fl];
  if (fx.buff) { st.buffs.push({ cul: fx.buff.cul, atk: fx.buff.atk, left: fx.buff.ticks || 6 }); out.push(fx.buff.cul ? `修炼速度 ×${fx.buff.cul}（${fx.buff.ticks || 6} 周天）` : `战力 ×${fx.buff.atk}（${fx.buff.ticks || 6} 周天）`); }
  if (fx.cul) { st.bonus.cul += fx.cul; out.push(`永久修炼速度 +${Math.round(fx.cul * 100)}%`); }
  if (fx.power) { st.bonus.atk += fx.power; out.push(`永久战力 +${Math.round(fx.power * 100)}%`); }
  if (fx.vein && st.sect) { st.sect.veins = (st.sect.veins || 0) + fx.vein; out.push(`宗门灵脉 +${fx.vein}（俸禄 +${fx.vein * 25}%）`); }
  if (fx.contrib && st.sect) { const v = L.contribFor(Math.min(10, p.r + 1)) * fx.contrib; st.sect.total += v; st.sect.pts += v; out.push('宗门贡献 +' + f(v)); }
  if (fx.talent && p.t < 6) { const from = p.t; p.t = Math.min(6, p.t + fx.talent); out.push(`灵根 ${L.TALENTS[from].n} → ${L.TALENTS[p.t].n}`); out.talent = true; }
  if (fx.trait && L.TRAITS[fx.trait] && !p.tr.includes(fx.trait)) { p.tr.push(fx.trait); out.push('获得天赋【' + L.TRAITS[fx.trait].n + '】'); }
  if (fx.title) { L.grantTitle(st, fx.title); out.push('获得称号「' + fx.title + '」'); }
  if (fx.daolv && !st.daolv) { st.daolv = fx.daolv; out.push(`与${L.npcName(st, fx.daolv)}结为道侣：双修，修炼速度 ×1.3`); L.log(st, `与${L.npcName(st, fx.daolv)}结为道侣`, 'gold'); L.fireTrigger(st, 'daolv'); }
  return out;
};
L.choiceLuck = st => (L.has(st, 'lucky') ? 0.1 : 0) + (L.has(st, 'hero') ? 0.05 : 0) + (L.friend(st, 'bai') ? 0.05 : 0);
L.resolveChoice = function (st, ev, idx) {
  const ch = ev.choices[idx];
  if (!ch || !L.costOk(st, ch.cost)) return null;
  if (ch.cost) L.applyFx(st, { stones: -(ch.cost.stones || 0), pills: -(ch.cost.pills || 0), herbs: -(ch.cost.herbs || 0) });
  let ok = true, duel = null;
  if (ch.duel) { const S = L.power(st), Q = S * ch.duel; const p = L.duelChance(S, Q); ok = R() < p; duel = { S, Q, p, win: ok }; }
  else if (ch.p !== undefined) ok = R() < Math.min(0.95, ch.p + L.choiceLuck(st));
  const br = ok ? ch.ok : (ch.fail || ch.ok);
  if (ev.npc) { st.npc = st.npc || {}; if (!st.npc[ev.npc]) st.npc[ev.npc] = { aff: 0 }; }
  st.evLast[ev.id] = st.tick;
  if (ev.once || ev.where === 'story') st.evDone[ev.id] = 1;
  st.stats.events++;
  const fx = L.applyFx(st, br && br.fx);
  const text = L.fill(st, br ? br.text : '');
  L.log(st, `【${L.fill(st, ev.title)}】${text}`.slice(0, 60), ok ? 'jade' : 'red');
  L.checkGoals(st);
  return { ok, duel, text, fx, hasRisk: ch.p !== undefined || !!ch.duel };
};

L.RECIPES = [
  { k: 'peiyuan', n: '培元丹', d: '服下立得 4 周天修为', herbs: 10 },
  { k: 'pojing', n: '破境丹', d: '突破成功率 +20%', herbs: 8 },
  { k: 'juling', n: '聚灵丹', d: '接下来 6 周天修炼速度 ×1.5', herbs: 16 },
  { k: 'yanshou', n: '延寿丹', d: '寿元 +8%（与坊市共用每境界三枚上限）', herbs: 12 },
  { k: 'xisui', n: '洗髓丹', d: '灵根提升一品（需葛老为知己或丹炉 8 级）', herbs: 30, treasure: 1 },
  { k: 'jiuzhuan', n: '九转金丹', d: '下一次大境界突破必定成功', herbs: 40, treasure: 2, minR: 2 },
];
L.QUAL = [{ n: '下品', m: 0.7 }, { n: '中品', m: 1 }, { n: '上品', m: 1.3 }, { n: '极品', m: 1.8 }];
L.herbCost = (st, rc) => Math.ceil(rc.herbs * L.herbScale(st));
L.alchRate = st => clamp(0.6 + 0.03 * st.home.furnace + (L.friend(st, 'ge') ? 0.15 : 0) + (L.has(st, 'alch') ? 0.15 : 0), 0.1, 0.97);
L.canCraft = function (st, k) {
  const rc = L.RECIPES.find(x => x.k === k);
  if (!rc || st.home.furnace < 1) return '需要先建丹炉';
  if (rc.minR && st.p.r < rc.minR) return '金丹期后方可炼制';
  if (k === 'xisui' && !(L.friend(st, 'ge') || st.home.furnace >= 8)) return '需葛老为知己或丹炉 8 级';
  if (k === 'xisui' && st.p.t >= 6) return '灵根已至巅峰';
  if (k === 'yanshou' && (st.lifePills[st.p.r] || 0) >= 3) return '本境界延寿丹已服满';
  if (k === 'jiuzhuan' && st.flags.sureBt) return '已有一枚九转金丹';
  if (st.herbs < L.herbCost(st, rc)) return '灵草不足';
  if ((rc.treasure || 0) > st.treasure) return '天材地宝不足';
  return '';
};
L.craft = function (st, k) {
  if (L.canCraft(st, k)) return null;
  const rc = L.RECIPES.find(x => x.k === k), p = st.p;
  st.herbs -= L.herbCost(st, rc);
  st.treasure -= rc.treasure || 0;
  st.stats.crafts++;
  const res = { k, n: rc.n };
  if (R() >= L.alchRate(st)) { res.ok = false; L.log(st, `炼制${rc.n}时炸炉了……灵草化为飞灰`, 'red'); return res; }
  res.ok = true;
  const pPerfect = 0.05 + st.home.furnace * 0.006 + (L.friend(st, 'ge') ? 0.05 : 0) + (L.has(st, 'alch') ? 0.05 : 0);
  const x = R();
  const q = x < pPerfect ? 3 : x < pPerfect + 0.25 ? 2 : x < pPerfect + 0.75 ? 1 : 0;
  res.q = q; const m = L.QUAL[q].m;
  if (q === 3) st.stats.perfect++;
  if (k === 'peiyuan') { const g = L.gain(st) * 4 * m; addXp(st, g); res.fx = '修为 +' + L.fmt(g); }
  else if (k === 'pojing') { const n = q === 3 ? 2 : 1; st.pills += n; res.fx = '破境丹 +' + n; }
  else if (k === 'juling') { const t = Math.round(6 * m); const c = q === 3 ? 2 : 1.5; st.buffs.push({ cul: c, left: t }); res.fx = `修炼速度 ×${c}（${t} 周天）`; }
  else if (k === 'yanshou') { st.lifePills[p.r] = (st.lifePills[p.r] || 0) + 1; const v = Math.round(L.REALMS[p.r].life * 0.08 * m); st.lifeBonus += v; res.fx = `寿元 +${L.fmt(v)} 年`; }
  else if (k === 'xisui') { const from = p.t; p.t = Math.min(6, p.t + 1); res.fx = `灵根 ${L.TALENTS[from].n} → ${L.TALENTS[p.t].n}`; res.talent = true; if (q === 3) { st.bonus.cul += 0.03; res.fx += '，极品药力再增修炼 3%'; } }
  else if (k === 'jiuzhuan') { st.flags.sureBt = 1; res.fx = '下一次突破必定成功'; }
  L.log(st, `丹成！${L.QUAL[q].n}${rc.n}：${res.fx}`, q === 3 ? 'gold' : 'jade');
  L.checkGoals(st);
  return res;
};

function curve(g, pts, r0, r1, fn) { // 沿控制点画一条由粗到细的身体

    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { if (dx * dx + dy * dy > r * r + 0.4) continue; const ch = fn(u, dx, dy, r, i); if (ch) put(g, Math.round(px + dx), Math.round(py + dy), ch); }

  dusk: { top: '#36286a', mid: '#b8507a', hor: '#ffb872', far: '#aa7290', mid2: '#76507e', near: '#4c3c66', mist: '#ffd2ac', amb: '#ffc6a6', light: 0.74 },

const KEYS = [[0, 'night'], [0.16, 'night'], [0.27, 'dawn'], [0.37, 'day'], [0.63, 'day'], [0.73, 'dusk'], [0.84, 'night'], [1, 'night']];
ART.skyAt = function (ph) {
  ph = ((ph % 1) + 1) % 1;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [a, ka] = KEYS[i], [b, kb] = KEYS[i + 1];
    if (ph >= a && ph <= b) {
      const t = b === a ? 0 : (ph - a) / (b - a);
      const A = SKY[ka], B = SKY[kb], o = {};
      for (const k in A) o[k] = typeof A[k] === 'number' ? A[k] + (B[k] - A[k]) * t : lerpC(A[k], B[k], t);
      return o;
    }
  }
  return Object.assign({}, SKY.night);
};

// ---------- 场景基础绘制 ----------
let ctx = null, W = 200;
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function ellipse(cx, cy, rx, ry, c) { ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01)))); ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function line(x0, y0, x1, y1, c, th) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); th = th || 1; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, th, th, c); }
ART.R = R; ART.disc = disc;
ART.setCtx = (c, w) => { ctx = c; W = w; };
// 临时把绘制目标切到离屏画布
function on(c, fn) { const pc = ctx, pw = W; ctx = c.getContext('2d'); W = c.width; try { fn(ctx); } finally { ctx = pc; W = pw; } return c; }
function atop(fn) { ctx.save(); ctx.globalCompositeOperation = 'source-atop'; fn(); ctx.restore(); }
function cut(fn) { ctx.save(); ctx.globalCompositeOperation = 'destination-out'; fn(); ctx.restore(); }
// 有序抖动：lvl 0..16 表示覆盖比例
const pats = new Map();
function pat(c, lvl) {
  const k = c + lvl; let p = pats.get(k);
  if (!p) { const cv = mk(4, 4), g = cv.getContext('2d'); g.fillStyle = c; for (let i = 0; i < 16; i++) if (BAYER[i] < lvl) g.fillRect(i & 3, i >> 2, 1, 1); p = g.createPattern(cv, 'repeat'); pats.set(k, p); if (pats.size > 4000) pats.clear(); }

  const out = []; let p = 7;
  for (let i = 0; i < 64; i++) { if (i % 8 === 7) { out.push(-1); continue; } p += Math.round((rr() - 0.5) * 4); p = Math.max(3, Math.min(12, p)); out.push(rr() < 0.18 ? -1 : p); }
  return out;
})();
let musicStep = 0, musicNext = 0;
function musicTick() {
  if (soundMode !== 0 || !AC || AC.state !== 'running') return;
  const a = AC;
  if (musicNext < a.currentTime) musicNext = a.currentTime + 0.05;
  while (musicNext < a.currentTime + 0.4) {
    const n = MELODY[musicStep % MELODY.length];
    const t0 = musicNext - a.currentTime;
    if (n >= 0) { const midi = 60 + 12 * Math.floor(n / 5) + SCALE[n % 5]; const f = 440 * Math.pow(2, (midi - 69) / 12); tone(f, t0, 0.9, 'triangle', 0.07, 'music'); tone(f * 2, t0, 0.25, 'sine', 0.02, 'music'); }
    if (musicStep % 8 === 0) { const root = [48, 45, 43, 50][(musicStep / 16 | 0) % 4]; tone(440 * Math.pow(2, (root - 69) / 12), t0, 2.4, 'sine', 0.06, 'music'); }
    musicStep++; musicNext += 0.42;
  }
}
setInterval(musicTick, 120);

const cloud = { ref: null, busy: false, lastTick: -1 };
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    if (!db || !user) { cloudStatus = '当前环境不可用'; return; }
    const uid = await user.id();
    if (!uid) { cloudStatus = '登录后可用'; return; }
    cloud.ref = db.doc('data/users/' + uid + '/save');
    cloudStatus = '已连接';
    const snap = await cloud.ref.get();
    if (snap.exists) {
      const data = snap.data();
      let remote = null;
      try { remote = data && typeof data.json === 'string' ? JSON.parse(data.json) : null; } catch (e) { remote = null; }
      if (remote && remote.v === 2 && (!st || ((remote.savedAt || 0) > (st.savedAt || 0) + 5000 && remote.tick !== st.tick))) offerCloud(remote);
    }
  } catch (e) { cloudStatus = '暂时无法连接'; }
}
async function saveCloud(force) {
  if (!cloud.ref || cloud.busy || !st) return;
  if (!force && st.tick === cloud.lastTick) return;
  cloud.busy = true;
  try {
    st.savedAt = Date.now();
    await cloud.ref.set({ json: JSON.stringify(st), savedAt: st.savedAt, v: 2 });
    cloud.lastTick = st.tick; cloudStatus = '已同步';
  } catch (e) {
    cloudStatus = e && e.code === 'invalid_argument' ? '当前权限无法云存档' : '同步失败，稍后重试';
    if (e && e.code === 'invalid_argument') cloud.ref = null;
  }
  cloud.busy = false;
}

  const res = L.pactDuel(st);
  const ex = st.exName;
  duel({
    title: '三年之约', intro: '三年之期已到。落霞城擂台下人山人海，都来看那个被退婚的“废物”如何收场。',
    right: { img: rivalAvImg({ n: ex, id: 'mu' }, 66), name: ex, sub: fmt(res.Q) }, Q: res.Q, S: res.S, win: res.win,
    quote: `${ex}：“三年了，废物终究是废物。现在认输，我还能给你留几分颜面。”`,
    winText: `${res.assist ? '危急关头，戒指中涌出一股浩瀚之力！<br>' : ''}一招落定，${esc(ex)}倒退十余步，满城哗然！<br>“莫欺少年穷！今日之后，你我再无瓜葛。”<br>灵石 +${fmt(res.stones || 0)}`,
    loseText: `${esc(ex)}冷笑离去。你攥紧拳头：天骄榜上，我们再见分晓！`,

// ---------- 天骄论道 ----------
const TAUNTS = ['区区散修，也敢上论道台？', '今日便让你知道天高地厚！', '哼，不自量力。', '我宗天骄，岂是你能比的？', '早点认输，免得丢人现眼。'];
const SHOCK = ['这……这不可能！', '台下一片哗然！', '对面师长脸色铁青。', '观战众人倒吸一口凉气！'];
const RIVAL_LINES = {
  mu: ['废物，三年过去，你还是废物。', '怎……怎么可能？当年那个废物……'],
  zhao: ['当年一脚把你踢下山，今天照样！', '师……师弟，当年是师兄有眼无珠！'],
  chu: ['天剑宗圣子，岂是你这弃徒能挑战的？', '我楚天阔……竟输给一个弃徒？！'],
  xue: ['正道蝼蚁，也配让本圣子出手？', '此人……不可力敌，撤！'],
  yun: ['我在榜首等你很久了。来吧。', '好剑。天下第一，是你的了。'],
};
function runTournament() {
  const res = L.tournament(st);
  rankShown = res.startRank;
  let step = -1;
  const next = () => {
    step++;
    if (step === 0) {
      SFX.gong();
      sheet({ title: `第${res.n}届 天骄论道`, center: true, noClose: true,
        body: `<p class="center">天下天骄齐聚论道台，以战论道，排定天骄榜！</p><div class="center">${myAvImg(52)}</div><p class="center num">战力 ${fmt(res.S)} · 当前天骄榜第 ${res.startRank}</p>`,
        foot: [{ t: '登台！', gold: true, fn: next }] });
      return;
    }
    const rd = res.rounds[step - 1];
    if (!rd) { summary(); return; }
    const rv = rd.rv || { n: '无名', s: '' };
    const lines = rv.id ? RIVAL_LINES[rv.id] : null;
    duel({
      title: `第 ${step} 战`,
      right: { img: rivalAvImg(rv, 66), name: rv.n, sub: `${rv.s} · 第${rd.q}名 · ${fmt(rd.P)}` }, Q: rd.P, S: res.S, win: rd.win,
      quote: `${rv.n}：“${lines ? lines[0] : TAUNTS[(step + res.n) % TAUNTS.length]}”`,
      winText: `${rd.defend ? '卫冕天骄榜第一' : `排名升至第 ${rd.q}`} · 灵石+${fmt(rd.stones || 0)}${rd.contrib ? ` · 贡献+${fmt(rd.contrib)}` : ''}${lines && rd.first ? `<div class="quote">${esc(rv.n)}：“${esc(lines[1])}”</div>` : rd.P > res.S * 0.9 ? `<div class="muted">${SHOCK[step % SHOCK.length]}</div>` : ''}`,
      loseText: '对手底蕴深厚，来日再战。',
      btn: res.rounds[step] ? '下一战' : '论道落幕',
      done: () => { if (rd.win && !rd.defend) rankShown = rd.q; next(); },
    });
  };
  const summary = () => {
    const up = res.startRank - res.endRank;
    rankShown = 0;
    if (up > 0) banner(`天骄榜 ↑${up}`, `第 ${res.endRank} 名`);
    sheet({ title: '论道落幕', center: true,
      body: `<div class="center big ${up > 0 ? 'goldt' : ''}">天骄榜第 ${res.endRank}</div><p class="center">${up > 0 ? `排名 ${res.startRank} → ${res.endRank}，上升 ${up} 位！` : res.endRank === 1 ? '稳坐天骄榜第一！' : '排名未变，下届再战。'}</p>
        ${res.endRank === 1 && res.startRank > 1 ? `<div class="quote">四海天骄俯首，${esc(st.p.name)}，天下第一！</div>` : ''}`,
      foot: [{ t: '回洞府', gold: true, fn: closeModal }] });
  };
  next();
}

// ---------- 奇遇事件（选项） ----------
function speakerImg(ev, w) {
  const spk = ev.speaker || ev.npc;
  if (spk === 'elder') return `<img class="px" src="${ELDER}" style="width:${w}px;height:${w}px" alt="">`;
  if (spk && L.NPCS[spk]) return npcAvImg(spk, w);
  return myAvImg(w);
}
function showChoice(ev) {
  if (!ev || !st) return;
  const spk = ev.speaker || ev.npc;
  const who = spk && L.NPCS[spk] ? `<div class="seal">${esc(L.npcName(st, spk))} <span class="muted">${L.NPCS[spk].title}${L.met(st, spk) ? ' · 好感 ' + L.aff(st, spk) : ''}</span></div>` : spk === 'elder' ? '<div class="seal">戒中老祖</div>' : '';
  const luck = L.choiceLuck(st);
  const btns = ev.choices.map((c, i) => {
    const can = L.costOk(st, c.cost);
    const bits = [];
    if (c.cost) bits.push(L.costText(st, c.cost));
    if (c.duel) bits.push('胜算 ' + L.pct(L.duelChance(1, c.duel)));
    else if (c.p !== undefined) bits.push('把握 ' + L.pct(Math.min(0.95, c.p + luck)));
    return `<button class="btn ${i === 0 ? 'gold' : 'alt'}" data-c="${i}" ${can ? '' : 'disabled'}><span>${esc(L.fill(st, c.t))}</span><small>${esc(bits.join(' · '))}</small></button>`;
  }).join('');
  const s = sheet({
    title: (ev.where === 'story' ? '<span class="story-tag">主线</span>' : '') + esc(L.fill(st, ev.title)), center: true, noClose: true,
    body: `<div class="speaker">${speakerImg(ev, 56)}<div class="grow">${who}<p style="margin:4px 0 0">${esc(L.fill(st, ev.text))}</p></div></div><div class="choices">${btns}</div>`,
  });
  SFX.reveal(ev.where === 'story' ? 4 : 2);
  s.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => {
    SFX.tap();
    const res = L.resolveChoice(st, ev, +b.dataset.c);
    if (!res) return;
    const chips = res.fx.length ? `<div class="fxlist">${res.fx.map(f => `<span>${esc(f)}</span>`).join('')}</div>` : '';
    if (res.fx.talent) { flash(0.6); SFX.reveal(6); }
    if (res.duel) {
      duel({ title: L.fill(st, ev.title), right: { img: rivalAvImg({ n: ev.id }, 66), name: '对手', sub: fmt(res.duel.Q) }, Q: res.duel.Q, S: res.duel.S, win: res.duel.win,
        winText: esc(res.text) + chips, loseText: esc(res.text) + chips, done: closeModal });
      return;
    }
    if (res.hasRisk) { if (res.ok) SFX.win(); else SFX.fail(); } else SFX.coin();
    sheet({ title: esc(L.fill(st, ev.title)), center: true, noClose: true,
      body: `<div class="speaker">${speakerImg(ev, 44)}<p class="grow" style="margin:0">${esc(res.text)}</p></div>${chips}`,
      foot: [{ t: '继续', gold: true, fn: closeModal }] });
  });
}

// ---------- 炼丹 ----------
function showAlchemy() {
  const rate = L.alchRate(st);
  const body = L.RECIPES.map(rc => {
    const why = L.canCraft(st, rc.k);
    const cost = `灵草 ${fmt(L.herbCost(st, rc))}${rc.treasure ? ` · 天材地宝 ${rc.treasure}` : ''}`;
    return `<div class="card flat"><div style="flex:none">${iconHTML('pill', 28)}</div><div class="main"><div>${rc.n}</div><div class="muted">${rc.d}</div><div class="muted">${cost}${why ? ` · <span class="seal">${why}</span>` : ''}</div></div>
      <div class="right"><button class="btn sm ${why ? 'alt' : 'gold'}" data-r="${rc.k}" ${why ? 'disabled' : ''}>炼制</button></div></div>`;
  }).join('');
  const s = sheet({ title: '炼丹房', sub: `灵草 ${fmt(st.herbs)} · 天材地宝 ${st.treasure} · 成丹率 ${L.pct(rate)}${L.friend(st, 'ge') ? '（葛老指点）' : ''}`, body: body + '<div class="muted">灵田每周天产灵草，历练和奇遇也能得到。天材地宝来自地图首领与稀有机缘。成丹分下、中、上、极品四等。</div>' });
  s.querySelectorAll('button[data-r]').forEach(b => b.onclick = () => {
    const res = L.craft(st, b.dataset.r);
    if (!res) return;
    SFX.gather();
    const s2 = sheet({ title: '开炉炼丹', center: true, noClose: true, body: `<div class="center"><div class="clashL" style="display:inline-block">${iconHTML('pill', 56)}</div></div><p class="center muted">丹炉火起，药香弥漫……</p>` });
    setTimeout(() => {
      if (!res.ok) { SFX.fail(); sheet({ title: '炸炉了', center: true, body: `<p class="center">轰的一声，${res.n}没炼成，灵草化为飞灰。</p><p class="center muted">提升丹炉等级、与葛老交好，成丹率更高。</p>`, foot: [{ t: '再来', gold: true, fn: showAlchemy }] }); return; }
      const q = L.QUAL[res.q];
      if (res.q === 3) { flash(0.6); SFX.reveal(6); banner('丹纹九现', '极品' + res.n); } else SFX.win();
      sheet({ title: '丹成', center: true, body: `<div class="center">${iconHTML('pill', 44)}</div><div class="center big ${res.q === 3 ? 'goldt' : res.q === 2 ? 'jadet' : ''}">${q.n}${res.n}</div>${res.q === 3 ? '<p class="center seal">丹成之时，九道丹纹浮现，异香百里！</p>' : ''}<div class="fxlist"><span>${esc(res.fx)}</span></div>`, foot: [{ t: '继续炼丹', gold: true, fn: showAlchemy }] });
    }, 1100);
    void s2;
  });
}

// ---------- 人物 ----------
function ladderHTML() {
  const rows = [];
  const add = q => { const rv = L.rivalAt(st, q); rows.push(`<div class="${q === st.rank ? 'me' : ''}"><b>第${q}</b><span>${esc(rv ? rv.n : st.p.name)}${rv && rv.id ? ' <span class="seal">宿敌</span>' : ''}</span><span class="num">${fmt(q === st.rank ? L.power(st) : L.rivalPower(st, q))}</span></div>`); };
  const qs = new Set([1, 2, 3]);
  for (let q = st.rank - 2; q <= st.rank + 2; q++) if (q >= 1 && q <= 100) qs.add(q);
  let prev = 0;
  for (const q of [...qs].sort((a, b) => a - b)) { if (q - prev > 1) rows.push('<div class="muted"><b>…</b></div>'); add(q); prev = q; }
  return `<div class="ladder">${rows.join('')}</div>`;
}

      ${buffs ? `<dt>增益</dt><dd class="jadet">${buffs}</dd>` : ''}
      ${st.bonus.cul || st.bonus.atk ? `<dt>机缘加成</dt><dd>修炼 +${Math.round(st.bonus.cul * 100)}% · 战力 +${Math.round(st.bonus.atk * 100)}%</dd>` : ''}
    </dl>

  } else if (tab === 'bond') {

    }).join('') + '<div class="muted">好感来自奇遇中的选择。好感 60 结为知己获得永久加成；医修与魔门圣女二人中可择一结为道侣。</div>';
  } else if (tab === 'ach') {
    const got = L.ACHS.filter(a => st.ach[a.id]).length;
    body = `<div class="muted">已达成 ${got} / ${L.ACHS.length} · 点已获得的称号可佩戴</div>` + L.ACHS.map(a => `<div class="ach ${st.ach[a.id] ? '' : 'off'}" data-title="${st.ach[a.id] ? esc(a.t) : ''}"><b>${a.n}<br><span class="muted">${a.d}</span></b><span class="${st.title === a.t ? 'chip ok' : 'chip'}">「${a.t}」</span></div>`).join('')

    title: '重新开始', center: true, body: '<p>放弃当前进度，从头开始？这会清除本机与云端存档。</p>',

}
function resetGame() {

function rebirthPick() {
  const cards = L.rebirthCards(st, 3);

      <p class="muted center">仙缘加身：修炼速度 ×${(1 + 0.5 * n).toFixed(1)}，战力 ×${(1 + 0.25 * n).toFixed(2)}，初始灵石更多</p>`,
    foot: [{ t: '投胎转世', gold: true, disabled: true, fn: () => {} }] });
  const ok = s.querySelector('[data-fi="0"]');

    setTimeout(() => { c.classList.remove('hide'); const cv = c.querySelector('.cover'); if (cv) cv.remove(); c.classList.add('reveal'); SFX.reveal(cards[i].t); }, 350 + i * 450);

      ok.onclick = () => {
        const old = st, card = cards[i];
        const ns = L.newState({ name: old.p.name, female: old.p.look.f, rebirth: n, t: card.t, tr: card.tr, lives: old.lives });
        closeModal();
        loadState(ns);
        L.log(st, `第 ${n + 1} 世，${st.p.name}再踏仙途`, 'gold');

// ---------- 戒中老祖提示 ----------
function tip(key, text) {
  if (!st || st.seenTips[key]) return;
  st.seenTips[key] = 1;
  const el = $('#tip');
  const gone = st.eflags && st.eflags.st_farewell;
  el.innerHTML = `<img class="px" src="${ELDER}" alt=""${gone ? ' style="opacity:.4"' : ''}><div class="grow"><span class="who">${gone ? '戒中余音' : '戒中老祖'}：</span>${esc(text)}</div><span class="x">×</span>`;
  el.hidden = false;
  el.onclick = () => { el.hidden = true; SFX.tap(); };
}

// ---------- 每周天 ----------
let monthAcc = 0;
function onTick() {
  const out = L.tick(st, true);
  if (out.exp) { const r = out.exp; pushPopup(() => showExpResult(r)); }
  if (out.choice) { const ce = out.choice; pushPopup(() => showChoice(ce)); }
  if (out.event) {
    const ev = out.event;
    if (ev.big) pushPopup(() => showEvent(ev));
    else if (ev.pop && !st.exp) floatText(HOMEPOS.x, HOMEPOS.y - D().sit.h - 10, ev.pop, ev.cls === 'red' ? '#ff8a8a' : '#ffe39a');
  }
  if (out.pact) pushPopup(runPact);
  if (out.invite) pushPopup(showInvite);
  if (out.war) pushPopup(runWar);
  if (out.tourney) pushPopup(runTournament);
  if (out.meet) pushPopup(runSectMeet);
  if (out.death) pushPopup(showDeath);
  if (st.tick === 3) tip('exp', '光打坐可攒不下家底。点【历练】出去闯闯，打妖兽、拿灵石，还能捡到法宝功法！');
  if (st.tick === 8 && st.home.array === 0) tip('home', '灵石够了就去【洞府】升级聚灵阵，修炼更快；灵田每周天都产灵石。');
  if (st.tick === 10) tip('tour', '每 12 周天举行一届天骄论道，打赢了天骄榜排名飙升。那些看不起你的人，都在榜上等着。');
  if (L.desperate(st)) tip('life', '寿元将尽！去【坊市】买延寿丹，或者拼一把——寿元将尽时突破有绝境加成。');
  saveLocal();
}

// ---------- 主循环 ----------
let last = performance.now(), cloudAcc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  const sp = SPEEDS[speedIdx];
  const running = st && sp > 0 && $('#modal').hidden && !cine && $('#intro').hidden && st.p.r < 9;
  if (running) {
    L.flow(st, dt * sp / TICK_MS);
    monthAcc += dt * sp;
    if (monthAcc >= TICK_MS) { monthAcc -= TICK_MS; onTick(); }
    craneTimer -= dt;
    if (craneTimer <= 0 && !crane && !st.exp) { crane = { x: -12, y: 14 + Math.random() * 22, v: 0.02 }; craneTimer = 70000 + Math.random() * 60000; }
  }
  if (crane) { crane.x += crane.v * dt; if (crane.x > W + 14) crane = null; }
  drawScene(dt);
  hudTimer += dt;
  if (hudTimer > 200) { hudTimer = 0; updateHUD(); }
  cloudAcc += dt;
  if (cloudAcc > 60000) { cloudAcc = 0; saveCloud(); }
  requestAnimationFrame(frame);
}
function sceneClick(e) {
  if (!st || cine) return;
  ac();
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H - OY;
  if (crane && Math.abs(x - crane.x + 3) < 14 && Math.abs(y - crane.y) < 8) {
    if (Math.random() < 0.3) { st.pills++; floatText(crane.x, crane.y, '仙鹤衔丹 破境丹+1', '#ffe39a'); }
    else { const v = Math.floor(L.income(st) * 15 + 60); st.stones += v; floatText(crane.x, crane.y, '仙鹤献瑞 灵石+' + fmt(v), '#ffe39a'); }
    for (let k = 0; k < 24; k++) { const a = Math.random() * 6.28; parts.push({ x: crane.x, y: crane.y, vx: Math.cos(a) * 0.04, vy: Math.sin(a) * 0.04, life: 700, max: 700, c: '#ffe39a', s: 1 }); }
    SFX.coin(); crane = null; return;
  }
  if (st.exp) { SFX.tap(); showExp(); return; }
  const S = D().sit;
  if (Math.abs(x - HOMEPOS.x) < S.w / 2 + 4 && y > HOMEPOS.y - S.h - 14 && y < HOMEPOS.y + 4) { SFX.tap(); if (L.isReady(st)) showBreakthrough(); else showMe(); return; }
  if (y > 30 && y < 104 && x > 50 && x < 150) { SFX.tap(); showHome(); }
}
cvs.addEventListener('click', sceneClick);
$('#cult').addEventListener('click', () => { if (!st || cine) return; ac(); SFX.tap(); if (L.isReady(st)) showBreakthrough(); else showMe(); });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if (!b || !st || cine) return;
  ac(); SFX.tap();
  ({ exp: showExp, home: showHome, sect: showSect, market: showMarket, me: showMe })[b.dataset.nav]();
});
$('#btnSpeed').onclick = () => { ac(); speedIdx = (speedIdx + 1) % SPEEDS.length; SFX.tap(); savePref(); updateHUD(); };
$('#btnSound').onclick = () => { soundMode = (soundMode + 1) % 3; ac(); SFX.tap(); setSoundIcon(); savePref(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); saveCloud(); } });
window.addEventListener('pagehide', saveLocal);
window.addEventListener('resize', () => { setFontSize(); fitScene(); });

// ---------- 开场 ----------
const NAMES_M = ['林逸尘', '沈青川', '陆长风', '叶知秋', '苏念白', '顾清寒', '江离', '温如玉', '秦慕白', '萧云舟'];
const NAMES_F = ['苏清歌', '林晚照', '沈月白', '叶轻舟', '顾念安', '温若雪', '江明月', '秦挽歌'];
function showIntro() {
  const box = $('#intro');
  box.hidden = false;
  $('#modal').hidden = true;
  const lines = [
    ['天剑宗外门。', '“杂灵根也配修仙？滚出山门！”', '你被大师兄赵乾一脚踢下了山。'],
    ['同一天，婚约也被当众撕毁：', '“废物，你配不上慕容家。三年后落霞城论剑，你若敢来，我便让你输得心服口服。”', '“莫欺少年穷！三年之后，我必登台！”'],
    ['当夜，荒山破庙。', '一枚生锈的戒指在月光下微微发烫……', '“小家伙，老夫在戒中等了你三千年。”'],
    ['一个废柴的逆天仙途，从此开始。', '三年之约、天剑宗、天骄榜、宗门之巅——', '还有那九九天劫之后的，白日飞升。'],
  ];
  let page = 0, typing = null;
  const render = () => {
    const ls = lines[page];
    box.innerHTML = `<div class="story">${page === 0 ? '<h1>废柴仙途</h1>' : ''}${ls.map(() => '<p></p>').join('')}<p class="hint">点击继续 ▸</p></div>`;
    const ps = box.querySelectorAll('p:not(.hint)');
    let li = 0, ci = 0;
    clearInterval(typing);
    typing = setInterval(() => {
      if (li >= ls.length) { clearInterval(typing); typing = null; return; }
      ps[li].textContent = ls[li].slice(0, ++ci);
      if (ci % 2) tone(880, 0, 0.02, 'square', 0.03);
      if (ci >= ls[li].length) { li++; ci = 0; }
    }, 40);
    box.querySelector('.story').onclick = () => {
      ac();
      if (typing) { clearInterval(typing); typing = null; ps.forEach((p, i) => p.textContent = ls[i]); return; }
      page++;

    };
  };
  render();
}
function setupForm() {
  const box = $('#intro');
  let female = 0;
  const pickName = () => { const a = female ? NAMES_F : NAMES_M; return a[Math.floor(Math.random() * a.length)]; };
  box.innerHTML = `<div class="setup sheet" style="margin:0"><div class="rod"></div><header><h2>踏上仙途</h2></header>
    <div class="body">
      <div class="center"><img class="px" id="setupAv" alt=""></div>
      <label for="inName">姓名</label><div class="row"><input class="txt grow" id="inName" maxlength="6" value="${esc(pickName())}"><button class="btn sm alt" id="rdName" aria-label="随机姓名">换</button></div>
      <div class="row"><span>性别</span><button class="btn sm gold" id="gM">少年</button><button class="btn sm alt" id="gF">少女</button></div>
      <div class="muted">操作很简单：打坐自动涨修为 → 点【历练】打怪拿资源 → 升级洞府、买丹药 → 修为条变金时点它突破。</div>
    </div><div class="foot"><button class="btn gold" id="goStart">踏入仙途</button></div><div class="rod"></div></div>`;
  const inN = box.querySelector('#inName');
  const av = () => { const c = ART.avatar({ hair: '#2a2230', skin: '#f2c9a0', f: female }, 0, '#e6e1d3'); const img = box.querySelector('#setupAv'); img.src = c.toDataURL(); img.style.cssText = avStyle(c, 78); };
  av();
  box.querySelector('#rdName').onclick = () => { inN.value = pickName(); SFX.tap(); };
  const setG = f => { female = f; box.querySelector('#gM').className = 'btn sm ' + (f ? 'alt' : 'gold'); box.querySelector('#gF').className = 'btn sm ' + (f ? 'gold' : 'alt'); if ((f ? NAMES_M : NAMES_F).includes(inN.value)) inN.value = pickName(); av(); SFX.tap(); };
  box.querySelector('#gM').onclick = () => setG(0);
  box.querySelector('#gF').onclick = () => setG(1);
  box.querySelector('#goStart').onclick = () => {
    ac();
    const s = L.newState({ name: inN.value.trim() || pickName(), female });
    L.log(s, `${s.p.name}在荒山破庙中盘膝坐下，仙途由此开始`, 'gold');
    loadState(s);
    box.hidden = true;
    monthAcc = 0;
    SFX.gong();
    banner('废柴仙途', '三年之约 · 倒计时');
    setTimeout(() => tip('start', '先静心打坐。修为会自己涨，小境界自动提升。三年后的落霞论剑，可别给老夫丢人！'), 1800);
    saveLocal();
  };
}

// ---------- 启动 ----------
function start(data) {
  loadPref();
  setSoundIcon();
  const saved = (data && data.st && data.st.v === 2) ? data.st : loadLocal();
  if (saved && saved.v === 2) { loadState(saved); $('#intro').hidden = true; }
  else showIntro();
  updateHUD();
  fitScene();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  initCloud();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ st })); } catch (e) { /* ignore */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__xm = { get st() { return st; }, L, ART, setSpeed: i => { speedIdx = i; }, onTick, showBreakthrough, closeModal, showEvent, showInvite, runTournament, runPact, runWar, doPromote, showDeath, rebirthPick, showChoice, showAlchemy, fightBossUI, showMe, runSectMeet, get cine() { return !!cine; } };
})();
