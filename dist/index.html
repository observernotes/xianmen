:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 6px;
  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }
#top .row { display: flex; align-items: center; gap: 8px; }
#sectName { font-size: calc(var(--fs) * 1); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#date { color: var(--muted); white-space: nowrap; }
.res { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-weight: normal; }
#top .row.r2 { justify-content: space-between; }
.iconbtn {
  background: var(--panel-hi); border: 0; padding: 2px 6px; min-width: 32px; height: 24px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--panel-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 16px; height: 16px; }
.iconbtn.on { background: var(--jade); color: var(--ink); }
/* 场景 */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 5 / 4; max-width: 100%; flex: none; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: calc(var(--fs) * 2); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink);
}
#banner small { display: block; font-size: var(--fs); color: var(--text); }
#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--paper-lo);
}
#tip img { width: 32px; height: 32px; flex: none; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; }
/* 目标 */
#goal { display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 22px; }
#goal .lab { color: var(--seal); background: var(--paper); padding: 0 4px; flex: none; }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; }
/* 消息 */
#feed { flex: 1; min-height: 40px; overflow: hidden; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; }
#feed div { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed div:first-child { color: var(--text); }
#feed .gold { color: var(--gold) !important; }
#feed .jade { color: var(--jade) !important; }
#feed .red { color: var(--red) !important; }
#feed span { color: #6f6690; margin-right: 6px; }
/* 底部按键 */
#nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: none; padding-bottom: 2px; }
#nav button {
  position: relative; border: 0; cursor: pointer; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel-hi); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--panel-lo), inset 0 2px 0 0 #4d4370;
}

const G2 = '风云尘心玄渊河行遥霄羽霜烟月瑶儿宁澜歌舟白川竹秋书影然鸿野衡离渡宸璃笙岚溪'.split('');
const FUNNY = ['铁柱', '狗剩', '二牛', '翠花', '大壮', '石头', '小满', '富贵'];
L.randName = function (t) {
  const s = R() < 0.06 ? pick(SUR2) : pick(SUR);
  if (t === 0 && R() < 0.35) return s + pick(FUNNY);
  return s + pick(G1) + (R() < 0.85 ? pick(G2) : '');
};
const SECT_A = '青玄紫天太灵万九赤寒落星凌归无金碧幽云烈苍昆神圣浩元'.split('');
const SECT_B = ['剑宗', '法阁', '虚宫', '霄宫', '机阁', '极殿', '霞宗', '元宗', '炎门', '冰谷', '灵宗', '华派', '兽山', '鼎派', '花谷', '刚寺', '阳宗', '月宫', '雷殿', '雾门', '道院', '仙府', '剑阁', '魔宗'];
L.RIVAL = '天剑宗';

// ---------- 外观 ----------
const HAIR = ['#1d1a24', '#2b1f1a', '#3a2a22', '#4a3328', '#1f2633'];
const SKIN = ['#f2c9a0', '#e8b68a', '#f6d3b3', '#dca77c'];
function randLook(female) {
  return { hair: pick(HAIR), skin: pick(SKIN), f: female ? 1 : 0, style: ri(0, 1) };
}

// ---------- 公式 ----------
L.si = d => d.r * 4 + d.s;
L.need = i => Math.floor(P.needBase * Math.pow(P.needGrow, i));
L.dNeed = d => L.need(L.si(d));
L.stageName = d => d.r >= 9 ? '真仙' : L.REALMS[d.r].n + L.STAGES[d.s];
L.isReady = d => !d.away && d.s === 3 && d.xp >= L.dNeed(d) && d.r <= L.MAXR;

L.globalCul = function (st) { return (1 + 0.5 * st.rebirth) * (1 + 0.25 * st.ascended); };
L.gain = function (st, d) {
  const i = L.si(d);
  const base = L.need(i) / (P.monBase * Math.pow(P.monGrow, i));
  let m = L.TALENTS[d.t].cul * L.ARTS[d.a].m * L.arrayMult(st.b.array) * L.globalCul(st);
  if (d.tr === 'wise') m *= 1.3;
  if (d.tr === 'woke') m *= 1.2;
  if (d.inj > 0) m *= 0.5;
  if (d.away) m *= 0.5;
  return base * m;
};
L.power = function (st, d) {
  const i = L.si(d);
  let p = P.pw0 * Math.pow(P.pwStage, i) * Math.pow(P.pwRealm, d.r);
  p *= L.TALENTS[d.t].atk * L.WEAPONS[d.w].m * L.libMult(st.b.library);
  if (d.tr === 'sword') p *= 1.5;
  if (d.tr === 'strong') p *= 1.3;
  if (d.inj > 0) p *= 0.6;
  return p;
};
L.income = function (st) {
  let s = L.mineInc(st.b.mine);
  for (const d of st.ds) s += 2 * Math.pow(2, d.r);
  return s;
};
L.cap = st => 3 + st.b.gate;
L.bCost = (k, lv) => { const b = L.BUILD.find(x => x.k === k); return Math.floor(b.base * Math.pow(b.grow, lv)); };
L.recruitCost = st => Math.floor(60 * Math.pow(1.3, Math.min(st.recruits, 40)));
L.btRate = function (st, d, usePill) {
  let p = L.REALMS[d.r].rate + st.b.alchemy * 0.02 + d.fails * 0.12;
  if (usePill) p += 0.2;
  if (d.tr === 'hero') p += 0.1;
  if (d.tr === 'alch') p += 0.15;
  return clamp(p, 0.05, 1);
};
L.sectPower = function (st) {
  const ps = st.ds.map(d => L.power(st, d)).sort((a, b) => b - a);
  return (ps[0] || 0) + (ps[1] || 0) + (ps[2] || 0);
};
L.expChance = function (st, k, team) {
  const T = team.reduce((s, d) => s + L.power(st, d), 0);
  const ratio = T / L.DREC[k];
  return { T, ratio, p: clamp(0.75 + 0.3 * Math.log2(Math.max(ratio, 1e-9)), 0.05, 0.98) };
};

// 宗门榜对手战力：按“等效境界”插值
function stdPower(e) { // e: 等效小境界（可为小数），返回 3 人队伍的典型战力
  const r = Math.floor(e / 4);
  return 3 * P.pw0 * Math.pow(P.pwStage, e) * Math.pow(P.pwRealm, r + (e % 4) / 4) * Math.pow(1.35, e / 4) * 1.2;
}
L.stdPower = stdPower;
const RA = [[1, 19.63], [2, 19.25], [5, 18.06], [12, 15.92], [30, 11.5], [60, 6.9], [80, 4.71], [100, 3.0]];
L.rivalPower = function (st, q) {
  const y = st.year - 1 + st.month / 12;
  let a = RA[RA.length - 1][1];
  for (let j = 0; j < RA.length - 1; j++) {
    const [q0, a0] = RA[j], [q1, a1] = RA[j + 1];
    if (q >= q0 && q <= q1) { a = a0 + (a1 - a0) * (q - q0) / (q1 - q0); break; }
  }
  const G = 0.3 * Math.min(y, 15) + 0.12 * Math.max(0, y - 15);
  return Math.exp(a + G);
};
L.rivalName = function (st, q) {
  if (q === st.rank) return st.sect;
  return st.ladder[q < st.rank ? q - 1 : q - 2];
};

// ---------- 新档 ----------
let uid = 1;
L.newDisciple = function (st, t, opts) {
  opts = opts || {};
  let tr = '';
  if (opts.tr !== undefined) tr = opts.tr;
  else if (t <= 1 && R() < 0.06) tr = 'blood';
  else if (R() < 0.55) tr = wpick([['lucky', 10], ['sword', 10], ['alch', 10], ['wise', 12], ['strong', 12], ['koi', 8], ['steady', 8]]);
  const female = R() < 0.45;
  return {
    id: st.nextId++, name: opts.name || L.randName(t), t, tr,
    r: 0, s: opts.s || 0, xp: 0, w: 0, wn: '', a: 0, an: '',
    inj: 0, away: 0, fails: 0, master: !!opts.master, look: opts.look || randLook(female), slot: opts.master ? 0 : undefined,
    joined: st.year, mocked: 0, feats: 0,
  };
};

L.newState = function (o) {
  o = o || {};
  const st = {
    v: 1, sect: o.sect || '青岚宗', masterName: o.master || '林逸尘',
    year: 1, month: 1, stones: 300 + 600 * (o.rebirth || 0), rep: 0, pills: 1, pillProg: 0,
    b: { gate: 0, array: 0, mine: 0, library: 0, alchemy: 0 },
    ds: [], exps: [], rank: 100, bestRank: 100, ladder: [],
    recruits: 0, nextId: 1, goal: 0, log: [], rebirth: o.rebirth || 0, ascended: 0,
    ascendedList: [], beatRival: 0, cleared: 0, tourneys: 0, flags: {}, totalMonths: 0,
    seenTips: {}, stats: { exp: 0, expWin: 0, bt: 0, events: 0, maxPower: 0 },
  };
  // 宗门榜
  const used = new Set([st.sect, L.RIVAL]);
  const names = [];
  while (names.length < 98) {
    const nm = pick(SECT_A) + pick(SECT_B);
    if (!used.has(nm)) { used.add(nm); names.push(nm); }
  }
  names.splice(11, 0, L.RIVAL); // 天剑宗位列第 12
  st.ladder = names;
  const m = L.newDisciple(st, 1, { tr: 'hero', master: true, name: st.masterName, look: { hair: '#1d1a24', skin: '#f2c9a0', f: o.female ? 1 : 0, style: 0 } });
  st.ds.push(m);
  return st;
};

L.log = function (st, text, cls) {
  st.log.unshift({ t: `${st.year}年${st.month}月`, text, cls: cls || '' });
  if (st.log.length > 60) st.log.length = 60;
  emit('log', { text, cls });
};

// ---------- 目标 ----------
L.GOALS = [
  { t: '招收第一名弟子', c: st => st.recruits >= 1, rw: 150 },
  { t: '将聚灵阵升到 1 级', c: st => st.b.array >= 1, rw: 150 },
  { t: '派弟子去秘境历练一次', c: st => st.stats.exp >= 1, rw: 200 },
  { t: '门下弟子达到 3 人', c: st => st.ds.length >= 3, rw: 300 },
  { t: '任一弟子突破至筑基期', c: st => maxR(st) >= 1, rw: 500 },
  { t: '参加一次宗门大比', c: st => st.tourneys >= 1, rw: 800 },
  { t: '宗门排名进入前 60', c: st => st.bestRank <= 60, rw: 1500 },
  { t: '任一弟子结成金丹', c: st => maxR(st) >= 2, rw: 3000 },
  { t: '宗门排名进入前 30', c: st => st.bestRank <= 30, rw: 8000 },
  { t: '任一弟子修成元婴', c: st => maxR(st) >= 3, rw: 2e4 },
  { t: '在大比中击败天剑宗', c: st => st.beatRival > 0, rw: 6e4 },
  { t: '任一弟子踏入化神', c: st => maxR(st) >= 4, rw: 1.2e5 },
  { t: '宗门排名进入前 5', c: st => st.bestRank <= 5, rw: 4e5 },
  { t: '任一弟子踏入合体', c: st => maxR(st) >= 6, rw: 1e6 },
  { t: '成为天下第一宗', c: st => st.bestRank <= 1, rw: 3e6 },
  { t: '任一弟子踏入渡劫', c: st => maxR(st) >= 8, rw: 5e6 },
  { t: '渡过飞升天劫，白日飞升', c: st => st.ascended >= 1, rw: 1e7 },
];
function maxR(st) { let m = st.flags.maxR || 0; for (const d of st.ds) if (d.r > m) m = d.r; return m; }
L.maxR = maxR;
L.checkGoals = function (st) {
  while (st.goal < L.GOALS.length && L.GOALS[st.goal].c(st)) {
    const g = L.GOALS[st.goal];
    st.stones += g.rw;
    st.goal++;
    emit('goal', { t: g.t, rw: g.rw });
    L.log(st, `【目标达成】${g.t}，奖励灵石 ${L.fmt(g.rw)}`, 'gold');
  }
};

// ---------- 收徒 ----------
L.rollTalent = function (st) {
  const q = 0.09 * st.b.gate + 0.12 * st.rebirth + 0.06 * Math.log10(1 + st.rep);
  const base = [30, 36, 20, 9.5, 3.6, 0.8, 0.1];
  const w = base.map((v, t) => [t, v * Math.pow(1 + q, t)]);
  return wpick(w);
};
L.makeCandidates = function (st, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(L.newDisciple(st, L.rollTalent(st)));
  // 保底：第 10 次收徒必出单灵根以上
  if (st.recruits % 10 === 9 && !out.some(d => d.t >= 3)) out[ri(0, n - 1)].t = 3;
  return out;
};
L.recruit = function (st) {
  const c = L.recruitCost(st);
  if (st.stones < c) return null;
  st.stones -= c;
  const cands = L.makeCandidates(st, 3);
  st.recruits++;
  return cands;
};
L.accept = function (st, d) {
  if (st.ds.length >= L.cap(st)) return false;
  d.joined = st.year;
  st.ds.push(d);
  L.log(st, `${d.name}（${L.TALENTS[d.t].n}）拜入${st.sect}`, d.t >= 4 ? 'gold' : '');
  L.checkGoals(st);
  return true;
};
L.dismiss = function (st, d) {
  if (d.master || d.away) return false;
  st.ds = st.ds.filter(x => x !== d);
  L.log(st, `${d.name} 下山游历去了`);
  return true;
};

// ---------- 建设 ----------
L.upgrade = function (st, k) {
  const b = L.BUILD.find(x => x.k === k);
  const lv = st.b[k];
  if (lv >= b.max) return false;
  const c = L.bCost(k, lv);
  if (st.stones < c) return false;
  st.stones -= c;
  st.b[k]++;
  L.log(st, `${b.n} 升至 ${st.b[k]} 级`);
  L.checkGoals(st);
  return true;
};

// ---------- 突破 ----------
L.breakthrough = function (st, d, usePill) {
  if (!L.isReady(d)) return null;
  if (usePill && st.pills <= 0) usePill = false;
  const p = L.btRate(st, d, usePill);
  if (usePill) st.pills--;
  const ok = R() < p;
  const from = d.r;
  const before = L.power(st, d);
  const res = { ok, from, to: from + 1, rate: p, usedPill: usePill, before, d, trib: L.REALMS[Math.min(from + 1, 8)].trib, ascend: from === L.MAXR };
  st.stats.bt++;
  if (ok) {
    d.r++; d.s = 0; d.xp = 0; d.fails = 0;
    st.flags.maxR = Math.max(st.flags.maxR || 0, d.r);
    const repGain = Math.floor(5 * Math.pow(2.2, d.r));
    st.rep += repGain;
    res.repGain = repGain;
    if (d.r === 1 && d.master && !st.flags.masterWoke) { st.flags.masterWoke = 1; res.awaken = { from: d.t, to: 6 }; d.t = 6; }
    else if (d.r === 1 && d.tr === 'blood') { const to = R() < 0.3 ? 6 : 5; res.awaken = { from: d.t, to }; d.t = to; d.tr = 'woke'; }
    if (d.r === 2 && d.mocked === 1) { d.mocked = 2; res.revenge = true; st.rep += 50; st.stones += 2000; }
    if (d.r >= 9) {
      res.ascend = true;
      st.ascended++;
      st.ascendedList.push({ name: d.name, year: st.year, t: d.t, master: d.master });
      st.ds = st.ds.filter(x => x !== d);
      L.log(st, `★ ${d.name} 渡过九九天劫，白日飞升！宗门气运冲天！`, 'gold');
    } else {
      L.log(st, `${d.name} 突破成功，踏入${L.REALMS[d.r].n}期！`, d.r >= 2 ? 'gold' : 'jade');
    }
    res.after = d.r >= 9 ? before : L.power(st, d);
  } else {
    d.fails++;
    if (d.tr !== 'steady') { d.xp = Math.floor(L.dNeed(d) * 0.7); d.inj = Math.max(d.inj, 2); }
    else d.xp = Math.floor(L.dNeed(d) * 0.95);
    res.after = L.power(st, d);
    L.log(st, `${d.name} 冲击${L.REALMS[from + 1].n}失败……下次成功率 +12%`, 'red');
  }
  L.checkGoals(st);
  return res;
};

// ---------- 历练 ----------
L.unlocked = (st, k) => st.rep >= L.DUNGEONS[k].rep;
L.available = st => st.ds.filter(d => !d.away && d.inj <= 0);
L.autoTeam = function (st) {
  return L.available(st).sort((a, b) => L.power(st, b) - L.power(st, a)).slice(0, 3);
};
L.startExp = function (st, k, team) {
  if (!team.length || !L.unlocked(st, k)) return false;
  for (const d of team) d.away = 1;
  st.exps.push({ k, ids: team.map(d => d.id), left: L.DUNGEONS[k].mon, total: L.DUNGEONS[k].mon });
  L.log(st, `${team.map(d => d.name).join('、')} 出发前往【${L.DUNGEONS[k].n}】`);
  return true;
};
function giveItem(st, team, kind, tier) {
  const key = kind === 'w' ? 'w' : 'a';
  const list = kind === 'w' ? L.WEAPONS : L.ARTS;
  tier = clamp(tier, 1, list.length - 1);
  let best = null;
  for (const d of team) if (d[key] < tier && (!best || d[key] < best[key])) best = d;
  const name = pick(list[tier].names);
  if (best) {
    best[key] = tier; best[key + 'n'] = name;
    return { d: best, name, tier, kind };
  }
  return { sold: true, name, tier, kind };
}
L.resolveExp = function (st, e) {
  const team = e.ids.map(id => st.ds.find(d => d.id === id)).filter(Boolean);
  for (const d of team) d.away = 0;
  const k = e.k;
  const ch = L.expChance(st, k, team);
  const ok = R() < ch.p;
  const res = { k, ok, team, ratio: ch.ratio, p: ch.p, items: [], stones: 0, rep: 0, pills: 0, xp: 0 };
  st.stats.exp++;
  if (ok) {
    st.stats.expWin++;
    const leap = ch.ratio < 0.6;
    res.leap = leap;
    let stones = L.DREW[k] * (0.85 + R() * 0.3);
    if (team.some(d => d.tr === 'koi')) stones *= 2;
    if (leap) stones *= 2;
    res.stones = Math.floor(stones);
    st.stones += res.stones;
    res.rep = Math.floor((3 + k * k * 4 + k * 6) * (leap ? 2 : 1));
    st.rep += res.rep;
    for (const d of team) { const g = L.gain(st, d) * L.DUNGEONS[k].mon * 0.7; addXp(st, d, g); }
    if (R() < 0.6) { res.pills++; }
    if (k >= 4 && R() < 0.5) res.pills++;
    st.pills += res.pills;
    const luck = team.reduce((m, d) => Math.max(m, d.tr === 'lucky' ? 3 : d.tr === 'hero' ? 2 : 1), 1);
    if (R() < 0.38) res.items.push(giveItem(st, team, 'w', 1 + Math.floor(k * 0.62) + (R() < 0.15 * luck ? 1 : 0)));
    if (R() < 0.32) res.items.push(giveItem(st, team, 'a', 1 + Math.floor(k * 0.5) + (R() < 0.15 * luck ? 1 : 0)));
    for (const it of res.items) if (it.sold) { const v = Math.floor(L.DREW[k] * 0.25); st.stones += v; it.value = v; }
    if (R() < 0.08 * luck) {
      const d = pick(team);
      const g = L.gain(st, d) * 12;
      addXp(st, d, g);
      res.fortune = `${d.name}误入一处上古传承之地，得前辈遗泽，修为暴涨！`;
    }
    if (k > st.cleared) st.cleared = k;
    L.log(st, `【${L.DUNGEONS[k].n}】历练${leap ? '越级' : ''}成功！灵石+${L.fmt(res.stones)}`, leap ? 'gold' : 'jade');
  } else {
    res.stones = Math.floor(L.DREW[k] * 0.1);
    st.stones += res.stones;
    for (const d of team) d.inj = Math.max(d.inj, 3);
    L.log(st, `【${L.DUNGEONS[k].n}】历练失利，众弟子负伤而归`, 'red');
  }
  L.checkGoals(st);
  return res;
};

function addXp(st, d, g) {
  if (d.r > L.MAXR) return;
  d.xp += g;
  let ups = 0;
  while (d.s < 3 && d.xp >= L.dNeed(d)) {
    d.xp -= L.dNeed(d); d.s++; ups++;
  }
  if (d.s === 3 && d.xp >= L.dNeed(d)) {
    d.xp = L.dNeed(d);
    if (!d.readyNotified && !d.away) { d.readyNotified = 1; emit('ready', d); }
  } else d.readyNotified = 0;
  if (ups) emit('stageUp', { d, ups });
}
L.addXp = addXp;

// ---------- 宗门大比 ----------
L.tournament = function (st) {
  const S = L.sectPower(st);
  const res = { startRank: st.rank, rounds: [], S, year: st.year };
  st.tourneys++;
  res.n = st.tourneys;
  if (S <= 0) { res.endRank = st.rank; return res; }
  const mults = [0.5, 0.85, 1.2];
  for (let j = 0; j < 3; j++) {
    let q;
    if (st.rank === 1) { q = 2; }
    else {
      const target = S * mults[j];
      // 在排名高于自己的宗门里，找战力最接近目标的
      q = st.rank - 1; let best = Infinity;
      for (let x = st.rank - 1; x >= 1; x--) {
        const p = L.rivalPower(st, x);
        const dlt = Math.abs(Math.log(p / target));
        if (dlt < best) { best = dlt; q = x; }
        if (p > target * 3) break;
      }
    }
    const name = L.rivalName(st, q);
    const Pq = L.rivalPower(st, q);
    const p = clamp(0.5 + 0.55 * Math.log2(S / Pq), 0.03, 0.97);
    const win = R() < p;
    const round = { q, name, P: Pq, p, win, prevRank: st.rank };
    if (win) {
      if (st.rank === 1) round.defend = true;
      else {
        // 我方跃升到对手的位置
        const idx = q - 1; // ladder 中对手的位置（q < rank）
        st.rank = q;
        void idx;
      }
      const rw = Math.floor(L.income(st) * 4 + L.DREW[st.cleared] * 0.6 + 100);
      round.stones = rw; st.stones += rw;
      round.rep = Math.floor(10 + (100 - st.rank) * (100 - st.rank) * 0.06);
      st.rep += round.rep;
      if (name === L.RIVAL) { st.beatRival++; round.rival = true; }
    }
    res.rounds.push(round);
    if (!win) break;
  }
  st.bestRank = Math.min(st.bestRank, st.rank);
  res.endRank = st.rank;
  L.log(st, `第${st.tourneys}届宗门大比落幕，${st.sect}位列天下第 ${st.rank}`, st.rank < res.startRank ? 'gold' : '');
  L.checkGoals(st);
  return res;
};

// ---------- 随机事件 ----------
L.randomEvent = function (st) {
  const home = st.ds.filter(d => !d.away);
  if (!home.length) return null;
  const weightOf = d => d.tr === 'lucky' ? 3 : d.tr === 'hero' ? 2 : 1;

const SAVE_KEY = 'xianmen_save_v1';
const PREF_KEY = 'xianmen_pref_v1';
function saveLocal() { if (!st) return; try { st.savedAt = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) { /* 无痕模式等 */ } }
function loadLocal() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearLocal() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }
function savePref() { try { localStorage.setItem(PREF_KEY, JSON.stringify({ soundMode, speedIdx })); } catch (e) { /* ignore */ } }
function loadPref() { try { const p = JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); if (p.soundMode >= 0) soundMode = p.soundMode; if (p.speedIdx >= 0 && p.speedIdx < 3) speedIdx = p.speedIdx; } catch (e) { /* ignore */ } }
const cloud = { ref: null, busy: false, lastMonths: -1, lastAt: 0 };
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    if (!db || !user) { cloudStatus = '当前环境不可用'; return; }
    const uid = await user.id();
    if (!uid) { cloudStatus = '登录后可用'; return; }
    cloud.ref = db.doc('data/users/' + uid + '/save');
    cloudStatus = '已连接';
    const snap = await cloud.ref.get();
    if (snap.exists) {
      const data = snap.data();
      let remote = null;
      try { remote = data && typeof data.json === 'string' ? JSON.parse(data.json) : null; } catch (e) { remote = null; }
      if (remote && remote.v === 1 && (!st || (remote.savedAt || 0) > (st.savedAt || 0) + 5000) && (!st || remote.totalMonths !== st.totalMonths)) offerCloud(remote);
    }
  } catch (e) { cloudStatus = '暂时无法连接'; }
}
async function saveCloud(force) {
  if (!cloud.ref || cloud.busy || !st) return;
  if (!force && st.totalMonths === cloud.lastMonths) return;
  cloud.busy = true;
  try {
    st.savedAt = Date.now();
    await cloud.ref.set({ json: JSON.stringify(st), year: st.year, savedAt: st.savedAt, v: 1 });
    cloud.lastMonths = st.totalMonths; cloud.lastAt = Date.now();
    cloudStatus = '已同步';
  } catch (e) {
    cloudStatus = e && e.code === 'invalid_argument' ? '当前权限无法云存档' : '同步失败，稍后重试';
    if (e && e.code === 'invalid_argument') cloud.ref = null;
  }
  cloud.busy = false;
}
function offerCloud(remote) {
  const intro = !$('#intro').hidden;
  const go = () => sheet({
    title: '发现云端存档', center: true,
    body: `<p>云端有一份更新的存档：<br><b>${esc(remote.sect)}</b> · 第 ${remote.year} 年 · 天下第 ${remote.rank} 名</p><p class="muted">读取后会替换当前进度。</p>`,
    foot: [{ t: '保留当前', alt: true, fn: closeModal }, { t: '读取云存档', fn: () => { closeModal(); loadState(remote); $('#intro').hidden = true; } }],
  });
  if (intro) go(); else pushPopup(go);
}
function migrate(s) {
  if (!s || s.v !== 1) return null;
  s.flags = s.flags || {}; s.seenTips = s.seenTips || {}; s.stats = s.stats || { exp: 0, expWin: 0, bt: 0, events: 0, maxPower: 0 };
  let used = new Set();
  for (const d of s.ds) { if (d.slot === undefined || used.has(d.slot)) d.slot = freeSlot(s, used); used.add(d.slot); }
  for (const d of s.ds) if (!d.master && d.look && d.look.style === 2) d.look.style = 0;
  return s;
}
function freeSlot(s, used) {
  used = used || new Set(s.ds.map(d => d.slot));
  for (let i = 1; i < SLOTS.length; i++) if (!used.has(i)) return i;
  return SLOTS.length - 1;
}
function loadState(s) {
  st = migrate(s);
  L.hook = onHook;
  sprCache.clear(); avCache.clear();
  renderFeed(); updateHUD(true);
}

function onHook(type, data) {

    const [x, y] = slotPos(d);
    floatText(x, y - 16, L.STAGES[d.s] + '↑', '#8ff5d0');

    const nxt = d.r >= L.MAXR ? '飞升' : L.REALMS[d.r + 1].n;

// ---------- 秘境 ----------
function showDungeons() {
  const team = L.autoTeam(st);
  const exps = st.exps.map(e => {
    const names = e.ids.map(id => (st.ds.find(d => d.id === id) || {}).name).filter(Boolean).join('、');
    const p = (e.total - e.left) / e.total * 100;
    return `<div class="card flat"><div class="main"><div class="line"><span>【${L.DUNGEONS[e.k].n}】</span><span class="muted">${esc(names)}</span></div><div class="bar gold"><i style="width:${p}%"></i></div><div class="muted">还需 ${e.left} 个月归来</div></div></div>`;
  }).join('');
  const rows = L.DUNGEONS.map((dg, k) => {
    const un = L.unlocked(st, k);
    if (!un) return `<div class="card flat" style="opacity:.6"><div class="main"><div class="line"><span>${dg.n}</span></div><div class="muted">声望达到 ${fmt(dg.rep)} 解锁</div></div><div class="right"><span class="chip">未解锁</span></div></div>`;
    const ch = team.length ? L.expChance(st, k, team) : { p: 0 };
    const cls = ch.p >= 0.75 ? 'ok' : ch.p >= 0.4 ? 'warn' : 'bad';
    return `<div class="card" data-k="${k}"><div class="main"><div class="line"><span>${dg.n}</span><span class="muted">${dg.mon} 个月</span></div>
      <div class="muted">${dg.desc}</div><div class="muted num">推荐战力 ${fmt(L.DREC[k])} · 灵石约 ${fmt(L.DREW[k])}</div></div>
      <div class="right">${team.length ? `<span class="chip ${cls}">${L.pct(ch.p)}</span>${ch.ratio < 0.6 ? '<span class="seal">越级</span>' : ''}` : ''}</div></div>`;
  }).reverse();
  // 只显示最多两个未解锁
  let locked = 0; const shown = rows.filter((r, i) => { const k = L.DUNGEONS.length - 1 - i; if (!L.unlocked(st, k)) { locked++; return locked <= 1; } return true; });
  const avail = L.available(st).length;
  const body = `${exps ? `<div class="muted">历练中</div>${exps}<div class="sep"></div>` : ''}
    <div class="muted">${avail ? `可出战弟子 ${avail} 人 · 成功率按最强三人计算` : '暂无可出战的弟子'}</div>${shown.join('')}`;
  const s = sheet({ title: '秘境历练', sub: '成功率低于四成时冒险越级：赢了奖励翻倍，输了负伤三月', body });
  s.querySelectorAll('.card[data-k]').forEach(c => c.onclick = () => { SFX.tap(); if (!avail) return; showTeam(+c.dataset.k); });
}
function showTeam(k) {
  const dg = L.DUNGEONS[k];
  const avail = L.available(st).sort((a, b) => L.power(st, b) - L.power(st, a));
  let picked = new Set(avail.slice(0, 3).map(d => d.id));
  const render = () => {
    const team = avail.filter(d => picked.has(d.id));
    const ch = team.length ? L.expChance(st, k, team) : { p: 0, T: 0, ratio: 0 };
    const cls = ch.p >= 0.75 ? 'jadet' : ch.p >= 0.4 ? 'goldt' : 'seal';
    const body = `<div class="muted">${dg.desc} · 往返 ${dg.mon} 个月</div>
      <div class="center"><div class="muted">队伍战力 ${fmt(ch.T)} / 推荐 ${fmt(L.DREC[k])}</div><div class="big ${cls}" style="font-size:calc(var(--fs)*3)">${L.pct(ch.p)}</div>${ch.ratio && ch.ratio < 0.6 ? '<div class="seal">越级挑战！成功则奖励翻倍</div>' : '<div class="muted">成功率</div>'}</div>
      <div class="muted">选择出战弟子（最多 3 人）</div>
      ${avail.map(d => `<div class="check ${picked.has(d.id) ? 'on' : ''}" data-id="${d.id}"><span class="box"></span><img class="px" src="${avatarURL(d)}" style="width:22px;height:25px" alt=""><span class="grow">${esc(d.name)} <span class="muted">${L.stageName(d)}</span></span><span class="num">${fmt(L.power(st, d))}</span></div>`).join('')}`;
    const s = sheet({ title: dg.n, body, foot: [{ t: '返回', alt: true, fn: showDungeons }, { t: '出发', gold: true, disabled: !team.length, fn: () => {
      L.startExp(st, k, team);
      for (const d of team) anims.push({ d, type: 'leave', t: 0, dur: 1400 });
      SFX.coin();
      closeModal();
    } }] });
    s.querySelectorAll('.check[data-id]').forEach(c => c.onclick = () => {
      const id = +c.dataset.id; SFX.tap();
      if (picked.has(id)) picked.delete(id); else if (picked.size < 3) picked.add(id);
      render();
    });
  };
  render();
}
function showExpResult(res) {
  const dg = L.DUNGEONS[res.k];
  for (const d of res.team) if (st.ds.includes(d)) anims.push({ d, type: 'return', t: 0, dur: 1300 });
  const lines = [];
  lines.push(`<div class="row" style="justify-content:center;gap:6px">${res.team.map(d => `<img class="px" src="${avatarURL(d)}" style="width:44px;height:50px" alt="">`).join('')}</div>`);

    lines.push(`<dl class="grid2"><dt>灵石</dt><dd class="num">+${fmt(res.stones)}${res.leap ? '（翻倍）' : ''}</dd><dt>声望</dt><dd class="num">+${fmt(res.rep)}</dd>${res.pills ? `<dt>破境丹</dt><dd>+${res.pills}</dd>` : ''}<dt>修为</dt><dd>众弟子历练有成</dd></dl>`);
    for (const it of res.items) {
      const tierName = it.kind === 'w' ? L.WEAPONS[it.tier].n : L.ARTS[it.tier].n;
      const nm = it.kind === 'w' ? `${tierName}【${esc(it.name)}】` : `${tierName}功法《${esc(it.name)}》`;

      else lines.push(`<div class="quote"><b>${esc(it.d.name)}</b> 获得${nm}！${it.kind === 'w' ? `战力×${L.WEAPONS[it.tier].m}` : `修炼速度×${L.ARTS[it.tier].m}`}</div>`);
    }
    if (res.fortune) lines.push(`<div class="quote seal">奇遇！${esc(res.fortune)}</div>`);

  } else {
    lines.push('<div class="center big seal">铩羽而归</div>');

  sheet({ title: `历练归来 · ${dg.n}`, center: true, body: lines.join(''), foot: [{ t: res.ok ? '好！' : '知道了', gold: res.ok, fn: closeModal }] });
}

function ladderHTML() {
  const rows = [];
  const add = q => rows.push(`<div class="${q === st.rank ? 'me' : ''}"><b>第${q}</b><span>${esc(L.rivalName(st, q))}</span><span class="num">${fmt(q === st.rank ? L.sectPower(st) : L.rivalPower(st, q))}</span></div>`);
  const qs = new Set([1, 2, 3]);
  for (let q = st.rank - 2; q <= st.rank + 2; q++) if (q >= 1 && q <= 100) qs.add(q);
  const rq = st.ladder.indexOf(L.RIVAL);
  const rivalRank = rq + 1 < st.rank ? rq + 1 : rq + 2;
  qs.add(rivalRank);
  let prev = 0;
  for (const q of [...qs].sort((a, b) => a - b)) { if (q - prev > 1) rows.push('<div class="muted"><b>…</b></div>'); add(q); prev = q; }
  return `<div class="ladder">${rows.join('')}</div>`;
}

// ---------- 宗门大比 ----------
const TAUNTS = ['区区小宗，也敢来大比？', '今日便让你们知道天高地厚！', '哼，乡下宗门，不自量力。', '我宗弟子，岂是你等能比？', '早点认输，免得丢人现眼。'];
const SHOCK = ['这……这不可能！', '他们竟强到如此地步？！', '全场哗然！', '对面长老脸色铁青。', '观战众人倒吸一口凉气！'];
function runTournament() {
  const lineup = st.ds.slice().sort((a, b) => L.power(st, b) - L.power(st, a)).slice(0, 3);
  const res = L.tournament(st);
  rankShown = res.startRank;
  let step = -1;
  const myAv = lineup[0] ? avatarURL(lineup[0]) : '';
  const enemyCache = {};
  const enemyAv = (q, name) => {
    if (enemyCache[q]) return enemyCache[q];
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const fake = { id: 9000 + q, r: Math.max(0, Math.min(8, Math.floor(Math.log(L.rivalPower(st, q) / 30) / Math.log(9.1)))), t: 2, inj: 0, look: { hair: ['#1d1a24', '#3a2a22', '#5a2a2a'][h % 3], skin: '#e8b68a', f: h % 2, style: h % 3 } };
    enemyCache[q] = avatarURL(fake);
    return enemyCache[q];
  };
  const next = () => {
    step++;
    if (step === 0) {
      SFX.gong();
      sheet({
        title: `第${res.n}届 天下宗门大比`, center: true, noClose: true,
        body: `<p class="center">天下百宗齐聚，论道争锋！</p>
          <div class="center">本届出战：${lineup.map(d => `<img class="px" src="${avatarURL(d)}" style="width:40px;height:45px" alt="">`).join(' ')}</div>
          <p class="center num">我方战力 ${fmt(res.S)} · 当前天下第 ${res.startRank}</p>`,
        foot: [{ t: '出战！', gold: true, fn: next }],
      });
      return;
    }
    const rd = res.rounds[step - 1];
    if (!rd) { summary(); return; }
    const rival = rd.name === L.RIVAL;
    const taunt = rival ? (st.beatRival > 1 ? '这次……这次一定！' : `当年被我宗逐出门墙的杂灵根，也配站在这里？`) : TAUNTS[(step + res.year) % TAUNTS.length];
    const s = sheet({
      title: `第 ${step} 战`, center: true, noClose: true,
      body: `<div class="vs"><div class="side"><img class="px" id="vsL" src="${myAv}" style="width:66px;height:75px" alt=""><div>${esc(st.sect)}</div><div class="muted num">${fmt(res.S)}</div></div>
          <div class="vsx">VS</div>
          <div class="side"><img class="px" id="vsR" src="${enemyAv(rd.q, rd.name)}" style="width:66px;height:75px" alt=""><div>${esc(rd.name)}</div><div class="muted num">第${rd.q}名 · ${fmt(rd.P)}</div></div></div>
        <div class="quote">${esc(rd.name)}弟子：“${esc(taunt)}”</div>
        <div id="vsRes" class="center big" style="min-height:2.6em"></div>`,
      foot: [{ t: '……', alt: true, disabled: true, fn: next }],
    });
    const L1 = s.querySelector('#vsL'), R1 = s.querySelector('#vsR');
    L1.classList.add('clashL'); R1.classList.add('clashR');
    let hits = 0; const hi = setInterval(() => { SFX.hit(); if (++hits >= 3) clearInterval(hi); }, 330);
    setTimeout(() => {
      const box = s.querySelector('#vsRes'); const btn = s.querySelector('[data-fi="0"]');
      if (!box) return;
      if (rd.win) {
        if (!rd.defend) rankShown = rd.q;
        box.innerHTML = `<span class="goldt">胜！</span><div class="muted" style="font-size:var(--fs)">${rd.defend ? '卫冕天下第一' : `排名升至第 ${rd.q}`} · 灵石+${fmt(rd.stones)} 声望+${fmt(rd.rep)}</div>`;
        if (rival && st.beatRival === 1) box.innerHTML += `<div class="quote" style="font-size:var(--fs)">天剑宗长老颤声道：“当年……是我们看走了眼。”<br>${esc(st.masterName)}：“三十年河东，三十年河西，莫欺少年穷！”</div>`;
        else if (rd.P > res.S * 0.9) box.innerHTML += `<div class="muted" style="font-size:var(--fs)">${SHOCK[step % SHOCK.length]}</div>`;
        SFX.win();
      } else {
        box.innerHTML = `<span class="seal">惜败</span><div class="muted" style="font-size:var(--fs)">对手底蕴深厚，来年再战</div>`;
        SFX.fail();
      }
      btn.disabled = false; btn.textContent = res.rounds[step] ? '下一战' : '大比落幕'; btn.classList.remove('alt'); btn.classList.add('gold');
    }, 1150);
  };
  const summary = () => {
    const up = res.startRank - res.endRank;
    const stones = res.rounds.reduce((s, r) => s + (r.stones || 0), 0), rep = res.rounds.reduce((s, r) => s + (r.rep || 0), 0);
    rankShown = 0;
    if (up > 0) banner(`排名 ↑${up}`, `天下第 ${res.endRank}`);
    sheet({
      title: '大比落幕', center: true,
      body: `<div class="center big ${up > 0 ? 'goldt' : ''}">天下第 ${res.endRank}</div>
        <p class="center">${up > 0 ? `排名 ${res.startRank} → ${res.endRank}，上升 ${up} 位！` : res.endRank === 1 ? '稳坐天下第一！' : '排名未变，来年再战。'}</p>
        ${stones ? `<p class="center num">灵石 +${fmt(stones)} · 声望 +${fmt(rep)}</p>` : ''}
        ${res.endRank === 1 && res.startRank > 1 ? `<div class="quote">四海宗门俯首，${esc(st.sect)}，天下第一！</div>` : ''}`,
      foot: [{ t: '回山', gold: true, fn: closeModal }],
    });
  };
  next();
}

let monthAcc = 0;
function onMonth() {
  const out = L.monthTick(st, true);
  for (const r of out.exps) pushPopup(() => showExpResult(r));
  if (out.event) {
    const ev = out.event;
    if (ev.big) pushPopup(() => showEvent(ev));
    else if (ev.d && st.ds.includes(ev.d) && !ev.d.away) { const [x, y] = slotPos(ev.d); floatText(x, y - 18, { enl: '顿悟！', cave: '洞府！', rain: '灵雨', pill: '赠丹', demon: '退敌', taunt: '打脸！' }[ev.kind] || '奇遇', ev.cls === 'red' ? '#ff8a8a' : '#ffe39a'); }
  }
  if (out.tourney) pushPopup(runTournament);
  if (st.year === 1 && st.month === 10) tip('tour', '年末有天下宗门大比，最强的三名弟子出战。打赢了排名飙升，灵石声望滚滚来！');
  if (st.totalMonths === 2 && st.ds.length <= 1) tip('rec', '光杆掌门可不行。先点【收徒】招几个弟子吧！');
  if (st.ds.some(d => d.inj > 0)) tip('inj', '负伤的弟子修炼减半，几个月就好。突破失败也会负伤，但下次成功率会提高。');
  if (st.ds.length >= 2 && st.stats.exp === 0 && st.rep >= 0 && st.totalMonths > 10) tip('exp', '别闷头修炼了！去【秘境】历练，能拿灵石、法宝、功法和破境丹。');
  saveLocal();
}

// ---------- 主循环 ----------
let last = performance.now(), cloudAcc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  const sp = SPEEDS[speedIdx];
  const running = st && sp > 0 && $('#modal').hidden && !cine && $('#intro').hidden;
  if (running) {
    L.flow(st, dt * sp / MONTH_MS);
    monthAcc += dt * sp;
    if (monthAcc >= MONTH_MS) { monthAcc -= MONTH_MS; onMonth(); }
    // 仙鹤
    craneTimer -= dt;
    if (craneTimer <= 0 && !crane) { crane = { x: -12, y: 14 + Math.random() * 22, v: 0.02 }; craneTimer = 70000 + Math.random() * 60000; }
  }
  if (crane) { crane.x += crane.v * dt; if (crane.x > W + 14) crane = null; }
  drawScene(dt);
  hudTimer += dt;
  if (hudTimer > 200) { hudTimer = 0; updateHUD(); }
  cloudAcc += dt;
  if (cloudAcc > 60000) { cloudAcc = 0; saveCloud(); }
  requestAnimationFrame(frame);
}
function sceneClick(e) {
  if (!st || cine) return;
  ac();
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H - OY;
  if (crane && Math.abs(x - crane.x) < 10 && Math.abs(y - crane.y) < 8) {
    const pill = Math.random() < 0.3;
    if (pill) { st.pills++; floatText(crane.x, crane.y, '仙鹤衔丹 破境丹+1', '#ffe39a'); }
    else { const v = Math.floor(L.income(st) * 15 + 100); st.stones += v; floatText(crane.x, crane.y, '仙鹤献瑞 灵石+' + fmt(v), '#ffe39a'); }
    for (let k = 0; k < 24; k++) { const a = Math.random() * 6.28; parts.push({ x: crane.x, y: crane.y, vx: Math.cos(a) * 0.04, vy: Math.sin(a) * 0.04, life: 700, max: 700, c: '#ffe39a', s: 1 }); }
    SFX.coin(); crane = null; return;
  }
  let best = null, bd = 1e9;
  for (const d of st.ds) {
    if (d.away) continue;
    const [sx, sy] = slotPos(d);
    if (x > sx - 9 && x < sx + 9 && y > sy - 26 && y < sy + 2) { const dd = Math.abs(x - sx) + Math.abs(y - sy + 8); if (dd < bd) { bd = dd; best = d; } }
  }
  if (best) { SFX.tap(); if (L.isReady(best)) showBreakthrough(best); else showDisciple(best); return; }
  if (y > 34 && y < 86 && x > 60 && x < 140) { SFX.tap(); showBuild(); }
}
cvs.addEventListener('click', sceneClick);
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if (!b || !st || cine) return;
  ac(); SFX.tap();
  ({ disciples: showDisciples, recruit: showRecruit, dungeon: showDungeons, build: showBuild, sect: showSect })[b.dataset.nav]();
});
$('#btnSpeed').onclick = () => { ac(); speedIdx = (speedIdx + 1) % SPEEDS.length; SFX.tap(); savePref(); updateHUD(); };
$('#btnSound').onclick = () => { soundMode = (soundMode + 1) % 3; ac(); SFX.tap(); setSoundIcon(); savePref(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); saveCloud(); } });
window.addEventListener('pagehide', saveLocal);
window.addEventListener('resize', () => { setFontSize(); fitScene(); });

// ---------- 开场 ----------
const SECTS = ['青岚宗', '太微宗', '归云门', '凌霄阁', '玄真观', '紫阳宗', '落霞山', '问道宗', '无涯阁', '星河派'];
const MASTERS = ['林逸尘', '沈青川', '陆长风', '叶知秋', '苏念白', '顾清寒', '江离', '温如玉', '秦慕白', '萧云舟'];
function showIntro(re) {
  const box = $('#intro');
  box.hidden = false;
  $('#modal').hidden = true;
  if (re) { setupForm(re); return; }
  const lines = [
    ['天剑宗外门。', '“杂灵根也配修仙？滚出山门！”', '少年被当众逐出师门，扔下了山。'],
    ['他流落荒山，在破庙里捡到一枚生锈的戒指。', '“小子……老夫在戒中等了你三千年。”'],
    ['三月之后，荒山之巅，一座小小的宗门悄然立起。', '目标：收徒、炼丹、闯秘境、争排名——', '击败天剑宗，登顶天下，白日飞升！'],
  ];
  let page = 0, typing = null;
  const render = () => {
    const ls = lines[page];
    box.innerHTML = `<div class="story">${page === 0 ? '<h1>仙门崛起</h1>' : ''}${ls.map(() => '<p></p>').join('')}<p class="hint">点击继续 ▸</p></div>`;
    const ps = box.querySelectorAll('p:not(.hint)');
    let li = 0, ci = 0;
    clearInterval(typing);
    typing = setInterval(() => {
      if (li >= ls.length) { clearInterval(typing); typing = null; return; }
      ps[li].textContent = ls[li].slice(0, ++ci);
      if (ci % 2) tone(880, 0, 0.02, 'square', 0.03);
      if (ci >= ls[li].length) { li++; ci = 0; }
    }, 45);
    box.querySelector('.story').onclick = () => {
      ac();
      if (typing) { clearInterval(typing); typing = null; ps.forEach((p, i) => p.textContent = ls[i]); return; }
      page++;
      if (page >= lines.length) setupForm(null); else render();
    };
  };
  render();
}
function setupForm(re) {
  const box = $('#intro');
  let female = re && re.female ? 1 : 0;
  const sect = (re && re.sect) || SECTS[Math.floor(Math.random() * SECTS.length)];
  const master = (re && re.master) || MASTERS[Math.floor(Math.random() * MASTERS.length)];
  box.innerHTML = `<div class="setup sheet" style="margin:0"><div class="rod"></div><header><h2>${re ? `第 ${re.rebirth + 1} 世 · 转世重修` : '开宗立派'}</h2></header>
    <div class="body">
      <label for="inSect">宗门名号</label><div class="row"><input class="txt grow" id="inSect" maxlength="8" value="${esc(sect)}"><button class="btn sm alt" id="rdSect" aria-label="随机宗门名">换</button></div>
      <label for="inMaster">掌门姓名</label><div class="row"><input class="txt grow" id="inMaster" maxlength="6" value="${esc(master)}"><button class="btn sm alt" id="rdMaster" aria-label="随机姓名">换</button></div>
      <div class="row"><span>掌门形象</span><button class="btn sm ${female ? 'alt' : 'gold'}" id="gM">男</button><button class="btn sm ${female ? 'gold' : 'alt'}" id="gF">女</button></div>
      ${re ? `<div class="quote">仙缘加身：修炼速度 ×${(1 + 0.5 * re.rebirth).toFixed(1)}，初始灵石更多，天才弟子更易出现。</div>` : '<div class="muted">操作很简单：收徒 → 升级建筑 → 派弟子历练 → 点头顶有【！】的弟子突破。其余交给时间。</div>'}
    </div><div class="foot"><button class="btn gold" id="goStart">开宗立派</button></div><div class="rod"></div></div>`;
  const inS = box.querySelector('#inSect'), inM = box.querySelector('#inMaster');
  box.querySelector('#rdSect').onclick = () => { inS.value = SECTS[Math.floor(Math.random() * SECTS.length)]; SFX.tap(); };
  box.querySelector('#rdMaster').onclick = () => { inM.value = MASTERS[Math.floor(Math.random() * MASTERS.length)]; SFX.tap(); };
  const setG = f => { female = f; box.querySelector('#gM').className = 'btn sm ' + (f ? 'alt' : 'gold'); box.querySelector('#gF').className = 'btn sm ' + (f ? 'gold' : 'alt'); SFX.tap(); };
  box.querySelector('#gM').onclick = () => setG(0);
  box.querySelector('#gF').onclick = () => setG(1);
  box.querySelector('#goStart').onclick = () => {
    ac();
    const s = L.newState({ sect: inS.value.trim() || sect, master: inM.value.trim() || master, female, rebirth: re ? re.rebirth : 0 });
    s.ds[0].slot = 0;
    L.log(s, `${s.masterName}于荒山之巅立下${s.sect}，誓要登顶天下！`, 'gold');
    loadState(s);
    box.hidden = true;
    monthAcc = 0;
    SFX.gong();
    banner(s.sect, '开宗立派');
    setTimeout(() => tip('rec', '小子，光杆掌门可不行。先点下面的【收徒】，招几个弟子吧！'), 1800);
    saveLocal();
  };
}

// ---------- 启动 ----------
function start(data) {
  loadPref();
  setSoundIcon();
  const hotSt = data && data.st ? migrate(data.st) : null;
  const local = hotSt || migrate(loadLocal());
  if (local) { loadState(local); $('#intro').hidden = true; }
  else showIntro(null);
  updateHUD(true);
  fitScene();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  initCloud();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ st })); } catch (e) { /* ignore */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
// 调试与测试入口
window.__xm = { get st() { return st; }, L, setSpeed: i => { speedIdx = i; }, onMonth, showBreakthrough, closeModal, showEvent, get cine() { return !!cine; }, freeSlot: () => freeSlot(st) };
})();
</script>
