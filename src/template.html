<title>废柴仙途</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：竖屏单列游戏机——顶栏 / 像素场景 / 修为条 / 消息卷 / 底部五键；弹窗是展开的卷轴 */
@font-face {
  font-family: "XPixel";
  src: url(data:font/woff2;base64,/*FONT_B64*/) format("woff2");
  font-display: block;
}
:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --fs-m: 12px;
  --fs-l: 24px;
  --u1: 1px;
  --u2: 2px;
  /* 颜色语义（DESIGN §5.1）：修为玉绿、战力珊瑚、灵石青（图标与数字同色）；金只用于可操作/达成；朱用于危险和印章 */
  --c-xp: #4ccb9f;
  --c-atk: #ff9a8a;
  --c-stone: #7fe0f0;
  --q0: #b8b8b8; --q1: #62d26f; --q2: #4aa8ff; --q3: #c27dff; --q4: #ffb23f; --q5: #ff6b6b;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
@supports (image-rendering: pixelated) { img.px, canvas { image-rendering: pixelated; } }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(6px, env(safe-area-inset-top, 0px));
  padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
  gap: 6px;
  position: relative;
  overflow: hidden;
}
/* ===== 皮肤（DESIGN §5.1 / §6）：九宫格边框来自 ART.frame（core.js 写进 --fr-*），按 --u1 / --u2 整数倍放大 ===== */
.hud {
  border: calc(6 * var(--u1)) solid transparent; border-image: var(--fr-hud) 6 fill / calc(6 * var(--u1)) stretch;
  background: var(--panel); background-clip: padding-box; image-rendering: pixelated;
}
@supports (border-image-source: url(x)) { .hud { background: none; } }
/* 旧的阶梯阴影框（其他片段里可能还在用） */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* ---------- 顶栏 44：灵石（每周天）、破境丹、寿元条、声音、指南 ---------- */
#top { flex: none; padding: 0 2px; }
#top .row { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.res { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 0; }
.res b { font-weight: normal; font-size: var(--fs-m); }
.res small { color: var(--muted); font-size: var(--fs); }
.rstone b, .rstone small { color: var(--c-stone); }
.nup { animation: nUp .45s steps(3); } .ndn { animation: nDn .45s steps(3); }
@keyframes nUp { 0%, 60% { color: #b8ffe0; text-shadow: 0 0 0 #fff, 0 -1px 0 #4ccb9f; } }
@keyframes nDn { 0%, 60% { color: #ff9a9a; text-shadow: 0 1px 0 #c8323c; } }
.rstone small { opacity: .75; }
.rpill b { color: #ffb070; }
#lifeBox { flex: 1; min-width: 0; }
#lifeBox b { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.lbar { position: relative; flex: 1 1 40px; max-width: 64px; min-width: 24px; height: 6px; background: var(--panel-lo); box-shadow: 0 0 0 1px var(--ink); }
.lbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #c9a35a; }
#lifeBox.low .lbar i { background: var(--red); }
#lifeBox.low b { color: var(--red); animation: blink 1s steps(2) infinite; }
#top .iconbtn, #top .toxres { order: 9; }
@media (max-width: 400px) { #top .row { gap: 8px; } .lbar { display: none; } .rstone small { display: none; } }
#top .toxres { order: 8; }
.iconbtn {
  flex: none; border: 0; padding: 0; min-width: 44px; height: 44px; margin: -6px -2px; cursor: pointer; background: none; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: var(--fs-m);
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 20px; height: 20px; }
.iconbtn.on { color: var(--gold); }
/* ---------- 场景：全宽出血，画布按整数倍（fitScene），两侧不足时居中裁切 ---------- */
#sceneOuter {
  position: relative; flex: none; overflow: hidden; display: flex; justify-content: center;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  background: #0b0912; box-shadow: 0 2px 0 0 var(--ink), 0 -2px 0 0 var(--ink);
}
#sceneWrap { position: relative; flex: none; width: 400px; height: 320px; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
/* 场景叠层：左上年份季节、右上速度 */
#sceneTL { position: absolute; left: max(8px, env(safe-area-inset-left, 0px)); top: 6px; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px; pointer-events: none;
  background: rgba(11, 9, 18, .72); box-shadow: 0 0 0 2px var(--ink); color: var(--text); white-space: nowrap; }
#sceneTL #vRank { color: var(--muted); }
.sbtn { position: absolute; right: max(4px, env(safe-area-inset-right, 0px)); top: 0; min-width: 44px; height: 44px; border: 0; padding: 0 6px; cursor: pointer; background: none; color: var(--text); display: flex; align-items: center; justify-content: center; }
.sbtn::before { content: ""; position: absolute; inset: 6px 4px; background: rgba(11, 9, 18, .72); box-shadow: 0 0 0 2px var(--ink); z-index: -1; }
.sbtn { z-index: 1; isolation: isolate; font-size: var(--fs-m); }
.sbtn.on { color: var(--gold); }
.sbtn.on::before { box-shadow: 0 0 0 2px var(--gold); }
.sbtn:active { transform: translateY(1px); }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none; font-size: var(--fs-m);
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: var(--fs-l); }
.float.sm { font-size: var(--fs); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
.fxstamp { position: absolute; transform: translate(-50%, -50%); pointer-events: none; animation: stampIn 1.4s steps(14) forwards; }
@keyframes stampIn { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
/* 场景顶部的小横幅（高 28，一次一条，排队，DESIGN §5.2） */
#banner {
  position: absolute; left: 50%; top: 40px; transform: translateX(-50%); max-width: calc(100% - 24px); box-sizing: border-box; text-align: center; pointer-events: none; opacity: 0; z-index: 2;
  min-height: 28px; padding: 3px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; overflow: hidden;
  font-size: var(--fs-m); color: var(--gold); background: rgba(27, 19, 38, .9); box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 1px #6a4a2a, inset 0 2px 0 0 #3a2a4a;
}
#tip:not([hidden]) ~ #banner { top: 68px; }
#banner small { font-size: var(--fs); color: var(--text); overflow: hidden; text-overflow: ellipsis; }
#banner.show { animation: bannerIn 1.8s steps(18) forwards; }
@keyframes bannerIn { 0% { opacity: 0; margin-top: -8px; } 10% { opacity: 1; margin-top: 0; } 85% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示（老祖半身像 + 一句） */
#tip {
  position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); right: max(52px, calc(env(safe-area-inset-right, 0px) + 48px)); top: 6px; z-index: 3; display: flex; gap: 8px; align-items: center; min-height: 44px;
  color: var(--paper-ink); padding: 2px 4px; cursor: pointer;
  border: calc(6 * var(--u1)) solid transparent; border-image: var(--fr-card) 6 fill / calc(6 * var(--u1)) stretch;
  animation: pop .35s steps(6);
}
#tip img { width: 48px; height: 48px; flex: none; margin: -4px 0; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; padding: 0 4px; }
body:has(#modal:not([hidden])) #tip { visibility: hidden; }   /* 弹窗开着时气泡不露半截（压在弹窗后面只露一半） */
/* ---------- 境界牌：境界名（大字）+ 名号；修为条 16 高；圆满时整牌变金 = 突破入口 ---------- */
#cult { display: flex; flex-direction: column; gap: 4px; padding: 0 4px 2px; color: var(--text); text-align: left; cursor: pointer; flex: none; font: inherit; }
#cult .r1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
#cult #realm { font-size: var(--fs-l); line-height: 1.15; flex: none; color: #fff3d8; text-shadow: 2px 2px 0 var(--ink); }
#cult #pName { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
#cult .xbar { display: block; height: max(16px, calc(var(--fs) + 6px)); background: var(--panel-lo); position: relative; box-shadow: 0 0 0 2px var(--ink), inset 0 2px 0 0 #120e1c; }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#8ff5d0 0 3px, var(--c-xp) 3px 11px, #2f9a76 11px); transition: width .3s steps(6); }
#cult #xpTxt { position: absolute; inset: 0; padding: 0 6px; display: flex; align-items: center; font-style: normal; color: #f3ecdc; min-width: 0; overflow: hidden; white-space: nowrap;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink); }
#cult.ready { border-image-source: var(--fr-btnGold); animation: readyPulse 1s steps(2) infinite; }
#cult.ready #realm { color: var(--paper-ink); text-shadow: none; }
#cult.ready #pName { color: #6a4a10; }
#cult.ready .xbar i { background: linear-gradient(#fff2a8 0 3px, var(--gold) 3px 11px, #c08a1a 11px); }
#cult.ready #xpTxt { color: #fff6dc; }
#cult.away { opacity: .9; }
@keyframes readyPulse { 50% { filter: brightness(1.12); } }
/* ---------- 四格数值（点开看拆解） ---------- */
#stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; flex: none; }
#stats button { border: calc(6 * var(--u1)) solid transparent; border-image: var(--fr-hud) 6 fill / calc(6 * var(--u1)) stretch; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; min-width: 0; min-height: 48px;
  background: none; color: var(--text); font: inherit; }
#stats button .k { color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 2px; max-width: 100%; overflow: hidden; }
#stats button .k img { flex: none; }
#stats button b { font-weight: normal; font-size: var(--fs-m); color: var(--c-xp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
#stats button[data-s="atk"] b { color: var(--c-atk); }
#stats button[data-s="inc"] b { color: var(--c-stone); }
#stats button[data-s="big"] { border-image-source: var(--fr-btnSeal); }
#stats button[data-s="big"] .k { color: #ffe0d8; }
#stats button[data-s="big"] b { color: #fff6e0; }
#stats button[data-s="big"] b.lo { color: #ffd0c8; }
#stats button[data-s="big"] b.md { color: #fff2a8; }
#stats button[data-s="big"] b.hi { color: #b8ffe0; }
#stats button[data-s="big"].soon { animation: navHint 1s steps(2) infinite; }
#stats button:active { transform: translateY(1px); }
@media (max-width: 380px) { #stats button .k img { display: none; } }
/* .grow-row / .tipx：宿敌卡、新秀卡还在用（panel-rivals.js）；变强页已改成 .gw-*（KAIRO_PLAN §10） */
.grow-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; background: #f7eed6; }
.grow-row .gn { min-width: 0; }
.grow-row .gm { font-variant-numeric: tabular-nums; color: #1d8a63; }
.grow-row .gm.low { color: var(--seal); }
.grow-row .ga { justify-self: end; }
.grow-row .ga .btn { padding: 2px 8px; }
.grow-row .tipx { color: var(--paper-mute); grid-column: 1 / -1; }
#date { color: var(--text); white-space: nowrap; }
/* ---------- 札记卡 ---------- */
#goal { display: flex; align-items: center; gap: 8px; padding: 0 4px; min-height: 32px; flex: none; cursor: pointer; }
#goal .lab { color: #fff6e0; background: var(--seal); padding: 0 6px; flex: none; box-shadow: 0 0 0 1px var(--ink); }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .q { flex: none; color: var(--muted); }
#goal:active { transform: translateY(1px); }
/* 新手引导 */
#guide { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
#guide .spot { position: fixed; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9999px rgba(8, 6, 14, .62); pointer-events: none; animation: spotPulse 1s steps(2) infinite; }
#guide .spot.none { left: 50%; top: 40%; width: 0; height: 0; box-shadow: 0 0 0 9999px rgba(8, 6, 14, .62); animation: none; }
@keyframes spotPulse { 50% { box-shadow: 0 0 0 5px #fff6c0, 0 0 0 9999px rgba(8, 6, 14, .62); } }
#guide .garrow { position: fixed; color: var(--gold); font-size: var(--fs-l); line-height: 1; transform: translate(-50%, 0); text-shadow: 2px 2px 0 var(--ink); animation: arrowBob .6s steps(2) infinite; pointer-events: none; }
#guide .garrow.up { animation-name: arrowBobUp; }
@keyframes arrowBob { 50% { margin-top: 6px; } }
@keyframes arrowBobUp { 50% { margin-top: -6px; } }
#guide .gbox { position: fixed; left: 0; right: 0; margin: 0 auto; width: calc(100% - 24px); max-width: 456px; box-sizing: border-box; display: flex; gap: 8px; align-items: flex-start; padding: 4px 6px; pointer-events: auto;
  color: var(--paper-ink); border: calc(6 * var(--u2)) solid transparent; border-image: var(--fr-sheet) 6 fill / calc(6 * var(--u2)) stretch; animation: pop .3s steps(5); }
#guide .gav { width: 48px; height: 48px; flex: none; }
#guide .gmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#guide .gtext { font-size: var(--fs-m); }
#guide .gtext b { color: var(--seal); font-weight: normal; }
#guide .gbtns { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
#guide .gbtns .btn { flex: none; padding: 4px 12px; }
#guide .gbtns .skip { background: none; border: 0; color: var(--paper-mute); cursor: pointer; padding: 4px 6px; min-height: 44px; }
/* 推荐操作的按钮闪光 */
#nav button.hint { animation: navHint 1s steps(2) infinite; }
#nav button.locked img { opacity: .3; filter: grayscale(1); }
#nav button.locked span:not(.badge) { color: #5a5470; }
#nav button.locked .lk { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); color: #8a83a0; font-size: .8em; white-space: nowrap; }
#nav button.locked::after { content: ""; position: absolute; right: 6px; top: 6px; width: 16px; height: 16px; background: var(--ic-lock) center / contain no-repeat; image-rendering: pixelated; }
#nav button.unlock { animation: unlockFx 1.1s steps(11); }
#nav button.unlock::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 246, 200, .75) 50%, transparent 70%) no-repeat; background-size: 200% 100%; animation: sweep 1.1s steps(11) forwards; pointer-events: none; }
@keyframes unlockFx { 0% { transform: scale(1.12); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
@keyframes navHint { 50% { filter: brightness(1.35) drop-shadow(0 0 0 var(--gold)); } }
.guide-sec { display: flex; gap: 8px; align-items: flex-start; }
.guide-sec img { flex: none; }
.guide-sec b { font-weight: normal; color: var(--seal); }
/* ---------- 传讯（仅高屏显示，DESIGN §5.2） ---------- */
#feed { flex: 1 1 0; min-height: 0; overflow: hidden; padding: 0 4px; display: flex; flex-direction: column; gap: 2px; }
#feed div { flex: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed div:first-child { color: var(--text); }
#feed .gold { color: var(--gold) !important; }
#feed .jade { color: var(--jade) !important; }
#feed .red { color: var(--red) !important; }
#feed span { color: #6f6690; margin-right: 6px; }
#feed.off { display: none; }
#app.short #feed { display: none; }
/* ---------- 底栏 60：24 像素图标 + 字 ---------- */
#nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; flex: none; }
#nav button {
  position: relative; cursor: pointer; padding: 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 0; font: inherit;
  color: var(--text); background: none; border: calc(6 * var(--u1)) solid transparent; border-image: var(--fr-hud) 6 fill / calc(6 * var(--u1)) stretch;
}
#nav button span:not(.badge) { line-height: 1.2; }
#nav button:active { transform: translateY(2px); }
#nav img { display: block; }
.badge {
  position: absolute; top: -8px; right: -6px; background: var(--seal); color: #fff; min-width: 16px; height: 16px; line-height: 16px;
  padding: 0 2px; text-align: center; box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite; z-index: 1;
}
@keyframes blink { 50% { transform: translateY(-2px); } }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
/* 矮屏（横屏、360×640 以下）：页面可以竖着滚，不挤坏 */
@media (max-height: 600px) and (orientation: landscape) {
  body { overflow-y: auto; }
  html, body { height: auto; }
  #app { height: auto; min-height: 100vh; }
}

/* ===== 纸卷面板（DESIGN §5.3）：底部上拉，最高 86%，标题大字 + 44 关闭；边框 ART.frame('sheet') 2×，卡片 ART.frame('card') 1× ===== */
#modal { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(8, 6, 14, .72); z-index: 20;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
#modal.mid { align-items: center; }
.sheet {
  width: 100%; max-width: 480px; max-height: 86%; display: flex; flex-direction: column; box-sizing: border-box; position: relative;
  margin-left: max(6px, env(safe-area-inset-left, 0px)); margin-right: max(6px, env(safe-area-inset-right, 0px)); margin-bottom: 8px;
  color: var(--paper-ink); background: var(--paper); background-clip: padding-box;
  border: calc(6 * var(--u2)) solid transparent; border-image: var(--fr-sheet) 6 fill / calc(6 * var(--u2)) stretch; image-rendering: pixelated;
  filter: drop-shadow(0 4px 0 rgba(8, 6, 14, .55));
  animation: unroll .24s steps(6);
}
@supports (border-image-source: url(x)) { .sheet { background: none; } }
@keyframes unroll { from { transform: translateY(24px) scaleY(.6); opacity: 0; } to { transform: none; opacity: 1; } }
#modal.mid .sheet { animation-name: popIn; }
@keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .rod { display: none; }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 0 0 0 6px; margin: -4px -4px 0 0; flex: none; min-height: 44px; }

  border: calc(6 * var(--u1)) solid transparent; border-image: var(--fr-btnAlt) 6 fill / calc(6 * var(--u1)) stretch; background: none; display: flex; align-items: center; justify-content: center;

.card {

}

.big { font-size: var(--fs-l); line-height: 1.25; }
.center { text-align: center; }

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 8px; min-height: 44px; box-sizing: border-box; background: #f7eed6; box-shadow: 0 0 0 2px #b9a77c; }

/* 事件选项：左文右“把握/胜算/花费” */

}

}

/* 面板统一版式（§4.2）：标题行大数 + 分页 + 行（52 图标格 / 名字 / 一个数 / 一个按钮）+ 次要区 */

/* 设置里的音量格（audio.js / panel-me.js 的 volBar）：五根由矮到高的柱子，每根一个 28×44 的点按区 */

/* ---------- 战斗线 C1：历练的节点与回合战（src/ui/battle.js，docs/COMBAT_LOOT.md §2，示意图 02_battle.png） ---------- */
body.bt-on #cult, body.bt-on #stats, body.bt-on #haul, body.bt-on #tripBar, body.bt-on #tick { display: none !important; }

.bt-bar em { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 6px; font-style: normal; font-size: 13px; color: #f3ecdc;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink); }
.bt-sks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }

.bt-ic { position: relative; display: block; width: 32px; height: 32px; }

.sheet.gw { position: relative; }

.gw-head { background: #262038; color: #efe9ff; border: 2px solid #f4c542; padding: 6px 8px 7px; }

.gw-head .l1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

@keyframes gwJump { 0% { transform: translateY(-4px); color: #8ff5d0; } 100% { transform: none; } }
.gw-bar { height: 14px; background: #1b1326; border: 1px solid #55506e; position: relative; }
.gw-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #f4c542; }

.lt-c .lt-face { position: absolute; left: 0; bottom: 0; z-index: 1; }

@keyframes ltShiver { 0% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }
@keyframes ltCharge { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.12); filter: brightness(1.6) drop-shadow(0 0 6px #f4c542); } }
.lt-goldfx { position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: radial-gradient(circle, #fff2a8 0%, #f4c542 45%, rgba(244,197,66,0) 80%); animation: ltGold .7s steps(6) forwards; }

/* ---------- 换窗不抖（tools/jitter_check.js）：底栏面板与带分页的窗口固定高度，换页、换格时卷轴边框不动；底栏贴底，上面的块高度变了也不挪 ---------- */
#modal > .sheet > .body { scrollbar-gutter: stable; }   /* 电脑上的滚动条：这页长那页短时不让正文左右变宽变窄（手机上是浮在内容上的滚动条，不占位） */
#modal > .sheet { min-width: 0; }   /* 一行不换行的长字（对比行、按钮）不许把卷轴撑到满屏宽：否则换到【装备】时卷轴左右各跳 6px */
#modal > .sheet.full { height: 86%; }
#modal > .sheet.full > .body { flex: 1 1 auto; min-height: 0; }
#modal > .sheet.full .gw-det { margin-top: 0; }   /* 固定高度时明细不贴底：展开时“明细”那一行不往上蹿，内容往下展开（正文滚动） */
#tick { margin-top: auto; }   /* 传讯 + 底栏贴底：场景按整数倍缩放剩下的几像素留在目标卡下面，不让底栏、传讯跟着上面的块跳 */
body.bt-on #nav { margin-top: auto; }
/* 底栏没开的格子：灰剪影 + 一行条件（README“底栏固定五格”），条件那一行顶替名字、行高相同——开锁 / 上锁（进出历练）时底栏不变高 */
#nav button.lk > span:not(.badge) { display: none; }
#nav button.lk .lkw { font-size: 13px; line-height: 18px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 存档页（src/ui/saves.js）：一格一行，整行可点（≥ 44px），头像 32px 小格 */
.kslot.sv { cursor: pointer; min-height: 48px; margin-top: 4px; }
.kslot.sv .cell { width: 40px; height: 40px; }
.kslot.sv .nm .chip { font-size: 14px; vertical-align: 1px; }
