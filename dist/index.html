:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 6px;
  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }
#top .row { display: flex; align-items: center; gap: 8px; }
#pName { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#lifeBox.low b { color: var(--red); animation: blink 1s steps(2) infinite; }
#cult { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 0; color: var(--text); text-align: left; cursor: pointer; flex: none; }
#cult .row { display: flex; gap: 8px; align-items: baseline; }
#cult #realm { color: var(--gold); flex: none; }
#cult #xpTxt { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cult #pw { color: var(--muted); flex: none; }
#cult .xbar { display: block; height: 8px; background: var(--panel-lo); position: relative; box-shadow: 0 0 0 1px var(--ink); }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(var(--jade), #2f9a76); }
#cult .xbar i::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.35); }
#cult.ready { background: #4a2a1a; animation: readyPulse 1s steps(2) infinite; }
#cult.ready .xbar i { background: linear-gradient(var(--gold), #c08a1a); }
#cult.ready #xpTxt { color: var(--gold); }
#cult.away { opacity: .85; }
#stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
#stats button { border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-width: 0;
  background: var(--panel); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 2px 0 0 var(--panel-hi); }
#stats button .k { color: var(--muted); white-space: nowrap; }
#stats button b { font-weight: normal; color: var(--jade); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
#stats button[data-s="atk"] b { color: #ff9a8a; }
#stats button[data-s="inc"] b { color: var(--gold); }
#stats button[data-s="big"] { background: #3a2030; }
#stats button[data-s="big"] .k { color: #f0c8c8; }
#stats button[data-s="big"] b.lo { color: #ff7a7a; }
#stats button[data-s="big"] b.md { color: var(--gold); }
#stats button[data-s="big"] b.hi { color: var(--jade); }
#stats button[data-s="big"].soon { animation: navHint 1s steps(2) infinite; }
#stats button:active { transform: translateY(1px); }
.grow-sec { display: flex; flex-direction: column; gap: 4px; }
.grow-sec h3 { margin: 0; font-size: var(--fs); font-weight: normal; display: flex; justify-content: space-between; gap: 8px; color: var(--seal); }
.grow-sec h3 span { color: var(--paper-ink); font-variant-numeric: tabular-nums; }
.grow-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; background: #f7eed6; }
.grow-row .gn { min-width: 0; }
.grow-row .gm { font-variant-numeric: tabular-nums; color: #1d8a63; }
.grow-row .gm.low { color: var(--seal); }
.grow-row .ga { justify-self: end; }
.grow-row .ga .btn { padding: 2px 8px; }
.grow-row .tipx { color: var(--paper-mute); grid-column: 1 / -1; }
@keyframes readyPulse { 50% { background: #6a3a1a; } }
#date { color: var(--muted); white-space: nowrap; }
.res { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-weight: normal; }
#top .row.r2 { justify-content: space-between; }
.iconbtn {
  background: var(--panel-hi); border: 0; padding: 2px 6px; min-width: 32px; height: 24px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--panel-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 16px; height: 16px; }
.iconbtn.on { background: var(--jade); color: var(--ink); }
/* 场景 */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 5 / 4; max-width: 100%; flex: none; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: calc(var(--fs) * 2); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink);
}
#banner small { display: block; font-size: var(--fs); color: var(--text); }
#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--paper-lo);
}
#tip img { width: 32px; height: 32px; flex: none; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; }
/* 目标 */
#goal { display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 22px; }
#goal .lab { color: var(--seal); background: var(--paper); padding: 0 4px; flex: none; }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; }
#goal { cursor: pointer; }
#goal .q { flex: none; color: var(--muted); }
/* 新手引导 */
#guide { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
#guide .spot { position: fixed; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9999px rgba(8, 6, 14, .62); pointer-events: none; animation: spotPulse 1s steps(2) infinite; }
#guide .spot.none { left: 50%; top: 40%; width: 0; height: 0; box-shadow: 0 0 0 9999px rgba(8, 6, 14, .62); animation: none; }
@keyframes spotPulse { 50% { box-shadow: 0 0 0 5px #fff6c0, 0 0 0 9999px rgba(8, 6, 14, .62); } }
#guide .garrow { position: fixed; color: var(--gold); font-size: calc(var(--fs) * 2); line-height: 1; transform: translate(-50%, 0); text-shadow: 2px 2px 0 var(--ink); animation: arrowBob .6s steps(2) infinite; pointer-events: none; }
#guide .garrow.up { animation-name: arrowBobUp; }
@keyframes arrowBob { 50% { margin-top: 6px; } }

  else if (n < 1e16) s = trim(n / 1e12) + '万亿';

// ---------- 倍率登记（各系统把自己的加成接进修炼 / 战力 / 收入 / 历练分数 / 对决） ----------
// 每项 { id, order, fn }，fn(st, …) 返回 null（不适用）、一项或一组 [显示名, 数值, 拆解面板操作键]。
// stats.js 把它们乘起来（收入是加起来），数值拆解面板也读同一份，所以界面上的数和实际结算永远一致。

L.MODS = { cul: [], atk: [], inc: [], incMul: [], exp: [], duel: [], bt: [] };
L.addMod = function (kind, id, order, fn) {
  const list = L.MODS[kind];
  const i = list.findIndex(x => x.id === id);
  const m = { id, order, fn };
  if (i >= 0) list[i] = m; else list.push(m);
  list.sort((a, b) => a.order - b.order);

// 残魂：整体略透，下缘抖动着散成烟
function ghost(src) {
  const c = mk(48, 48), g = c.getContext('2d');
  g.globalAlpha = 0.93; g.drawImage(src, 0, 0); g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  for (let y = 40; y < 48; y++) for (let x = 0; x < 48; x++) {
    const lv = (y - 40) * 2 + Math.abs(x - 23.5) * 0.28 + Math.sin(x * 0.9 + y * 0.5) * 2.5;
    if (BAYER[(x & 3) + (y & 3) * 4] < lv) g.fillRect(x, y, 1, 1);
  }
  return c;
}

ART.portrait = function (id, mood, alt) {
  id = P_ALIAS[id] || id; if (alt && PEOPLE[id + '2']) id += '2';
  if (!MOODS.includes(mood)) mood = 'n';
  const spec = PEOPLE[id]; if (!spec) return null;

};

ART.portraitMe = function (look, realm, mood) {
  if (!MOODS.includes(mood)) mood = 'n'; realm = Math.max(0, Math.min(9, realm | 0));

};

}
function phase() { return ((T / 120000) + 0.42) % 1; }
function season() { return Math.floor(((st ? st.year : 0) % 1) * 4); }
function drawArray(x, y) {
  const lv = st.home.array; if (!lv) return null;

  if (lv >= 8) for (let a = 0; a < 360; a += 5) { const t = a * Math.PI / 180; R(x + Math.cos(t) * rx * 0.65, y + Math.sin(t) * ry * 0.65, 1, 1, col); }
  const nr = 6 + Math.min(6, Math.floor(lv / 4));

  ctx.globalAlpha = 1;

// 吐纳环（DESIGN §3.2）：在洞府打坐时每周天蓄 1/6，蓄满发光，点自己释放。场景内的简画，美术接口到位后可换 ART.drawTunaRing

  else if (type === 'task') { floatText(100, 64, '宗门任务完成', '#8ff5d0'); }
  else if (type === 'promote') { L.log(st, `宗门贡献已足，可晋升${L.srankName(st, data)}！`, 'gold'); tip('promote', `宗门贡献够了，去【宗门】晋升${L.srankName(st, data)}：俸禄 ×${L.SRANKS[data].pay}（现在 ×${L.SRANKS[data - 1].pay}），宝库能换的东西更好。`); }
}

// 渐进解锁：一开始只给历练、洞府、人物，免得一上来不知道点哪
function navLock(nav) {

/* ===== src/ui/modal.js ===== */
/* 废柴仙途 · 界面片段 modal：弹窗与弹窗队列
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。 */
// ---------- 弹窗 ----------
let modalOnClose = null;
function sheet(o) {
  const m = $('#modal');

    ${o.sub ? `<div class="sub" style="padding:0 12px">${o.sub}</div>` : ''}
    <div class="body">${o.body || ''}</div>
    ${foot ? `<div class="foot">${foot}</div>` : ''}<div class="rod"></div></div>`;
  m.hidden = false;
  modalOnClose = o.onClose || null;
  const c = m.querySelector('.close'); if (c) c.onclick = () => { SFX.tap(); closeModal(); };
  m.querySelectorAll('[data-fi]').forEach(b => { b.onclick = () => { SFX.tap(); o.foot[+b.dataset.fi].fn(); }; });
  m.onclick = e => { if (e.target === m && !o.noClose) closeModal(); };
  return m.querySelector('.sheet');
}
function closeModal() {
  const m = $('#modal');
  m.hidden = true; m.innerHTML = '';

  if (f) f();
  setTimeout(processQueue, 400);
  updateHUD();
}
function pushPopup(fn) { queue.push(fn); processQueue(); }
function processQueue() {
  if (!$('#modal').hidden || cine || !$('#intro').hidden) return;

}

/* ===== src/ui/panel-bt.js ===== */
/* 废柴仙途 · 界面片段 panel-bt：突破面板（破境丹步进器）与结果
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。
 * 成功率与组成一律取自 L.btRate / L.btParts，失败后果取自 L.BT，所以面板上的数就是实际掷骰用的数。 */
// ---------- 突破 ----------
let btPills = null;   // 本次准备服几枚（null：按默认算）
// 照这一步突破后的寿元（下一境界的寿元上限）
function nextLife() { const p = st.p; if (p.r >= L.MAXR) return Infinity; return L.lifespan(Object.assign({}, st, { p: Object.assign({}, p, { r: p.r + 1 }) })); }
// 默认枚数：成功率封顶前能多一枚就多一枚，封顶后不再浪费（老祖护法、九转金丹时为 0）
function btDefault() {
  const max = Math.min(L.BT.maxPills, st.pills);
  if (L.btGuard(st) || st.flags.sureBt) return 0;
  let n = 0; while (n < max && L.btRate(st, n) < 1) n++;
  return n;
}
// 突破后战力大约翻几倍：升一小层 ×1.5、大境界 ×1.8，外加觉醒抬灵根
function btPowerMult() {
  const p = st.p, aw = L.awakens(st) ? L.AWAKE.find(a => a.r === p.r + 1) : null;
  const t1 = aw ? Math.max(p.t, aw.t) : p.t;
  return L.P.pwStage * L.P.pwRealm * L.TALENTS[t1].atk / L.TALENTS[p.t].atk;
}
function showBreakthrough(still) {
  const p = st.p;
  if (!L.isReady(st)) return;
  const nxt = p.r >= L.MAXR ? '飞升' : L.REALMS[p.r + 1].n;
  const trib = p.r >= L.MAXR ? 9 : L.REALMS[p.r + 1].trib;
  const max = Math.min(L.BT.maxPills, st.pills);
  if (btPills === null || btPills > max) btPills = btDefault();
  const n = btPills, rate = L.btRate(st, n), guard = L.btGuard(st), sure = !!st.flags.sureBt;
  const parts = L.btParts(st, n).map(([k, v]) => `<span>${esc(k)} ${k === '基础' ? L.pct(v) : '+' + L.pct(v)}</span>`).join('');
  const fail = L.has(st, 'steady') ? `失败：道心坚定，修为只退到 95%，不负伤；下次成功率 +${L.pct(L.BT.fail)}。` : `失败不会身死：修为退到 70%，负伤 3 周天，下次成功率 +${L.pct(L.BT.fail)}。`;
  const body = `<div class="row">${myAvImg(66)}<div class="grow">
      <div>${esc(p.name)} · ${L.stageName(p)}</div>
      <div class="big seal">冲击${nxt}</div>
      <div class="muted">${trib ? `需渡 ${trib} 道雷劫` : '水到渠成，无需渡劫'}</div></div></div>
    <div class="center"><div class="muted">成功率</div><div class="big ${rate >= 0.7 ? 'jadet' : rate >= 0.4 ? 'goldt' : 'seal'}" id="btRate" style="font-size:calc(var(--fs)*3)">${L.pct(rate)}</div>
      ${guard ? '<div class="jadet">老祖护法：头一回冲击筑基，必成（不耗丹）</div>' : sure ? '<div class="jadet">九转金丹：必定成功（不耗丹）</div>' : `<div class="fxlist">${parts}</div>`}</div>
    <div class="stepper" id="btStep"><span class="grow">服破境丹 <span class="muted">每枚 +${L.pct(L.BT.pill)}，一次最多 ${L.BT.maxPills} 枚（剩 ${st.pills}）</span></span>
      <button class="btn sm alt" data-st="-1" ${n <= 0 || guard || sure ? 'disabled' : ''}>−</button><b class="num">${n}</b><button class="btn sm alt" data-st="1" ${n >= max || guard || sure ? 'disabled' : ''}>+</button></div>
    <div class="muted">${guard || sure ? '' : fail}${p.r < L.MAXR ? `成功后寿元 ${fmt(L.lifespan(st))} → ${fmt(nextLife())} 年，战力约 ×${btPowerMult().toFixed(1)}。` : ''}</div>`;
  const s = sheet({ title: p.r >= L.MAXR ? '飞升天劫' : '境界突破', still, body, foot: [{ t: '再准备一下', alt: true, fn: closeModal }, { t: trib ? '引动天劫' : '开始突破', gold: true, fn: go }] });
  s.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { SFX.tap(); btPills = Math.max(0, Math.min(max, n + +b.dataset.st)); showBreakthrough(true); });
  function go() {
    const res = L.breakthrough(st, btPills);
    btPills = null;
    if (res) startCine(res);
    closeModal();
  }
}
function afterBreakthrough(res) {
  const p = st.p;

  if (res.ok) {

    if (res.awaken) {

      const T0 = L.talentInfo(st, res.awaken.from), T1 = L.talentInfo(st, res.awaken.to);
      lines.push(`<div class="center">灵根蜕变：${talentTag(res.awaken.from)} → ${talentTag(res.awaken.to)}</div>`);

        <p class="center">冲击${res.ascend ? '飞升' : L.REALMS[res.from + 1].n}失败（成功率 ${L.pct(res.rate)}）${L.has(st, 'steady') ? '，好在道心坚定，毫发无伤' : `，修为退到七成，负伤 ${p.inj} 周天`}。</p>
        <p class="center seal">屡败屡战：下次成功率 +${L.pct(L.BT.fail)}（已累计 ${p.fails} 次）</p>`,
      foot: [{ t: '再接再厉', fn: closeModal }],
    });
  }
}

/* ===== src/ui/panel-exp.js ===== */
/* 废柴仙途 · 界面片段 panel-exp：历练：地点、确认页（深度 × 行事 × 预计评价）、途中、结算卡、首领
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。
 * 数字一律取自逻辑层：L.expForecast（预计评价、负伤风险、灵石）、L.expPreview（途中收获）、L.resolveExp 的结算。 */
// ---------- 历练 ----------
const RATE_CLS = ['r0', 'r1', 'r2', 'r3', 'r4'];   // 丁丙乙甲天
function chipFor(p) { return `<span class="chip ${p >= 0.75 ? 'ok' : p >= 0.4 ? 'warn' : 'bad'}">${L.pct(p)}</span>`; }
function rateChip(f) { return `<span class="chip ${f.lo >= 3 ? 'ok' : f.lo >= 2 ? 'warn' : 'bad'}">${f.text}${f.unknown && !f.first ? '?' : ''}</span>`; }
function stampHTML(r, big) { return `<span class="stamp ${RATE_CLS[r]}${big ? ' big' : ''}">${L.RATINGS[r]}</span>`; }
const cellName = (k, d) => `${L.REGIONS[k].n}·${L.DEPTHS[d]}`;
// 进历练面板时每张图默认选哪一格：上次去过的那一格 > 最高一格“稳拿乙”的深度 > 外围
function defaultCell(st0, k) {
  const le = st0.lastExp;
  let a = le && L.apprOpen(st0, le.a) ? le.a : 0;
  if (le && le.k === k && L.expOpen(st0, k, le.d, a)) return { d: le.d, a };
  let d = 0;
  for (let dd = 2; dd >= 0; dd--) { if (!L.expOpen(st0, k, dd, a)) continue; const f = L.expForecast(st0, k, dd, a); if (f.first || (f.risk <= 0 && f.pOk >= 0.8)) { d = dd; break; } }
  if (!L.expOpen(st0, k, d, a)) a = 0;
  return { d, a };
}
function showExp() {
  if (st.exp) { showExpAway(); return; }
  const best = L.expBest(st);
  const rows = [];
  let lockedShown = false;
  for (let k = 0; k < L.REGIONS.length; k++) {
    const rg = L.REGIONS[k];
    const open = L.regionOpen(st, k) && L.expOpen(st, k, 0, 0);
    if (!open) {
      if (lockedShown) continue;
      lockedShown = true;
      const why = L.firstTrip(st) ? '先走完第一趟' : L.regionLock(st, k);
      rows.push(`<div class="card flat" style="opacity:.6"><div class="main"><div>${rg.n}</div><div class="muted">${why}</div></div><div class="right"><span class="chip">未开放</span></div></div>`);
      continue;
    }
    if (L.bossReady(st, k)) {
      const B = L.BOSSES[k], bp = L.duelChance(L.duelPower(st, { kind: 'boss', k, el: rg.el }), L.bossPower(k));
      rows.push(`<div class="card" data-boss="${k}" style="box-shadow:0 0 0 2px var(--seal)">${bossImg(k, 36)}<div class="main"><div class="seal">首领现身：${B.n}</div><div class="muted">“${B.line}” · 战力 ${fmt(L.bossPower(k))}</div><div class="muted">击败可得天材地宝、首领掉落【${B.drop}】与称号「${B.t}」</div></div><div class="right">${chipFor(bp)}<span class="muted">胜算</span></div></div>`);
    }
    const c = defaultCell(st, k), f = L.expForecast(st, k, c.d, c.a);
    const bests = [0, 1, 2].map(d => { const b = L.bestOf(st, k, d); return `${L.DEPTHS[d]} ${b ? L.RATINGS[b] : '—'}`; }).join(' · ');
    const el = L.elemKnown(st, k) ? ` · ${L.elemName(k)}` : '';

// ---------- 炼丹 ----------
function showAlchemy() {
  const rate = L.alchRate(st);

    const why = L.canCraft(st, rc.k);

      <div class="right"><button class="btn sm ${why ? 'alt' : 'gold'}" data-r="${rc.k}" ${why ? 'disabled' : ''}>炼制</button></div></div>`;
  }).join('');
  const s = sheet({ title: '炼丹房', sub: `灵草 ${fmt(st.herbs)} · 天材地宝 ${st.treasure} · 成丹率 ${L.pct(rate)}${L.friend(st, 'ge') ? '（葛老指点）' : ''}`, body: body + '<div class="muted">灵田每周天产灵草，历练（尤其采药）和奇遇也能得到。天材地宝来自地图首领与稀有机缘。成丹分下、中、上、极品四等，炸炉只亏灵草。</div>' });
  s.querySelectorAll('button[data-r]').forEach(b => b.onclick = () => {
    const res = L.craft(st, b.dataset.r);
    if (!res) return;
    SFX.gather();
    const s2 = sheet({ title: '开炉炼丹', center: true, noClose: true, body: `<div class="center"><div class="clashL" style="display:inline-block">${iconHTML('pill', 56)}</div></div><p class="center muted">丹炉火起，药香弥漫……</p>` });
    setTimeout(() => {
      if (!res.ok) { SFX.fail(); sheet({ title: '炸炉了', center: true, body: `<p class="center">轰的一声，${res.n}没炼成，灵草化为飞灰。</p><p class="center muted">提升丹炉等级（每级 +3%）、与葛老交好，成丹率更高。</p>`, foot: [{ t: '再来', gold: true, fn: showAlchemy }] }); return; }
      const q = L.QUAL[res.q];
      if (res.q === 3) { flash(0.6); SFX.reveal(6); banner('丹纹九现', '极品' + res.n); } else SFX.win();
      sheet({ title: '丹成', center: true, body: `<div class="center">${iconHTML('pill', 44)}</div><div class="center big ${res.q === 3 ? 'goldt' : res.q === 2 ? 'jadet' : ''}">${q.n}${res.n}</div>${res.q === 3 ? '<p class="center seal">丹成之时，九道丹纹浮现，异香百里！</p>' : ''}<div class="fxlist"><span>${esc(res.fx)}</span></div>`, foot: [{ t: '继续炼丹', gold: true, fn: showAlchemy }] });
    }, 1100);
    void s2;
  });
}

/* 废柴仙途 · 界面片段 panel-market：坊市

// ---------- 坊市 ----------
function showMarket() {
  const p = st.p;
  const body = L.MARKET.map(m => {
    const c = L.price(st, m.k);
    const note = m.k === 'life' ? ` · 本境界已服 ${st.lifePills[p.r] || 0}/3` : '';
    const dis = st.stones < c || (m.k === 'life' && (st.lifePills[p.r] || 0) >= 3);
    const ic = { pill: 'pill', life: 'life', box: 'bag', egg: 'pet' }[m.k];
    return `<div class="card flat"><div style="flex:none">${iconHTML(ic, 30)}</div><div class="main"><div>${m.n}</div><div class="muted">${m.d}${note}</div></div>
      <div class="right"><button class="btn sm ${dis ? 'alt' : 'gold'}" data-k="${m.k}" ${dis ? 'disabled' : ''}>${iconHTML('stone', 12)} ${fmt(c)}</button></div></div>`;
  }).join('');
  let auc = '';
  if (L.auctionOpen(st)) {
    auc = `<div class="sep"></div><div class="seal">拍卖会 · 还剩 ${st.auction.until - st.tick} 周天（一口价，通常只买得起一件）</div>` + st.auction.items.map((it, i) => {
      const dis = it.sold || st.stones < it.price;
      return `<div class="card flat"><div class="main"><div>${esc(it.n)}${it.tier ? ` <span class="muted">（${it.k === 'w' ? '战力 ×' + L.WEAPONS[it.tier].m : '修炼 ×' + L.ARTS[it.tier].m}）</span>` : ''}</div>${it.sold ? '<div class="muted">已拍下</div>' : ''}</div><div class="right"><button class="btn sm ${dis ? 'alt' : 'gold'}" data-au="${i}" ${dis ? 'disabled' : ''}>${iconHTML('stone', 12)} ${fmt(it.price)}</button></div></div>`;
    }).join('');
  } else if (L.mr(st) >= 2) {
    const n = ((L.AUCTION.at - st.tick % L.AUCTION.every) + L.AUCTION.every) % L.AUCTION.every || L.AUCTION.every;
    auc = `<div class="muted">下一场拍卖会：${n} 周天后</div>`;
  }
  const box = L.boxCap(st, 'w');
  const s = sheet({ title: '坊市', sub: `灵石 ${fmt(st.stones)} · 价格随境界上涨`, body: body + auc + `<div class="muted">当前：法宝 ${p.w ? L.WEAPONS[p.w].n : '无'} · 功法 ${L.ARTS[p.a].n} · 灵宠 ${p.pet ? L.PETS[p.pet.tier].n : '无'}<br>寻宝保底：连续 ${st.boxMiss || 0}/2 次没提升；本境界最高补到 ${L.WEAPONS[box].n} / ${L.ARTS[L.boxCap(st, 'a')].n}</div>` });
  s.querySelectorAll('button[data-au]').forEach(btn => btn.onclick = () => {
    const r = L.auctionBuy(st, +btn.dataset.au);
    if (!r) return;
    SFX.coin();
    if (r.it) revealItem(r.it, showMarket);
    else { floatText(100, 80, '拍下' + r.n, '#ffe39a'); showMarket(); }
  });
  s.querySelectorAll('button[data-k]').forEach(btn => btn.onclick = () => {
    const r = L.buy(st, btn.dataset.k);
    if (!r) return;
    SFX.coin();
    if (r.it) revealItem(r.it, showMarket);
    else { floatText(100, 80, r.k === 'life' ? `寿元 +${r.add} 年` : '破境丹 +1', r.k === 'life' ? '#8ff5d0' : '#ffe39a'); showMarket(); }
  });
}
function revealItem(it, back) {
  const tierOf = it.kind === 'pet' ? it.tier : it.kind === 'w' ? Math.min(6, it.tier - 1) : it.tier;
  const colors = ['#9aa0a6', '#e6e1d3', '#62d26f', '#4aa8ff', '#c27dff', '#ffcf3f', '#ff7a7a'];
  const col = colors[Math.max(0, Math.min(6, tierOf))];
  const img = it.kind === 'pet' ? petImg(it.tier, 44) : `<img class="px" src="${iconURL[it.kind === 'w' ? 'sword' : 'bag']}" style="width:44px;height:44px" alt="">`;
  const s = sheet({
    title: it.kind === 'pet' ? '灵兽破壳' : '寻宝', center: true, noClose: true,
    body: `<div class="cands" style="grid-template-columns:1fr;max-width:160px;margin:0 auto"><div class="cand hide"><div class="beam" style="background:${col}"></div>${img}<div class="cover">？</div></div></div>${itemLine(it)}`,
    foot: [{ t: '收下', gold: true, fn: back || closeModal }],
  });
  setTimeout(() => { const c = s.querySelector('.cand'); if (!c) return; c.classList.remove('hide'); const cv = c.querySelector('.cover'); if (cv) cv.remove(); c.classList.add('reveal'); SFX.reveal(tierOf); if (tierOf >= 5) flash(0.4); }, 450);
}

const NINE_LOOK = { kunlun: 'yun', tianjian: 'chu', xuesha: 'xue' };
function runSectMeet() {
  const res = L.sectMeet(st);
  if (!res) return;
  const sc = L.sectOf(st);
  let step = -1;
  const next = () => {
    step++;
    if (step === 0) {
      SFX.gong();
      sheet({ title: `第${res.n}届 九宗会武`, center: true, noClose: true,
        body: `<p class="center">天下九宗齐聚问剑台，以武论高下，排定宗门座次！</p><div class="center">${myAvImg(52)}</div><p class="center">你代表 <b>${sc.n}</b> 出战 · 当前天下第 ${res.start} 宗</p>`,
        foot: [{ t: '为宗门而战！', gold: true, fn: next }] });
      return;
    }
    const rd = res.rounds[step - 1];
    if (!rd) { summary(); return; }
    const look = NINE_LOOK[rd.foe.id];
    const tj = rd.foe.id === 'tianjian';
    duel({
      title: `会武 · 对阵${rd.foe.n}`,
      right: { img: rivalAvImg(look ? { n: rd.foe.champ, id: look } : { n: rd.foe.champ }, 66), name: rd.foe.champ, sub: `${rd.foe.n} · 天下第${rd.q}宗 · ${fmt(rd.Q)}` }, Q: rd.Q, S: rd.S || res.S, win: rd.win,
      quote: `${rd.foe.champ}：“${rd.foe.line}”`,
      winText: `${rd.defend ? '卫冕天下第一宗' : `${esc(sc.n)}升至天下第 ${rd.q} 宗`} · 贡献 +${fmt(rd.contrib || 0)} · 灵石 +${fmt(rd.stones || 0)}${tj && st.flags.beatTianjian === 1 ? '<div class="quote">天剑宗众长老面如土色——当年被一脚踢下山的弃徒，如今代表' + esc(sc.n) + '把天剑宗踩在了脚下！</div>' : ''}`,
      loseText: '对方底蕴深厚，下届会武再来！',
      btn: res.rounds[step] ? '下一场' : '会武落幕',
      done: next,
    });
  };
  const summary = () => {
    const up = res.start - res.end;
    if (res.end === 1 && res.start > 1) banner('天下第一宗', sc.n);
    else if (up > 0) banner(`宗门 ↑${up}`, `天下第 ${res.end} 宗`);
    sheet({ title: '会武落幕', center: true,
      body: `<div class="center big ${up > 0 ? 'goldt' : ''}">天下第 ${res.end} 宗</div><p class="center">${up > 0 ? `${esc(sc.n)}从第 ${res.start} 升至第 ${res.end}！` : res.end === 1 ? `${esc(sc.n)}稳坐天下第一宗！` : '座次未变，下届再战。'}</p>${res.end === 1 && res.start > 1 ? `<div class="quote">九宗俯首。从今日起，${esc(sc.n)}便是天下第一宗！</div>` : ''}<p class="center muted">宗门排名越高，俸禄越多。</p>`,
      foot: [{ t: '回洞府', gold: true, fn: closeModal }] });
  };
  next();
}

// ---------- 对决（通用） ----------
function duel(o) {
  const S = o.S || L.power(st);

  const s = sheet({
    title: o.title, center: true, noClose: true,
    body: `${o.intro ? `<p>${o.intro}</p>` : ''}<div class="vs"><div class="side">${myAvImg(66).replace('<img ', '<img id="vsL" ')}<div>${esc(st.p.name)}</div><div class="muted num">${fmt(S)}</div></div>
      <div class="vsx">VS</div>
      <div class="side">${o.right.img}<div>${esc(o.right.name)}</div><div class="muted num">${esc(o.right.sub)}</div></div></div>
      ${o.quote ? `<div class="quote">${esc(o.quote)}</div>` : ''}
      <div class="muted center">胜算 ${L.pct(p)}</div>
      <div id="vsRes" class="center" style="min-height:3em"></div>`,
    foot: [{ t: '……', alt: true, disabled: true, fn: () => o.done() }],
  });
  const l = s.querySelector('#vsL'), r = s.querySelector('#vsR');
  if (l) l.classList.add('clashL'); if (r) r.classList.add('clashR');
  let hits = 0; const hi = setInterval(() => { SFX.hit(); if (++hits >= 3) clearInterval(hi); }, 330);
  setTimeout(() => {
    const box = s.querySelector('#vsRes'), btn = s.querySelector('[data-fi="0"]');
    if (!box) return;
    box.innerHTML = o.win ? `<div class="big goldt">胜！</div><div>${o.winText}</div>` : `<div class="big seal">败</div><div>${o.loseText}</div>`;
    if (o.win) SFX.win(); else SFX.fail();
    btn.disabled = false; btn.textContent = o.btn || '继续'; btn.classList.remove('alt'); btn.classList.add('gold');
  }, 1150);
}

const TAUNTS = ['区区散修，也敢上论道台？', '今日便让你知道天高地厚！', '哼，不自量力。', '我宗天骄，岂是你能比的？', '早点认输，免得丢人现眼。'];
const SHOCK = ['这……这不可能！', '台下一片哗然！', '对面师长脸色铁青。', '观战众人倒吸一口凉气！'];
const RIVAL_LINES = {
  mu: ['废物，三年过去，你还是废物。', '怎……怎么可能？当年那个废物……'],
  zhao: ['当年一脚把你踢下山，今天照样！', '师……师弟，当年是师兄有眼无珠！'],
  chu: ['天剑宗圣子，岂是你这弃徒能挑战的？', '我楚天阔……竟输给一个弃徒？！'],
  xue: ['正道蝼蚁，也配让本圣子出手？', '此人……不可力敌，撤！'],
  yun: ['我在榜首等你很久了。来吧。', '好剑。天下第一，是你的了。'],
};
function runTournament() {
  const res = L.tournament(st);
  rankShown = res.startRank;
  let step = -1;
  const next = () => {
    step++;
    if (step === 0) {
      SFX.gong();
      sheet({ title: `第${res.n}届 天骄论道`, center: true, noClose: true,
        body: `<p class="center">天下天骄齐聚论道台，以战论道，排定天骄榜！</p>${res.n === 1 ? `<div class="quote">天骄论道每 ${L.TOUR_EVERY} 周天一届，会自动开打：三场，按战力去挑战榜上的对手，赢了就顶替对方的名次，每场最多上升 ${L.TOUR_STEP} 名。宿敌们都在榜上。</div>` : ''}<div class="center">${myAvImg(52)}</div><p class="center num">战力 ${fmt(res.S)} · 当前天骄榜第 ${res.startRank}</p>`,
        foot: [{ t: '登台！', gold: true, fn: next }] });
      return;
    }
    const rd = res.rounds[step - 1];
    if (!rd) { summary(); return; }
    const rv = rd.rv || { n: '无名', s: '' };
    const lines = rv.id ? RIVAL_LINES[rv.id] : null;
    duel({
      title: `第 ${step} 战`,
      right: { img: rivalAvImg(rv, 66), name: rv.n, sub: `${rv.s} · 第${rd.q}名 · ${fmt(rd.P)}` }, Q: rd.P, S: rd.S || res.S, win: rd.win,
      quote: `${rv.n}：“${lines ? lines[0] : TAUNTS[(step + res.n) % TAUNTS.length]}”`,
      winText: `${rd.defend ? '卫冕天骄榜第一' : `排名升至第 ${rd.q}`} · 灵石+${fmt(rd.stones || 0)}${rd.contrib ? ` · 贡献+${fmt(rd.contrib)}` : ''}${lines && rd.first ? `<div class="quote">${esc(rv.n)}：“${esc(lines[1])}”</div>` : rd.P > res.S * 0.9 ? `<div class="muted">${SHOCK[step % SHOCK.length]}</div>` : ''}`,
      loseText: '对手底蕴深厚，来日再战。',
      btn: res.rounds[step] ? '下一战' : '论道落幕',
      done: () => { if (rd.win && !rd.defend) rankShown = rd.q; next(); },
    });
  };
  const summary = () => {
    const up = res.startRank - res.endRank;
    rankShown = 0;
    if (up > 0) banner(`天骄榜 ↑${up}`, `第 ${res.endRank} 名`);
    sheet({ title: '论道落幕', center: true,
      body: `<div class="center big ${up > 0 ? 'goldt' : ''}">天骄榜第 ${res.endRank}</div><p class="center">${up > 0 ? `排名 ${res.startRank} → ${res.endRank}，上升 ${up} 位！` : res.endRank === 1 ? '稳坐天骄榜第一！' : '排名未变，下届再战。'}</p>
        ${res.endRank === 1 && res.startRank > 1 ? `<div class="quote">四海天骄俯首，${esc(st.p.name)}，天下第一！</div>` : ''}`,
      foot: [{ t: '回洞府', gold: true, fn: closeModal }] });
  };
  next();
}

function pactTips() {
  const pi = L.pactInfo(st), p = st.p, out = [];
  const with_ = (m, assist) => L.duelChance(pi.base * m * (assist === undefined ? pi.assist : assist), pi.Q);
  if (p.inj > 0) out.push({ t: '先疗伤', cost: L.canHeal(st) ? '破境丹 1 枚' : `歇 ${p.inj} 周天`, p: with_(1 / 0.6), go: 'home' });
  if (p.r === 0 && !L.isFull(st)) {
    const n = L.ticksToStage(st, L.si(p) + 1);
    if (n < pi.left) out.push(p.s === 3 ? { t: '修满后突破筑基', cost: `约 ${n} 周天修满，再冲一次${L.btGuard(st) ? '（老祖护法必成）' : ''}`, p: with_(btPowerMult(), 1), go: L.retOpen(st) ? 'home' : 'exp' }
      : { t: `修到炼气${L.STAGES[p.s + 1]}`, cost: `照现在约 ${n} 周天（闭关更快）`, p: with_(L.P.pwStage), go: L.retOpen(st) ? 'home' : 'exp' });
  }
  if (p.r === 0 && L.isFull(st)) out.push({ t: '突破筑基', cost: L.btGuard(st) ? '老祖护法必成' : '成功率 ' + L.pct(L.btRate(st, Math.min(3, st.pills))), p: with_(btPowerMult(), 1), go: 'cult' });
  if (p.w < L.boxCap(st, 'w')) out.push({ t: `换一件${L.WEAPONS[p.w + 1].n}`, cost: `寻宝 ${fmt(L.price(st, 'box'))} 或历练掉落`, p: with_(L.WEAPONS[p.w + 1].m / L.WEAPONS[p.w].m), go: navLock('market') ? 'exp' : 'market' });
  if (!p.pet && L.marketOpen(st, 'egg')) out.push({ t: '收一只灵宠', cost: `灵兽蛋 ${fmt(L.price(st, 'egg'))}`, p: with_(L.PETS[1].m), go: 'market' });
  if (L.canRetreat(st) && p.r === 0) { const ri = L.retInfo(st); if (ri.save > 0) out.push({ t: '闭关', cost: ri.free ? '头一回免费' : `${fmt(ri.cost)} 灵石`, p: pi.p, extra: `本层提前 ${ri.save} 周天`, go: 'home' }); }
  return out.filter(x => x.p - pi.p >= 0.03 || x.extra).sort((a, b) => b.p - a.p).slice(0, 3);
}
// 三年之约：双方数值摆在明面上，外加老祖锦囊（每条都写清楚能涨多少）
function showPact() {
  const pi = L.pactInfo(st), p = st.p;
  const row = (n, eff, act, tip) => `<div class="grow-row"><span class="gn">${n}</span><span class="gm">${eff}</span><span class="ga">${act || ''}</span>${tip ? `<span class="tipx">${tip}</span>` : ''}</div>`;
  const go = (t, k) => `<button class="btn sm alt" data-go="${k}">${t}</button>`;
  const tips = pactTips().map(x => row(x.t, x.extra ? x.extra : `${L.pct(pi.p)} → <b>${L.pct(x.p)}</b>`, go('前往', x.go), x.cost));
  const body = `<p class="center">还剩 <b>${pi.left} 个周天</b>，${esc(st.exName)}在落霞城擂台等你。</p>
    <div class="vs"><div class="side">${myAvImg(56)}<div>${esc(p.name)}</div><div class="num">${fmt(pi.base)}${pi.assist > 1 ? ` ×${pi.assist}` : ''}</div><div class="num jadet">= ${fmt(pi.S)}</div></div>
      <div class="vsx">VS</div>
      <div class="side">${rivalAvImg({ n: st.exName, id: 'mu' }, 56)}<div>${esc(st.exName)}</div><div class="muted">单灵根·炼气后期·法器</div><div class="num seal">${fmt(pi.Q)}</div></div></div>
    <div class="center big ${pi.p < 0.45 ? 'seal' : pi.p < 0.8 ? 'goldt' : 'jadet'}">胜算 ${L.pct(pi.p)}</div>
    ${pi.assist > 1 ? `<p class="muted center">×${pi.assist} 是老夫借你的神魂之力，只在你筑基之前有效。</p>` : ''}
    <p class="muted center">五五线：战力 ${fmt(L.duelLines(pi.Q).even)} · 稳赢线：${fmt(L.duelLines(pi.Q).sure)}</p>
    <div class="grow-sec"><h3>老祖锦囊<span>怎么提高胜算</span></h3>${tips.join('') || '<p class="muted">已经稳了，安心等着打脸吧。</p>'}</div>`;
  const s = sheet({ title: '三年之约', body });
  s.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { SFX.tap(); const k = b.dataset.go; if (k === 'cult') { closeModal(); if (L.isReady(st)) showBreakthrough(); } else GO[k](); });
}

// ---------- 人物 ----------
function ladderHTML() {
  const rows = [];
  const add = q => { const rv = L.rivalAt(st, q); rows.push(`<div class="${q === st.rank ? 'me' : ''}"><b>第${q}</b><span>${esc(rv ? rv.n : st.p.name)}${rv && rv.id ? ' <span class="seal">宿敌</span>' : ''}</span><span class="num">${fmt(q === st.rank ? L.power(st) : L.rivalPower(st, q))}</span></div>`); };
  const qs = new Set([1, 2, 3]);
  for (let q = st.rank - 2; q <= st.rank + 2; q++) if (q >= 1 && q <= 100) qs.add(q);
  let prev = 0;
  for (const q of [...qs].sort((a, b) => a - b)) { if (q - prev > 1) rows.push('<div class="muted"><b>…</b></div>'); add(q); prev = q; }
  return `<div class="ladder">${rows.join('')}</div>`;
}

    ${st.lives.length ? `<div class="sep"></div><div class="muted">前世</div>${st.lives.map((l, i) => `<div>第 ${i + 1} 世 · ${esc(l.name)} · ${l.ascended ? '白日飞升' : L.REALMS[Math.min(l.r, 8)].n + '期坐化'} · ${l.age} 岁</div>`).join('')}` : ''}

    }).join('') + '<div class="muted">好感来自奇遇中的选择。好感 60 结为知己获得永久加成；医修与魔门圣女二人中可择一结为道侣。</div>';
  } else if (tab === 'ach') {
    const got = L.ACHS.filter(a => st.ach[a.id]).length;

      + (st.titles.filter(t => !L.ACHS.some(a => a.t === t)).length ? `<div class="sep"></div><div class="muted">其他称号</div>` + st.titles.filter(t => !L.ACHS.some(a => a.t === t)).map(t => `<div class="ach" data-title="${esc(t)}"><b>${esc(t)}</b><span class="${st.title === t ? 'chip ok' : 'chip'}">${st.title === t ? '佩戴中' : '佩戴'}</span></div>`).join('') : '');
  } else {

  const gb = s.querySelector('#btnGrow'); if (gb) gb.onclick = () => { SFX.tap(); showGrowth('all'); };

    sec('flag', '天骄论道', `三年之约之后每 ${L.TOUR_EVERY} 周天一届：三场，按战力挑战天骄榜上的对手，每场最多上升 ${L.TOUR_STEP} 名，宿敌都在榜上。`),

const GO = {
  exp: () => showExp(), home: () => showHome(), sect: () => showSect(), market: () => showMarket(), me: () => showMe('rank'), big: () => showBig(),
  cult: () => { if (L.isReady(st)) showBreakthrough(); else tempHint = { id: 'tmp', target: '#cult', btn: '好', text: L.isFull(st) ? '修为已满，回到洞府就能冲击境界。' : `照现在的速度，还要约 <b>${L.ticksToStage(st, L.si(st.p) + 1)}</b> 个周天升下一层。闭关、聚灵阵、吐纳都能加快。` }; },
};
// 札记（DESIGN §4.6）：本章主线 + 前三条未完成的小任务 + 以前章节没做完的主线；完成即领
function showQuests() {
  const qv = L.questView(st);
  const item = (q, i) => `<div class="card flat"><div class="main"><div>${q.main ? '<span class="story-tag">主线</span>' : ''}${esc(L.questText(st, q))}</div><div class="goldt">${esc(L.rewardText(st, q.rw)) || '—'}</div></div><div class="right"><button class="btn sm alt" data-q="${i}">前往</button></div></div>`;
  const all = [];
  const rows = [];
  if (qv.main) { all.push(qv.main); rows.push(item(qv.main, all.length - 1)); }
  for (const q of qv.list) { all.push(q); rows.push(item(q, all.length - 1)); }
  if (qv.old.length) { rows.push('<div class="muted">未了之事（以前章节的主线，仍可完成领赏）</div>'); for (const q of qv.old) { all.push(q); rows.push(item(q, all.length - 1)); } }
  const s = sheet({ title: `札记 · 第${'一二三四五六七八九'[qv.r]}章 ${qv.ch.n}`, sub: `本章小任务 ${qv.doneN}/${qv.total} · 完成即领，不用再点`, body: rows.join('') || '<p>大道已成。可以继续在此世逍遥，或去【人物】查看成就。</p>' });
  s.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    SFX.tap();
    const q = all[+b.dataset.q];
    closeModal();
    if (q.go === 'sect' && !st.sect) { tempHint = { id: 'tmp', target: '#cult', btn: '好', text: `你还没有宗门。突破到筑基、三年之约之后，三大宗门会来招揽你。` }; return; }
    if (q.go === 'market' && navLock('market')) { tempHint = { id: 'tmp', target: '[data-nav="market"]', btn: '好', text: navLock('market') }; return; }
    (GO[q.go] || GO.exp)();
  });
}
$('#goal').addEventListener('click', () => { if (!st || cine) return; ac(); SFX.tap(); showQuests(); });
$('#btnHelp').onclick = () => { if (!st || cine) return; ac(); SFX.tap(); showHelp(); };

/* ===== src/ui/intro.js ===== */
/* 废柴仙途 · 界面片段 intro：开场与起名
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。 */
// ---------- 开场 ----------
const NAMES_M = ['林逸尘', '沈青川', '陆长风', '叶知秋', '苏念白', '顾清寒', '江离', '温如玉', '秦慕白', '萧云舟'];
const NAMES_F = ['苏清歌', '林晚照', '沈月白', '叶轻舟', '顾念安', '温若雪', '江明月', '秦挽歌'];
function showIntro() {
  const box = $('#intro');
  box.hidden = false;
  $('#modal').hidden = true;
  const lines = [
    ['天剑宗外门。', '“杂灵根也配修仙？滚出山门！”', '你被大师兄赵乾一脚踢下了山。'],
    ['同一天，婚约也被当众撕毁：', '“废物，你配不上慕容家。三年后落霞城论剑，你若敢来，我便让你输得心服口服。”', '“莫欺少年穷！三年之后，我必登台！”'],
    ['当夜，荒山破庙。', '一枚生锈的戒指在月光下微微发烫……', '“小家伙，老夫在戒中等了你三千年。”'],
    ['一个废柴的逆天仙途，从此开始。', '三年之约、天剑宗、天骄榜、宗门之巅——', '还有那九九天劫之后的，白日飞升。'],
  ];
  let page = 0, typing = null;
  const render = () => {
    const ls = lines[page];
    box.innerHTML = `<div class="story">${page === 0 ? '<h1>废柴仙途</h1>' : ''}${ls.map(() => '<p></p>').join('')}<p class="hint">点击继续 ▸</p></div>`;
    const ps = box.querySelectorAll('p:not(.hint)');
    let li = 0, ci = 0;
    clearInterval(typing);
    typing = setInterval(() => {
      if (li >= ls.length) { clearInterval(typing); typing = null; return; }
      ps[li].textContent = ls[li].slice(0, ++ci);
      if (ci % 2) tone(880, 0, 0.02, 'square', 0.03);
      if (ci >= ls[li].length) { li++; ci = 0; }
    }, 40);
    box.querySelector('.story').onclick = () => {
      ac();
      if (typing) { clearInterval(typing); typing = null; ps.forEach((p, i) => p.textContent = ls[i]); return; }
      page++;
      if (page >= lines.length) setupForm(); else render();
    };
  };
  render();
}
function setupForm() {
  const box = $('#intro');
  let female = 0;
  const pickName = () => { const a = female ? NAMES_F : NAMES_M; return a[Math.floor(Math.random() * a.length)]; };
  box.innerHTML = `<div class="setup sheet" style="margin:0"><div class="rod"></div><header><h2>踏上仙途</h2></header>
    <div class="body">
      <div class="center"><img class="px" id="setupAv" alt=""></div>
      <label for="inName">姓名</label><div class="row"><input class="txt grow" id="inName" maxlength="6" value="${esc(pickName())}"><button class="btn sm alt" id="rdName" aria-label="随机姓名">换</button></div>
      <div class="row"><span>性别</span><button class="btn sm gold" id="gM">少年</button><button class="btn sm alt" id="gF">少女</button></div>
      <div class="muted">操作很简单：打坐自动涨修为 → 点【历练】打怪拿资源 → 升级洞府、买丹药 → 修为条变金时点它突破。</div>
    </div><div class="foot"><button class="btn gold" id="goStart">踏入仙途</button></div><div class="rod"></div></div>`;
  const inN = box.querySelector('#inName');
  const av = () => { const c = ART.avatar({ hair: '#2a2230', skin: '#f2c9a0', f: female }, 0, '#e6e1d3'); const img = box.querySelector('#setupAv'); img.src = c.toDataURL(); img.style.cssText = avStyle(c, 78); };
  av();
  box.querySelector('#rdName').onclick = () => { inN.value = pickName(); SFX.tap(); };
  const setG = f => { female = f; box.querySelector('#gM').className = 'btn sm ' + (f ? 'alt' : 'gold'); box.querySelector('#gF').className = 'btn sm ' + (f ? 'gold' : 'alt'); if ((f ? NAMES_M : NAMES_F).includes(inN.value)) inN.value = pickName(); av(); SFX.tap(); };
  box.querySelector('#gM').onclick = () => setG(0);
  box.querySelector('#gF').onclick = () => setG(1);
  box.querySelector('#goStart').onclick = () => {
    ac();
    const s = L.newState({ name: inN.value.trim() || pickName(), female });
    L.log(s, `${s.p.name}在荒山破庙中盘膝坐下，仙途由此开始`, 'gold');
    loadState(s);
    box.hidden = true;
    monthAcc = 0;
    SFX.gong();
    banner('废柴仙途', '三年之约 · 倒计时');
    st.guide = { step: 0, done: false }; st.hintSeen = {};
    saveLocal();
  };
}

/* ===== src/ui/boot.js ===== */
/* 废柴仙途 · 界面片段 boot：每周天、主循环、输入、启动
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。 */
// ---------- 每周天 ----------
let monthAcc = 0;
function onTick() {
  const out = L.tick(st, true);
  if (!st.exp && !cine && $('#modal').hidden) {
    const g = L.gain(st), inc = L.income(st);
    if (st.p.r <= L.MAXR && !L.isReady(st)) floatText(HOMEPOS.x + 14, HOMEPOS.y - D().sit.h + 2, '+' + fmt(g), '#8ff5d0', false, true);
    floatText(30, 108, '+' + fmt(inc), '#ffe39a', false, true);
  }
  if (out.exp) { const r = out.exp; pushPopup(() => showExpResult(r)); }
  // 途中遭遇是要你做决定的，阻塞；引导期间（前两趟）逻辑层本来就不出
  if (out.choice && !(st.guide && !st.guide.done)) { const ce = out.choice; pushPopup(() => showChoice(ce)); }
  // 访客不弹窗：门口出现一个“！”，点它才见（DESIGN D4）
  if (out.visitor) { SFX.reveal(1); floatText(VISIT_POS.x, VISIT_POS.y - 22, '有人来访', '#ffe39a'); }
  if (out.visitorGone) floatText(VISIT_POS.x, VISIT_POS.y - 22, '访客走了', '#9d93b8');
  if (out.retreat) {
    const r = out.retreat;
    if (r.kind === 'teach') floatText(HOMEPOS.x, HOMEPOS.y - D().sit.h - 8, '指点完毕 贡献到手', '#8ff5d0');
    else { floatText(HOMEPOS.x, HOMEPOS.y - D().sit.h - 8, '出关 修为+' + fmt(r.got), '#8ff5d0'); if (r.epi) { banner('顿悟！', '再得修为 ' + fmt(r.epi)); SFX.reveal(4); } }
  }
  if (out.train) pushPopup(showTrain);
  if (out.auction) banner('拍卖会开槌', `坊市 · ${L.AUCTION.len} 周天`);
  if (out.pact) pushPopup(runPact);
  if (out.invite) pushPopup(showInvite);
  if (out.war) pushPopup(runWar);
  if (out.tourney) pushPopup(runTournament);
  if (out.meet) pushPopup(runSectMeet);
  if (out.death) pushPopup(showDeath);
  saveLocal();
}
// E17 老祖特训：约战剩余 ≤ 8 周天、胜算 < 60%、未筑基未圆满，第一世只此一次
function showTrain() {
  if (!L.canTrain(st)) return;
  const pi = L.pactInfo(st);
  sheet({ title: '老祖特训', center: true, noClose: true,
    body: `<div class="speaker"><img class="px" src="${ELDER}" style="width:56px;height:56px" alt=""><p class="grow" style="margin:0">来不及了。还剩 <b>${pi.left}</b> 个周天，胜算才 <b>${L.pct(pi.p)}</b>。坐下，老夫亲自给你<b>特训</b>：${L.RET.len} 个周天，修炼 <b>×3</b>，不收灵石。</p></div>`,
    foot: [{ t: '不用', alt: true, fn: closeModal }, { t: '接受特训', gold: true, fn: () => { if (L.startTrain(st)) { SFX.gather(); banner('老祖特训', `${L.RET.len} 周天 · 修炼 ×3`); } closeModal(); } }] });
}
function showVisitor() {
  const ev = L.visitorEvent(st);
  if (!ev) { st.visitor = null; return; }
  showChoice(ev);
}

// ---------- 主循环 ----------
let last = performance.now(), cloudAcc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  const sp = SPEEDS[speedIdx];
  const running = st && sp > 0 && $('#modal').hidden && !cine && $('#intro').hidden && st.p.r < 9 && !guideHold;
  if (running) {
    L.flow(st, dt * sp / TICK_MS);
    monthAcc += dt * sp;
    if (monthAcc >= TICK_MS) { monthAcc -= TICK_MS; onTick(); }
    craneTimer -= dt;
    if (craneTimer <= 0 && !crane && !st.exp) { crane = { x: -12, y: 14 + Math.random() * 22, v: 0.02 }; craneTimer = 70000 + Math.random() * 60000; }
  }
  if (crane) { crane.x += crane.v * dt; if (crane.x > W + 14) crane = null; }
  drawScene(dt);
  if (st) updateGuide();
  hudTimer += dt;
  if (hudTimer > 200) { hudTimer = 0; updateHUD(); }
  cloudAcc += dt;
  if (cloudAcc > 60000) { cloudAcc = 0; saveCloud(); }
  requestAnimationFrame(frame);
}
function sceneClick(e) {
  if (!st || cine) return;
  ac();
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H - OY;
  if (crane && Math.abs(x - crane.x + 3) < 14 && Math.abs(y - crane.y) < 8) {
    if (Math.random() < 0.3) { st.pills++; floatText(crane.x, crane.y, '仙鹤衔丹 破境丹+1', '#ffe39a'); }
    else { const v = Math.floor(L.income(st) * 15 + 60); st.stones += v; floatText(crane.x, crane.y, '仙鹤献瑞 灵石+' + fmt(v), '#ffe39a'); }
    for (let k = 0; k < 24; k++) { const a = Math.random() * 6.28; parts.push({ x: crane.x, y: crane.y, vx: Math.cos(a) * 0.04, vy: Math.sin(a) * 0.04, life: 700, max: 700, c: '#ffe39a', s: 1 }); }
    SFX.coin(); crane = null; return;
  }
  if (st.exp) { SFX.tap(); showExp(); return; }
  if (st.visitor && !st.retreat && Math.abs(x - VISIT_POS.x) < 14 && y > VISIT_POS.y - 30 && y < VISIT_POS.y + 6) { SFX.tap(); showVisitor(); return; }
  const S = D().sit;
  if (Math.abs(x - HOMEPOS.x) < S.w / 2 + 6 && y > HOMEPOS.y - S.h - 16 && y < HOMEPOS.y + 6) {
    if (L.isReady(st)) { SFX.tap(); showBreakthrough(); return; }
    if (st.retreat) { SFX.tap(); showHome(); return; }
    const g = L.tuna(st);
    if (g > 0) {
      tone(784, 0, 0.12, 'triangle', 0.1);
      floatText(HOMEPOS.x + (Math.random() - 0.5) * 20, HOMEPOS.y - S.h - 4 - Math.random() * 12, `吐纳 +${dec(g)}`, '#8ff5d0');
      for (let k = 0; k < 16; k++) { const a = Math.random() * 6.28, r = 18; parts.push({ x: HOMEPOS.x + Math.cos(a) * r, y: HOMEPOS.y - S.h / 2 + Math.sin(a) * r * 0.6, vx: -Math.cos(a) * 0.03, vy: -Math.sin(a) * 0.018, life: 500, max: 500, c: '#9ff5d8', s: 1 }); }
    } else floatText(HOMEPOS.x, HOMEPOS.y - S.h - 4, `吐纳环 ${Math.min(st.tuna || 0, L.TUNA_FULL)}/${L.TUNA_FULL}，在洞府打坐时每周天蓄一格`, '#9d93b8', false, true);
    return;
  }
  if (y > 30 && y < 104 && x > 50 && x < 150) { SFX.tap(); showHome(); }
}
cvs.addEventListener('click', sceneClick);
$('#cult').addEventListener('click', () => { if (!st || cine) return; ac(); SFX.tap(); if (L.isReady(st)) showBreakthrough(); else showMe(); });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if (!b || !st || cine) return;
  ac(); SFX.tap();
  const lk = navLock(b.dataset.nav);
  if (lk) { tempHint = { id: 'tmp', target: `[data-nav="${b.dataset.nav}"]`, text: lk, btn: '好' }; return; }
  ({ exp: showExp, home: showHome, sect: showSect, market: showMarket, me: showMe })[b.dataset.nav]();
});
$('#btnSpeed').onclick = () => { ac(); speedIdx = (speedIdx + 1) % SPEEDS.length; SFX.tap(); savePref(); updateHUD(); };
$('#btnSound').onclick = () => { soundMode = (soundMode + 1) % 3; ac(); SFX.tap(); setSoundIcon(); savePref(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); saveCloud(); } });
window.addEventListener('pagehide', saveLocal);
window.addEventListener('resize', () => { setFontSize(); fitScene(); });

// ---------- 启动 ----------
function start(data) {
  loadPref();
  setSoundIcon();
  const saved = (data && saveOk(data.st)) ? data.st : loadLocal();
  if (saveOk(saved) && loadState(saved)) $('#intro').hidden = true;
  else showIntro();
  updateHUD();
  fitScene();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  initCloud();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ st })); } catch (e) { /* ignore */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__xm = { get st() { return st; }, L, ART, setSpeed: i => { speedIdx = i; }, onTick, showBreakthrough, closeModal, showEvent, showInvite, runTournament, runPact, runWar, doPromote, showDeath, rebirthPick, showChoice, showAlchemy, fightBossUI, showMe, runSectMeet, showGrowth,
  showExp, confirmExp, showExpResult, showHome, showMarket, showSect, showQuests, showPact, showTrain, showVisitor, loadState, get cine() { return !!cine; }, get guideHold() { return guideHold; },
  get guideDbg() { return { active: activeHint && activeHint.id, temp: !!tempHint, hintCool, step: st && st.guide && st.guide.step, cand: HINTS.filter(h => st && !st.hintSeen[h.id] && h.when()).map(h => h.id) }; } };

})();
