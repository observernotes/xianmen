:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 6px;
  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }
#top .row { display: flex; align-items: center; gap: 8px; }
#pName { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#lifeBox.low b { color: var(--red); animation: blink 1s steps(2) infinite; }
#cult { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 0; color: var(--text); text-align: left; cursor: pointer; flex: none; }
#cult .row { display: flex; gap: 8px; align-items: baseline; }
#cult #realm { color: var(--gold); flex: none; }
#cult #xpTxt { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cult #pw { color: var(--muted); flex: none; }
#cult .xbar { display: block; height: 8px; background: var(--panel-lo); position: relative; box-shadow: 0 0 0 1px var(--ink); }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(var(--jade), #2f9a76); }
#cult .xbar i::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.35); }
#cult.ready { background: #4a2a1a; animation: readyPulse 1s steps(2) infinite; }
#cult.ready .xbar i { background: linear-gradient(var(--gold), #c08a1a); }
#cult.ready #xpTxt { color: var(--gold); }
#cult.away { opacity: .85; }
#stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
#stats button { border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-width: 0;
  background: var(--panel); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 2px 0 0 var(--panel-hi); }
#stats button .k { color: var(--muted); white-space: nowrap; }
#stats button b { font-weight: normal; color: var(--jade); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
#stats button[data-s="atk"] b { color: #ff9a8a; }
#stats button[data-s="inc"] b { color: var(--gold); }
#stats button[data-s="big"] { background: #3a2030; }
#stats button[data-s="big"] .k { color: #f0c8c8; }
#stats button[data-s="big"] b.lo { color: #ff7a7a; }
#stats button[data-s="big"] b.md { color: var(--gold); }
#stats button[data-s="big"] b.hi { color: var(--jade); }
#stats button[data-s="big"].soon { animation: navHint 1s steps(2) infinite; }
#stats button:active { transform: translateY(1px); }
.grow-sec { display: flex; flex-direction: column; gap: 4px; }
.grow-sec h3 { margin: 0; font-size: var(--fs); font-weight: normal; display: flex; justify-content: space-between; gap: 8px; color: var(--seal); }
.grow-sec h3 span { color: var(--paper-ink); font-variant-numeric: tabular-nums; }
.grow-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; background: #f7eed6; }
.grow-row .gn { min-width: 0; }
.grow-row .gm { font-variant-numeric: tabular-nums; color: #1d8a63; }
.grow-row .gm.low { color: var(--seal); }
.grow-row .ga { justify-self: end; }
.grow-row .ga .btn { padding: 2px 8px; }
.grow-row .tipx { color: var(--paper-mute); grid-column: 1 / -1; }
@keyframes readyPulse { 50% { background: #6a3a1a; } }
#date { color: var(--muted); white-space: nowrap; }
.res { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-weight: normal; }
#top .row.r2 { justify-content: space-between; }
.iconbtn {
  background: var(--panel-hi); border: 0; padding: 2px 6px; min-width: 32px; height: 24px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--panel-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 16px; height: 16px; }
.iconbtn.on { background: var(--jade); color: var(--ink); }
/* 场景 */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 5 / 4; max-width: 100%; flex: none; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: calc(var(--fs) * 2); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink);
}
#banner small { display: block; font-size: var(--fs); color: var(--text); }
#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--paper-lo);
}
#tip img { width: 32px; height: 32px; flex: none; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; }
/* 目标 */
#goal { display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 22px; }
#goal .lab { color: var(--seal); background: var(--paper); padding: 0 4px; flex: none; }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; }
#goal { cursor: pointer; }
#goal .q { flex: none; color: var(--muted); }
/* 新手引导 */
#guide { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
#guide .spot { position: fixed; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9999px rgba(8, 6, 14, .62); pointer-events: none; animation: spotPulse 1s steps(2) infinite; }
#guide .spot.none { left: 50%; top: 40%; width: 0; height: 0; box-shadow: 0 0 0 9999px rgba(8, 6, 14, .62); animation: none; }
@keyframes spotPulse { 50% { box-shadow: 0 0 0 5px #fff6c0, 0 0 0 9999px rgba(8, 6, 14, .62); } }
#guide .garrow { position: fixed; color: var(--gold); font-size: calc(var(--fs) * 2); line-height: 1; transform: translate(-50%, 0); text-shadow: 2px 2px 0 var(--ink); animation: arrowBob .6s steps(2) infinite; pointer-events: none; }
#guide .garrow.up { animation-name: arrowBobUp; }
@keyframes arrowBob { 50% { margin-top: 6px; } }
@keyframes arrowBobUp { 50% { margin-top: -6px; } }
#guide .gbox { position: fixed; left: 0; right: 0; margin: 0 auto; width: calc(100% - 24px); max-width: 456px; box-sizing: border-box; display: flex; gap: 8px; align-items: flex-start; padding: 10px; pointer-events: auto;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--paper-lo); }
#guide .gav { width: 40px; height: 40px; flex: none; }
#guide .gmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#guide .gtext b { color: var(--seal); font-weight: normal; }
#guide .gbtns { display: flex; gap: 8px; justify-content: flex-end; }
#guide .gbtns .btn { flex: none; padding: 4px 12px; }

const EVENTS = [

/* ============================================================

 * 残魂封入戒指，反背三千年“弑师”骂名。墨无痕是墨离后人，奉祖训寻戒。

{
  id: 'story_r1', where: 'story', trigger: 'realm:1', speaker: 'elder',
  title: '混沌初醒',
  text: '筑基功成，丹田里杂乱的五色灵根竟融成一团混沌。戒指滚烫，老祖沉默半晌，声音头一回发颤：“混沌圣体……三千年了，本座只在一个人身上见过。”你追问是谁，老祖骂道：“问那么多，修炼去！”',

  ]
},
{
  id: 'story_sect', where: 'story', trigger: 'sect', maxR: 7, speaker: 'elder',
  title: '入宗第一天',

{

  title: '认主',
  text: '灵宠落进你怀里，先冲着你指间的锈戒又嗅又拱，仿佛认得里头的气息，接着转头舔了舔你的手，尾巴摇得飞快。从今往后，洞府里多了一张要吃饭的嘴。',

// ---------- 公式 ----------
L.si = p => p.r * 4 + p.s;
L.need = i => Math.floor(P.needBase * Math.pow(P.needGrow, i));
L.pNeed = p => L.need(L.si(p));
L.stageName = p => p.r >= 9 ? '真仙' : L.REALMS[p.r].n + L.STAGES[p.s];
L.isReady = st => !st.exp && st.p.s === 3 && st.p.xp >= L.pNeed(st.p) && st.p.r <= L.MAXR;
L.has = (st, k) => st.p.tr.includes(k);
L.lifespan = function (st) {
  const p = st.p;
  if (p.r >= 9) return Infinity;
  let y = L.REALMS[p.r].life * (1 + 0.05 * st.home.cave);
  if (L.has(st, 'longev')) y *= 1.5;
  if (L.friend(st, 'mo')) y *= 1.1;
  return y + (st.lifeBonus || 0);
};
L.lifeLeft = st => L.lifespan(st) - st.p.age;
L.desperate = st => st.p.r <= L.MAXR && L.lifeLeft(st) < L.lifespan(st) * 0.12;
L.gain = function (st) {
  const p = st.p, i = L.si(p);
  const base = L.need(i) / (P.monBase * Math.pow(P.monGrow, i));
  let m = L.TALENTS[p.t].cul * L.ARTS[p.a].m * L.arrayMult(st.home.array) * (1 + 0.5 * st.rebirth);
  const sc = L.sectOf(st); if (sc) m *= sc.cul;
  if (L.has(st, 'wise')) m *= 1.3;
  m *= L.culMult(st);
  if (p.inj > 0) m *= 0.5;
  return base * m;
};
L.power = function (st) {
  const p = st.p, i = L.si(p);
  let v = P.pw0 * Math.pow(P.pwStage, i) * Math.pow(P.pwRealm, p.r);
  v *= L.TALENTS[p.t].atk * L.WEAPONS[p.w].m * L.PETS[p.pet ? p.pet.tier : 0].m * (1 + 0.25 * st.rebirth);
  if (L.has(st, 'sword')) v *= 1.5;
  const sc = L.sectOf(st); if (sc) v *= sc.atk;
  v *= L.atkMult(st);
  if (p.inj > 0) v *= 0.6;
  return v;
};
L.income = function (st) {
  let s = L.fieldInc(st.home.field) + 3 * Math.pow(2.1, st.p.r) + L.pay(st);
  if (L.has(st, 'koi')) s *= 1.5;
  return s;
};
// 数值拆解：给“变强”面板展示每一项数值从哪来
L.breakdown = function (st) {
  const p = st.p, i = L.si(p), sc = L.sectOf(st);
  const cul = [], atk = [], inc = [];
  const baseCul = L.need(i) / (P.monBase * Math.pow(P.monGrow, i));
  cul.push(['灵根·' + L.TALENTS[p.t].n, L.TALENTS[p.t].cul, 'talent']);
  cul.push(['功法·' + (p.a ? p.an : '基础吐纳'), L.ARTS[p.a].m, 'art']);
  cul.push(['聚灵阵 Lv' + st.home.array, L.arrayMult(st.home.array), 'array']);
  if (st.rebirth) cul.push(['仙缘（第' + (st.rebirth + 1) + '世）', 1 + 0.5 * st.rebirth, '']);
  if (sc && sc.cul !== 1) cul.push(['宗门·' + sc.n, sc.cul, 'sect']);
  if (L.has(st, 'wise')) cul.push(['天赋·悟性超群', 1.3, '']);
  if (st.bonus.cul) cul.push(['机缘加成', 1 + st.bonus.cul, '']);
  if (L.friend(st, 'su')) cul.push(['知己·' + L.npcName(st, 'su'), 1.1, '']);
  if (st.daolv) cul.push(['道侣双修', 1.3, '']);
  for (const b of st.buffs || []) if (b.cul) cul.push(['丹药增益（剩' + b.left + '周天）', b.cul, '']);
  if (p.inj > 0) cul.push(['负伤（剩' + p.inj + '周天）', 0.5, '']);
  const baseAtk = P.pw0 * Math.pow(P.pwStage, i) * Math.pow(P.pwRealm, p.r);
  atk.push(['灵根·' + L.TALENTS[p.t].n, L.TALENTS[p.t].atk, 'talent']);
  atk.push(['法宝·' + (p.w ? p.wn : '赤手空拳'), L.WEAPONS[p.w].m, 'weapon']);
  atk.push(['灵宠·' + (p.pet ? p.pet.name : '无'), L.PETS[p.pet ? p.pet.tier : 0].m, 'pet']);
  if (st.rebirth) atk.push(['仙缘（第' + (st.rebirth + 1) + '世）', 1 + 0.25 * st.rebirth, '']);
  if (L.has(st, 'sword')) atk.push(['天赋·先天剑骨', 1.5, '']);
  if (sc && sc.atk !== 1) atk.push(['宗门·' + sc.n, sc.atk, 'sect']);
  if (st.bonus.atk) atk.push(['机缘加成', 1 + st.bonus.atk, '']);
  if (L.friend(st, 'ye')) atk.push(['知己·' + L.npcName(st, 'ye'), 1.1, '']);
  if (L.friend(st, 'chu')) atk.push(['知己·楚狂', 1.15, '']);
  for (const b of st.buffs || []) if (b.atk) atk.push(['增益（剩' + b.left + '周天）', b.atk, '']);
  if (p.inj > 0) atk.push(['负伤', 0.6, '']);
  const koi = L.has(st, 'koi') ? 1.5 : 1;
  inc.push(['灵田 Lv' + st.home.field, L.fieldInc(st.home.field) * koi, 'field']);
  inc.push(['境界供奉（' + L.REALMS[Math.min(p.r, 8)].n + '）', 3 * Math.pow(2.1, p.r) * koi, '']);
  if (st.sect) inc.push(['宗门俸禄·' + L.srankName(st, st.sect.rank), L.pay(st) * koi, 'sect']);
  return { baseCul, cul, gain: L.gain(st), baseAtk, atk, power: L.power(st), inc, income: L.income(st) };
};

L.btRate = function (st, usePill) {
  const p = st.p;
  let v = L.REALMS[p.r].rate + st.home.furnace * 0.02 + p.fails * 0.12;
  if (usePill) v += 0.2;

L.expChance = function (st, k) {

// 天骄榜对手战力（按排名与周天数插值，由模拟校准）
const RA = [[1, 18.39], [2, 17.9], [4, 16.52], [12, 14.14], [30, 12.62], [45, 9.71], [60, 6.9], [72, 5.08], [85, 3.78], [100, 2.08]];
L.rivalPower = function (st, q) {
  const t = st.tick;
  let a = RA[RA.length - 1][1];
  for (let j = 0; j < RA.length - 1; j++) {
    const [q0, a0] = RA[j], [q1, a1] = RA[j + 1];
    if (q >= q0 && q <= q1) { a = a0 + (a1 - a0) * (q - q0) / (q1 - q0); break; }
  }
  const G = 0.026 * Math.min(t, 180) + 0.012 * Math.max(0, t - 180);
  return Math.exp(a + G);
};
L.rivalAt = function (st, q) { if (q === st.rank) return null; return st.ladder[q < st.rank ? q - 1 : q - 2]; };
L.rivalRank = function (st, id) { const i = st.ladder.findIndex(x => x.id === id); if (i < 0) return 0; return i + 1 < st.rank ? i + 1 : i + 2; };

// ---------- 修为 ----------
function addXp(st, g) {
  const p = st.p;
  if (p.r > L.MAXR) return;
  p.xp += g;
  let ups = 0;
  while (p.s < 3 && p.xp >= L.pNeed(p)) { p.xp -= L.pNeed(p); p.s++; ups++; }
  if (p.s === 3 && p.xp >= L.pNeed(p)) {
    p.xp = L.pNeed(p);
    if (!st.flags.readyNotified && !st.exp) { st.flags.readyNotified = 1; emit('ready', p); }
  } else st.flags.readyNotified = 0;
  if (ups) emit('stageUp', { ups });
}
L.addXp = addXp;

L.upgrade = function (st, k) {
  const b = L.HOME.find(x => x.k === k);
  const lv = st.home[k];
  if (lv >= b.max) return false;
  const c = L.hCost(k, lv);
  if (st.stones < c) return false;
  st.stones -= c;
  st.home[k]++;
  L.log(st, `${b.n}升至 ${st.home[k]} 级${k === 'cave' ? '：' + caveName(st.home[k]) : ''}`);
  L.checkGoals(st);
  return true;
};

// ---------- 宝物 ----------
function rollTier(st, base, max) {
  const lucky = L.has(st, 'lucky') ? 2 : L.has(st, 'hero') ? 1.4 : 1;
  let t = base;
  if (R() < 0.2 * lucky) t++;
  if (R() < 0.05 * lucky) t++;
  if (R() < 0.15) t--;
  return clamp(t, 1, max);
}
L.giveItem = function (st, kind, tier) {
  const p = st.p;
  if (kind === 'pet') {
    const T = L.PETS[tier];
    const it = { kind, tier, name: pick(T.names) };
    if (!p.pet || p.pet.tier < tier) { const first = !p.pet; p.pet = { tier, name: it.name }; it.equip = true; if (first) L.fireTrigger(st, 'pet'); }
    else { it.value = Math.floor(L.price(st, 'egg') * 0.3); st.stones += it.value; }
    return it;
  }
  const list = kind === 'w' ? L.WEAPONS : L.ARTS;
  tier = clamp(tier, 1, list.length - 1);
  const it = { kind, tier, name: pick(list[tier].names) };
  if (p[kind] < tier) { p[kind] = tier; p[kind + 'n'] = it.name; it.equip = true; }
  else { it.value = Math.floor(L.price(st, 'box') * 0.3); st.stones += it.value; }
  return it;
};
L.buy = function (st, k) {
  const c = L.price(st, k);
  if (st.stones < c) return null;
  const r = st.p.r;
  if (k === 'life') {
    const used = st.lifePills[r] || 0;
    if (used >= 3) return null;
    st.lifePills[r] = used + 1;
    const add = Math.floor(L.REALMS[r].life * 0.1);
    st.lifeBonus += add;
    st.stones -= c;
    L.log(st, `服下延寿丹，寿元增加 ${add} 年`, 'jade');
    return { k, add };
  }
  st.stones -= c;
  if (k === 'pill') { st.pills++; return { k }; }
  if (k === 'box') {
    const kind = R() < 0.55 ? 'w' : 'a';
    const it = L.giveItem(st, kind, rollTier(st, 1 + Math.floor(r * (kind === 'w' ? 0.75 : 0.6)), kind === 'w' ? 7 : 6));
    return { k, it };
  }
  if (k === 'egg') {
    const it = L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(r * 0.6), 6));
    L.checkGoals(st);
    return { k, it };
  }
  return null;
};

// ---------- 突破 ----------
L.breakthrough = function (st, usePill) {
  if (!L.isReady(st)) return null;
  const p = st.p;
  if (usePill && st.pills <= 0) usePill = false;
  const rate = L.btRate(st, usePill);
  if (usePill) st.pills--;
  const ok = R() < rate;
  const sure = !!st.flags.sureBt; st.flags.sureBt = 0;
  const desp = L.desperate(st);
  const from = p.r;
  const before = L.power(st);
  const res = { ok, from, to: from + 1, rate, usedPill: usePill, before, trib: L.REALMS[Math.min(from + 1, 8)].trib, ascend: from === L.MAXR, lifeBefore: L.lifespan(st) };
  st.stats.bt++;
  if (ok) {
    p.r++; p.s = 0; p.xp = 0; p.fails = 0; st.flags.readyNotified = 0;
    st.flags.maxR = Math.max(st.flags.maxR || 0, p.r);
    if (p.r === 1 && !st.flags.awoke && st.rebirth === 0) { st.flags.awoke = 1; res.awaken = { from: p.t, to: 6 }; p.t = 6; }
    if (desp) st.stats.despWin++;
    res.sure = sure;
    L.fireTrigger(st, 'realm:' + p.r);
    if (p.r >= 9) { res.ascend = true; st.flags.ascended = 1; L.log(st, `★ ${p.name} 渡过九九天劫，白日飞升！`, 'gold'); }
    else L.log(st, `突破成功，踏入${L.REALMS[p.r].n}期！寿元增至 ${L.fmt(L.lifespan(st))} 年`, p.r >= 2 ? 'gold' : 'jade');
    res.after = L.power(st);
    res.lifeAfter = L.lifespan(st);
  } else {
    p.fails++; st.stats.btFails++;
    if (!L.has(st, 'steady')) { p.xp = Math.floor(L.pNeed(p) * 0.7); p.inj = Math.max(p.inj, 2); }
    else p.xp = Math.floor(L.pNeed(p) * 0.95);
    st.flags.readyNotified = 0;
    res.after = L.power(st);
    L.log(st, `冲击${from >= L.MAXR ? '飞升' : L.REALMS[from + 1].n}失败……下次成功率 +12%`, 'red');
  }
  L.checkGoals(st);
  return res;
};

// ---------- 历练 ----------
L.startExp = function (st, k) {
  if (st.exp || !L.unlocked(st, k)) return false;
  const rg = L.REGIONS[k];
  st.exp = { k, left: rg.mon, total: rg.mon };
  L.log(st, `御剑出发，前往【${rg.n}】历练`);
  return true;
};
L.resolveExp = function (st) {
  const e = st.exp; if (!e) return null;
  st.exp = null;
  const k = e.k;
  const ch = L.expChance(st, k);
  const pw0 = L.power(st), gain0 = L.gain(st);
  // 第一次历练必定成功（老祖暗中护持），免得新手第一步就受挫
  const first = st.stats.exp === 0;
  const ok = first || R() < ch.p;
  const res = { k, ok, ratio: ch.ratio, p: ch.p, items: [], stones: 0, pills: 0, first };
  st.stats.exp++;
  const luck = L.has(st, 'lucky') ? 3 : L.has(st, 'hero') ? 2 : 1;
  if (ok) {
    st.stats.expWin++;
    const leap = ch.ratio < 0.6;
    res.leap = leap;
    let stones = L.DREW[k] * (0.85 + R() * 0.3);
    if (L.has(st, 'koi')) stones *= 1.5;
    if (L.friend(st, 'ye')) stones *= 1.2;
    if (leap) { stones *= 2; st.stats.leapWins++; }
    res.stones = Math.floor(stones);
    res.herbs = Math.round((1 + k * 0.5) * (0.6 + R() * 0.8) * (1 + st.p.r * 0.5));
    st.herbs += res.herbs;
    if (R() < 0.04 + k * 0.006) { res.treasure = 1; st.treasure++; }
    st.regionWins[k] = (st.regionWins[k] || 0) + 1;
    st.stones += res.stones;
    res.xp = L.gain(st) * L.REGIONS[k].mon; // 历练归来的感悟（路上照常修炼）
    addXp(st, res.xp);
    if (R() < 0.6) res.pills++;
    if (k >= 4 && R() < 0.5) res.pills++;
    st.pills += res.pills;
    if (first && st.p.w === 0) res.items.push(L.giveItem(st, 'w', 1));
    else if (R() < 0.38) res.items.push(L.giveItem(st, 'w', rollTier(st, 1 + Math.floor(k * 0.62), 7)));
    if (R() < 0.32) res.items.push(L.giveItem(st, 'a', rollTier(st, 1 + Math.floor(k * 0.5), 6)));
    if (R() < 0.12 * luck) res.items.push(L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(k * 0.5), 6)));
    if (R() < 0.08 * luck) {
      const g = L.gain(st) * 2 * 12;
      addXp(st, g);
      res.fortune = pick(['坠落山崖，误入上古传承之地，得前辈遗泽，修为暴涨！', '于瀑布后发现一处洞天，内有千年灵乳，饮之修为大进！', '救下一位重伤的老者，老者临终传你毕生感悟！']);
    }
    if (st.sect) { res.contrib = L.contribFor(k) * (leap ? 2 : 1); st.sect.total += res.contrib; st.sect.pts += res.contrib; }
    L.log(st, `【${L.REGIONS[k].n}】历练${leap ? '越级' : ''}成功！灵石+${L.fmt(res.stones)}`, leap ? 'gold' : 'jade');
  } else {
    res.stones = Math.floor(L.DREW[k] * 0.1);
    st.stones += res.stones;
    st.p.inj = Math.max(st.p.inj, 3);
    L.log(st, `【${L.REGIONS[k].n}】历练失利，负伤而归`, 'red');
  }
  res.pw0 = pw0; res.pw1 = L.power(st); res.gain0 = gain0; res.gain1 = L.gain(st);
  L.checkGoals(st);
  return res;
};

// ---------- 对决 ----------
L.duelChance = (P1, P2) => clamp(0.5 + 0.55 * Math.log2(P1 / P2), 0.03, 0.97);
// 三年之约：对手是单灵根、炼气后期、手持法器（10 × 1.5² × 1.3 × 1.7 ≈ 50），再加点心气，记作 60
L.PACT_YEAR = 3;
L.PACT_POWER = 60;
L.PACT_ASSIST = 3;
L.pactPower = () => L.PACT_POWER;
// 第一世尚未筑基时，戒中老祖借你一缕神魂之力（明码标价：战力 ×3）
L.pactAssist = st => (st.rebirth === 0 && st.p.r === 0 ? L.PACT_ASSIST : 1);
L.pactInfo = function (st) {
  const mpt = L.REALMS[Math.min(st.p.r, 8)].mpt || 1;
  const left = Math.max(0, Math.ceil((L.PACT_YEAR - st.year) / mpt - 1e-9));
  const base = L.power(st), assist = L.pactAssist(st), S = base * assist, Q = L.PACT_POWER;
  return { left, base, assist, S, Q, p: L.duelChance(S, Q), done: !!st.pact };
};
// 下一件大事（三年之约 / 天骄论道 / 九宗会武），给界面倒计时用
L.nextBig = function (st) {
  if (!st.pact) { const pi = L.pactInfo(st); return { k: 'pact', n: '三年之约', left: pi.left, info: pi }; }
  const t = st.tick;
  let tour = 12 - (t % 12); if (tour === 0) tour = 12;
  const out = { k: 'tour', n: '天骄论道', left: tour };
  if (st.sect && st.sect.order) {
    let m = (6 - (t % 24) + 24) % 24; if (m === 0) m = 24;
    while (t + m - st.sect.joined < 12) m += 24;
    if (m < tour) return { k: 'meet', n: '九宗会武', left: m };
  }
  return out;
};
L.pactDuel = function (st) {
  const assist = L.pactAssist(st) > 1;
  const S = L.power(st) * L.pactAssist(st);
  const Q = L.pactPower();
  const p = L.duelChance(S, Q);
  const win = R() < p;
  st.pact = win ? 1 : -1;
  const res = { S, Q, p, win, assist, base: S / L.pactAssist(st) };
  if (win) {
    st.beaten.mu = 1;
    res.stones = 600; st.stones += 600;
    L.log(st, `三年之约，${st.p.name}当众击败${st.exName}！满城哗然`, 'gold');
  } else L.log(st, `三年之约惜败于${st.exName}……来日天骄榜上再见分晓`, 'red');
  L.checkGoals(st);
  return res;
};
L.tournament = function (st) {
  const S = L.power(st);
  st.stats.tour++;
  const res = { n: st.stats.tour, startRank: st.rank, rounds: [], S };
  const mults = [0.5, 0.85, 1.2];
  for (let j = 0; j < 3; j++) {
    let q;
    if (st.rank === 1) q = 2;
    else {
      const target = S * mults[j];
      q = st.rank - 1; let best = Infinity;
      for (let x = st.rank - 1; x >= 1; x--) {
        const pw = L.rivalPower(st, x);
        const dlt = Math.abs(Math.log(pw / target));
        if (dlt < best) { best = dlt; q = x; }
        if (pw > target * 3) break;
      }
      // 宿敌优先：若范围内有宿敌，则挑战宿敌
      for (let x = st.rank - 1; x >= Math.max(1, q - 6); x--) { const rv = L.rivalAt(st, x); if (rv && rv.id && !st.beaten[rv.id] && L.rivalPower(st, x) < S * 1.6) { q = x; break; } }
    }
    const rv = L.rivalAt(st, q);
    const Q = L.rivalPower(st, q);
    const p = L.duelChance(S, Q);
    const win = R() < p;
    const round = { q, rv, P: Q, p, win };
    if (win) {
      if (st.rank === 1) round.defend = true; else st.rank = q;
      const rw = Math.floor(L.income(st) * 4 + L.DREW[Math.min(10, st.p.r + 1)] * 0.4 + 50);
      round.stones = rw; st.stones += rw;
      if (st.sect) { round.contrib = L.contribFor(Math.min(10, st.p.r + 1)); st.sect.total += round.contrib; st.sect.pts += round.contrib; }
      if (rv && rv.id) { round.first = !st.beaten[rv.id]; st.beaten[rv.id] = (st.beaten[rv.id] || 0) + 1; }
    }
    res.rounds.push(round);
    if (!win) break;
  }
  st.bestRank = Math.min(st.bestRank, st.rank);
  if (st.rank <= 12) L.fireTrigger(st, 'rank:12');
  res.endRank = st.rank;
  L.log(st, `第${res.n}届天骄论道落幕，${st.p.name}位列天骄榜第 ${st.rank}`, st.rank < res.startRank ? 'gold' : '');
  L.checkGoals(st);
  return res;
};

// ---------- 宗门 ----------
L.joinSect = function (st, id) {
  const sc = L.SECTS.find(x => x.id === id); if (!sc || st.sect) return false;
  st.sect = { id, rank: 0, total: 0, pts: 0, joined: st.tick, veins: 0, order: L.NINE.map(x => x.id), meets: 0, best: 9 };
  st.sect.best = L.sectPos(st);
  L.log(st, `拜入${sc.n}，成为外门弟子`, 'gold');
  L.fireTrigger(st, 'sect');
  L.checkGoals(st);
  return true;
};
// 原圣子（或圣女）的战力：约等于元婴初期、灵器加身
L.heirPower = () => P.pw0 * Math.pow(P.pwStage, 12) * Math.pow(P.pwRealm, 3) * 1.5 * 2.3;
L.promote = function (st) {
  if (!L.canPromote(st)) return null;
  const nx = L.SRANKS[st.sect.rank + 1];
  const res = { from: st.sect.rank, to: st.sect.rank + 1 };
  if (nx.duel) {
    const S = L.power(st), Q = L.heirPower();
    const p = L.duelChance(S, Q);
    res.duel = { S, Q, p, win: R() < p };
    if (!res.duel.win) { L.log(st, `挑战原${L.srankName(st, st.sect.rank + 1)}失利，来日再战`, 'red'); return res; }
  }
  st.sect.rank++;
  res.ok = true;
  L.log(st, `全宗震动！晋升${L.SECTS.find(x => x.id === st.sect.id).n}${L.srankName(st, st.sect.rank)}`, 'gold');
  L.checkGoals(st);
  return res;
};
L.vaultBuy = function (st, k) {
  if (!st.sect) return null;
  const c = L.vaultCost(st, k);
  if (st.sect.pts < c) return null;
  if (k === 'vpill') { st.sect.pts -= c; st.pills += 2; return { k }; }
  const tier = L.vaultTier(st, k);
  const key = k === 'vart' ? 'a' : 'w';
  if (st.p[key] >= tier) return null;
  st.sect.pts -= c;
  return { k, it: L.giveItem(st, key, tier) };
};
// 天剑宗来犯：对手是天剑宗长老团（约等于炼虚中期的强者）
L.warPower = () => P.pw0 * Math.pow(P.pwStage, 21) * Math.pow(P.pwRealm, 5) * 7;
L.sectWar = function (st) {
  const S = L.power(st), Q = L.warPower();
  const p = L.duelChance(S, Q);
  const win = R() < p;
  const res = { S, Q, p, win };
  if (win) {
    st.flags.warWon = 1;
    res.contrib = L.contribFor(Math.min(10, st.p.r + 2)) * 3;
    res.stones = Math.floor(L.DREW[Math.min(10, st.p.r + 1)] * 2);
    st.sect.total += res.contrib; st.sect.pts += res.contrib; st.stones += res.stones;
    L.log(st, '天剑宗大举来犯，你一人一剑立于山门，杀退来敌！', 'gold');
  } else {
    st.flags.war = st.tick + 24;
    L.log(st, '天剑宗来犯，宗门苦战方才退敌……此仇必报', 'red');
  }
  L.checkGoals(st);
  return res;
};

// 九宗会武：你作为本宗代表，挑战排名更高的宗门
L.sectMeet = function (st) {
  if (!st.sect) return null;
  st.sect.meets++;
  const S = L.power(st);
  const res = { n: st.sect.meets, start: L.sectPos(st), rounds: [], S };
  for (let j = 0; j < 3; j++) {
    const pos = L.sectPos(st);
    const q = pos === 1 ? 2 : pos - 1;
    const foe = L.nineAt(st, q);
    const Q = L.ninePower(st, q);
    const p = L.duelChance(S, Q);
    const win = R() < p;
    const rd = { q, foe, Q, p, win, defend: pos === 1 };
    if (win) {
      if (pos > 1) { const o = st.sect.order; [o[pos - 1], o[q - 1]] = [o[q - 1], o[pos - 1]]; }
      rd.contrib = L.contribFor(Math.min(10, st.p.r + 1)) * 2; st.sect.total += rd.contrib; st.sect.pts += rd.contrib;
      rd.stones = Math.floor(L.income(st) * 5 + 100); st.stones += rd.stones;
      if (foe.id === 'tianjian') st.flags.beatTianjian = (st.flags.beatTianjian || 0) + 1;
    }
    res.rounds.push(rd);
    if (!win || rd.defend) break;
  }
  res.end = L.sectPos(st);
  st.sect.best = Math.min(st.sect.best, res.end);
  L.log(st, `第${res.n}届九宗会武落幕，${L.sectOf(st).n}位列天下第 ${res.end} 宗`, res.end < res.start ? 'gold' : '');
  L.checkGoals(st);
  return res;
};

// ---------- 随机事件 ----------
L.randomEvent = function (st) {
  const p = st.p;
  const inc = L.income(st);
  const opts = [['enl', 22], ['cave', 18], ['rain', 10], ['pill', 8], ['bandit', 10], ['taunt', 9], ['fairy', 6], ['recruit', 6], ['ring', 3]];
  if (!p.pet || p.pet.tier < 3) opts.push(['beast', 5]);
  const kind = wpick(opts);
  const ev = { kind };
  switch (kind) {
    case 'enl': addXp(st, L.gain(st) * 6); ev.text = '观云海翻涌，忽有所悟——顿悟！修为大涨'; ev.cls = 'jade'; ev.pop = '顿悟！'; break;
    case 'cave': { const v = Math.floor(inc * 8 + 40); st.stones += v; ev.text = `于后山寻得一处古修洞府，得灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '洞府！'; break; }
    case 'rain': addXp(st, L.gain(st) * 3); ev.text = '天降灵雨，修为精进'; ev.cls = 'jade'; ev.pop = '灵雨'; break;
    case 'pill': { const n = 1 + (R() < 0.3 ? 1 : 0); st.pills += n; ev.text = `游方丹师路过洞府，赠下破境丹 ×${n}`; ev.cls = 'jade'; ev.pop = '赠丹'; break; }
    case 'bandit': {
      const S = L.power(st), Q = S * (0.45 + R() * 0.8);
      if (S >= Q * (0.8 + R() * 0.4)) { const v = Math.floor(inc * 5 + 60); st.stones += v; ev.text = `劫修夜闯洞府，被一剑斩退！缴获灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '斩敌'; }
      else { const v = Math.floor(st.stones * 0.1); st.stones -= v; ev.text = `劫修夜闯洞府，抢走灵石 ${L.fmt(v)}……此仇必报！`; ev.cls = 'red'; ev.pop = '被劫'; }
      break;
    }
    case 'taunt': ev.text = pick(['天剑宗弟子路过：“哟，这不是当年被逐出师门的废物吗？”——一指点出，那人倒飞三里。', '某世家少爷当街拦路：“乡下散修，见了本少爷还不让路？”——随手一挥，少爷跪地求饶。', '有人在酒楼嘲笑“杂灵根也想修仙”，看清你的修为后，吓得连杯子都摔了。']); ev.cls = 'gold'; ev.pop = '打脸！'; ev.stones = Math.floor(inc * 2 + 30); st.stones += ev.stones; break;
    case 'fairy': { const v = Math.floor(inc * 10 + 100); st.stones += v; ev.text = `救下一位被妖兽追杀的仙子，她临走时留下一只储物袋，内有灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '仙缘'; break; }
    case 'recruit': { const v = Math.floor(inc * 6 + 80); st.stones += v; ev.text = `某大宗长老亲自登门，欲收你为亲传弟子，被你婉拒。长老留下见面礼灵石 ${L.fmt(v)}`; ev.cls = 'gold'; ev.pop = '招揽'; break; }
    case 'ring': {
      if (p.a < L.ARTS.length - 2) { p.a++; p.an = pick(L.ARTS[p.a].names); ev.text = `夜深人静，戒指微微发烫……“小子，你的根基够了，老夫传你《${p.an}》！”`; ev.cls = 'gold'; ev.big = true; }
      else { addXp(st, L.gain(st) * 10); ev.text = '戒中老祖为你讲道一夜，修为大进'; ev.cls = 'jade'; ev.pop = '讲道'; }
      break;
    }
    case 'beast': {
      const it = L.giveItem(st, 'pet', rollTier(st, 1 + Math.floor(p.r * 0.5), 6));
      ev.item = it; ev.big = true;
      ev.text = it.equip ? `一只受伤的${L.PETS[it.tier].n}倒在洞府门口，你为它疗伤后，它认你为主——【${it.name}】！` : `一只${it.name}在洞府外徘徊，你喂了些灵果，它心满意足地离开了。`;
      ev.cls = 'gold';
      L.checkGoals(st);
      break;
    }
  }
  st.stats.events++;
  if (ev.text) L.log(st, ev.text, ev.cls);
  return ev;
};

// ---------- 人物羁绊 ----------
// 名字是数组时：[主角为男时, 主角为女时]
L.NPCS = {
  su: { n: ['苏青瑶', '苏景行'], title: '丹霞谷医修', bonus: '修炼速度 ×1.1', daolv: true },
  ye: { n: ['夜璃', '夜无殇'], title: '魔门圣宗', bonus: '战力 ×1.1，历练灵石 ×1.2', daolv: true },
  chu: { n: '楚狂', title: '剑痴散修', bonus: '战力 ×1.15' },
  ge: { n: '葛老', title: '落魄丹师', bonus: '炼丹成功率 +15%，可炼洗髓丹' },
  bai: { n: '白小九', title: '化形灵狐', bonus: '奇遇概率 ×1.5' },
  mo: { n: '墨无痕', title: '神秘黑衣人', bonus: '寿元 ×1.1' },
};
L.npcName = (st, id) => { const n = L.NPCS[id] ? L.NPCS[id].n : id; return Array.isArray(n) ? n[st.p.look.f ? 1 : 0] : n; };
L.aff = (st, id) => (st.npc && st.npc[id]) ? st.npc[id].aff : 0;
L.met = (st, id) => !!(st.npc && st.npc[id]);
L.friend = (st, id) => L.aff(st, id) >= 60;
L.addAff = function (st, id, d) {
  if (!L.NPCS[id]) return 0;
  st.npc = st.npc || {};
  const o = st.npc[id] || (st.npc[id] = { aff: 0 });
  const before = o.aff;
  o.aff = clamp(o.aff + d, 0, 100);
  if (before < 60 && o.aff >= 60 && !o.f60) { o.f60 = 1; L.log(st, `与${L.npcName(st, id)}结为知己：${L.NPCS[id].bonus}`, 'gold'); L.fireTrigger(st, 'npc:' + id + ':60'); }
  return o.aff - before;
};
L.culMult = function (st) {
  let m = 1 + ((st.bonus && st.bonus.cul) || 0);
  if (L.friend(st, 'su')) m *= 1.1;
  if (st.daolv) m *= 1.3;
  for (const b of st.buffs || []) if (b.cul) m *= b.cul;
  return m;
};
L.atkMult = function (st) {
  let m = 1 + ((st.bonus && st.bonus.atk) || 0);
  if (L.friend(st, 'ye')) m *= 1.1;
  if (L.friend(st, 'chu')) m *= 1.15;
  for (const b of st.buffs || []) if (b.atk) m *= b.atk;
  return m;
};

// ---------- 事件引擎（数据见 events.js） ----------
L.events = () => (root.EVENTS || (typeof require === 'function' ? (() => { try { return require('./events.js'); } catch (e) { return []; } })() : []));
L.fill = function (st, text) {
  const sc = L.sectOf(st);
  return String(text || '').replace(/\{su\}/g, L.npcName(st, 'su')).replace(/\{ye\}/g, L.npcName(st, 'ye')).replace(/\{ex\}/g, st.exName)
    .replace(/\{sect\}/g, sc ? sc.n : '宗门').replace(/\{name\}/g, st.p.name);
};
function flagOn(st, f) { return !!(st.eflags && st.eflags[f]); }
L.eligible = function (st, ev, where, ctx) {
  ctx = ctx || {};
  if (ev.where !== where) return false;
  const r = st.p.r;
  if (where === 'story') { if (ev.trigger !== ctx.trigger) return false; if (st.evDone[ev.id]) return false; }
  if (ev.once && st.evDone[ev.id]) return false;
  if (ev.minR !== undefined && r < ev.minR) return false;
  if (ev.maxR !== undefined && r > ev.maxR) return false;
  if (ev.need && !ev.need.every(f => flagOn(st, f))) return false;
  if (ev.not && ev.not.some(f => flagOn(st, f))) return false;
  if (ev.npc && ev.aff) { const a = L.aff(st, ev.npc); if (a < ev.aff[0] || a > ev.aff[1]) return false; }
  if (ev.sect === true && !st.sect) return false;
  if (ev.sect === false && st.sect) return false;
  if (ev.daolv === true && !st.daolv) return false;
  if (ev.daolv === false && st.daolv) return false;
  if (where === 'exp' && ev.bg && ctx.bg && !ev.bg.includes(ctx.bg)) return false;
  if (where !== 'story' && st.evLast[ev.id] !== undefined && st.tick - st.evLast[ev.id] < 40) return false;
  return true;
};
L.pickEvent = function (st, where, ctx) {
  const list = L.events().filter(ev => L.eligible(st, ev, where, ctx));
  if (!list.length) return null;
  // 尚未出现过的事件优先
  const fresh = list.filter(ev => st.evLast[ev.id] === undefined);
  const pool = fresh.length && R() < 0.75 ? fresh : list;
  return wpick(pool.map(ev => [ev, (ev.weight || 1) * (ev.npc ? 2.5 : 1)]));
};
L.fireTrigger = function (st, key) {
  for (const ev of L.events()) if (ev.where === 'story' && ev.trigger === key && !st.evDone[ev.id] && !st.storyQ.includes(ev.id) && L.eligible(st, ev, 'story', { trigger: key })) st.storyQ.push(ev.id);
};
L.eventById = id => L.events().find(e => e.id === id);
L.herbScale = st => 1 + st.p.r;
L.costOk = function (st, cost) {
  if (!cost) return true;
  if (cost.stones && st.stones < cost.stones * Math.max(L.income(st), 20)) return false;
  if (cost.pills && st.pills < cost.pills) return false;
  if (cost.herbs && st.herbs < cost.herbs * L.herbScale(st)) return false;
  return true;
};
L.costText = function (st, cost) {
  const a = [];
  if (cost.stones) a.push('灵石 ' + L.fmt(cost.stones * Math.max(L.income(st), 20)));
  if (cost.pills) a.push('破境丹 ' + cost.pills);
  if (cost.herbs) a.push('灵草 ' + L.fmt(cost.herbs * L.herbScale(st)));
  return a.join('、');
};
L.applyFx = function (st, fx) {
  const out = [];
  if (!fx) return out;
  const p = st.p, f = L.fmt;

L.choiceLuck = st => (L.has(st, 'lucky') ? 0.1 : 0) + (L.has(st, 'hero') ? 0.05 : 0) + (L.friend(st, 'bai') ? 0.05 : 0);

L.RECIPES = [
  { k: 'peiyuan', n: '培元丹', d: '服下立得 4 周天修为', herbs: 10 },
  { k: 'pojing', n: '破境丹', d: '突破成功率 +20%', herbs: 8 },

  if (rc.minR && st.p.r < rc.minR) return '金丹期后方可炼制';
  if (k === 'xisui' && !(L.friend(st, 'ge') || st.home.furnace >= 8)) return '需葛老为知己或丹炉 8 级';
  if (k === 'xisui' && st.p.t >= 6) return '灵根已至巅峰';
  if (k === 'yanshou' && (st.lifePills[st.p.r] || 0) >= 3) return '本境界延寿丹已服满';
  if (k === 'jiuzhuan' && st.flags.sureBt) return '已有一枚九转金丹';
  if (st.herbs < L.herbCost(st, rc)) return '灵草不足';

L.craft = function (st, k) {
  if (L.canCraft(st, k)) return null;
  const rc = L.RECIPES.find(x => x.k === k), p = st.p;
  st.herbs -= L.herbCost(st, rc);
  st.treasure -= rc.treasure || 0;
  st.stats.crafts++;
  const res = { k, n: rc.n };
  if (R() >= L.alchRate(st)) { res.ok = false; L.log(st, `炼制${rc.n}时炸炉了……灵草化为飞灰`, 'red'); return res; }
  res.ok = true;
  const pPerfect = 0.05 + st.home.furnace * 0.006 + (L.friend(st, 'ge') ? 0.05 : 0) + (L.has(st, 'alch') ? 0.05 : 0);
  const x = R();
  const q = x < pPerfect ? 3 : x < pPerfect + 0.25 ? 2 : x < pPerfect + 0.75 ? 1 : 0;
  res.q = q; const m = L.QUAL[q].m;

  else if (k === 'pojing') { const n = q === 3 ? 2 : 1; st.pills += n; res.fx = '破境丹 +' + n; }
  else if (k === 'juling') { const t = Math.round(6 * m); const c = q === 3 ? 2 : 1.5; st.buffs.push({ cul: c, left: t }); res.fx = `修炼速度 ×${c}（${t} 周天）`; }
  else if (k === 'yanshou') { st.lifePills[p.r] = (st.lifePills[p.r] || 0) + 1; const v = Math.round(L.REALMS[p.r].life * 0.08 * m); st.lifeBonus += v; res.fx = `寿元 +${L.fmt(v)} 年`; }
  else if (k === 'xisui') { const from = p.t; p.t = Math.min(6, p.t + 1); res.fx = `灵根 ${L.TALENTS[from].n} → ${L.TALENTS[p.t].n}`; res.talent = true; if (q === 3) { st.bonus.cul += 0.03; res.fx += '，极品药力再增修炼 3%'; } }

L.flow = function (st, f) {

L.tick = function (st, cont) {

  if (!cont) L.flow(st, 1);
  st.tick++;
  st.tunaLeft = L.TUNA_MAX;

function showChoice(ev) {

function ladderHTML() {
  const rows = [];
  const add = q => { const rv = L.rivalAt(st, q); rows.push(`<div class="${q === st.rank ? 'me' : ''}"><b>第${q}</b><span>${esc(rv ? rv.n : st.p.name)}${rv && rv.id ? ' <span class="seal">宿敌</span>' : ''}</span><span class="num">${fmt(q === st.rank ? L.power(st) : L.rivalPower(st, q))}</span></div>`); };
  const qs = new Set([1, 2, 3]);
  for (let q = st.rank - 2; q <= st.rank + 2; q++) if (q >= 1 && q <= 100) qs.add(q);
  let prev = 0;
  for (const q of [...qs].sort((a, b) => a - b)) { if (q - prev > 1) rows.push('<div class="muted"><b>…</b></div>'); add(q); prev = q; }
  return `<div class="ladder">${rows.join('')}</div>`;
}

    Object.assign(spot.style, { left: (L0 - 4) + 'px', top: (T0 - 4) + 'px', width: (W0 + 8) + 'px', height: (H0 + 8) + 'px' });
    const below = T0 + H0 / 2 < vh / 2;
    arrow.hidden = false;
    arrow.className = 'garrow' + (below ? ' up' : '');
    arrow.textContent = below ? '▲' : '▼';
    arrow.style.left = (L0 + W0 / 2) + 'px';
    arrow.style.top = (below ? T0 + H0 + 8 : T0 - 8 - 24) + 'px';
    if (below) { box.style.top = ''; box.style.bottom = '16px'; } else { box.style.bottom = ''; box.style.top = '16px'; }
  } else {
    spot.className = 'spot none'; spot.removeAttribute('style');
    arrow.hidden = true;
    box.style.bottom = ''; box.style.top = '34%';
  }
}

const GO = { exp: () => showExp(), home: () => showHome(), sect: () => showSect(), market: () => showMarket(), me: () => showMe('rank') };

// ---------- 每周天 ----------
let monthAcc = 0;
function onTick() {

// ---------- 主循环 ----------
let last = performance.now(), cloudAcc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  const sp = SPEEDS[speedIdx];
  const running = st && sp > 0 && $('#modal').hidden && !cine && $('#intro').hidden && st.p.r < 9 && !guideHold;
  if (running) {
    L.flow(st, dt * sp / TICK_MS);
    monthAcc += dt * sp;
    if (monthAcc >= TICK_MS) { monthAcc -= TICK_MS; onTick(); }
    craneTimer -= dt;
    if (craneTimer <= 0 && !crane && !st.exp) { crane = { x: -12, y: 14 + Math.random() * 22, v: 0.02 }; craneTimer = 70000 + Math.random() * 60000; }
  }
  if (crane) { crane.x += crane.v * dt; if (crane.x > W + 14) crane = null; }
  drawScene(dt);
  if (st) updateGuide();
  hudTimer += dt;
  if (hudTimer > 200) { hudTimer = 0; updateHUD(); }
  cloudAcc += dt;
  if (cloudAcc > 60000) { cloudAcc = 0; saveCloud(); }
  requestAnimationFrame(frame);
}

// ---------- 启动 ----------
