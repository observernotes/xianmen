:root {
  --bg: #120f1c;
  --ink: #0b0912;
  --panel: #262038;
  --panel-hi: #3a3155;
  --panel-lo: #1a1528;
  --paper: #efe3c4;
  --paper-lo: #dccca4;
  --paper-ink: #3b2b1f;
  --paper-mute: #7a6650;
  --seal: #c8323c;
  --gold: #f4c542;
  --jade: #4ccb9f;
  --red: #ff6b6b;
  --text: #f3ecdc;
  --muted: #9d93b8;
  --fs: 12px;
  --font: "XPixel", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs);
  line-height: 1.5;
  margin: 0;
  overflow: hidden;
  -webkit-font-smoothing: none;
  font-smooth: never;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font: inherit; color: inherit; }
input { user-select: text; -webkit-user-select: text; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  gap: 6px;
  position: relative;
}
/* 像素边框：用阶梯阴影做出缺角 */
.pxbox {
  background: var(--panel);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink),
    inset 0 2px 0 0 var(--panel-hi), inset 0 -2px 0 0 var(--panel-lo);
}
/* 顶栏 */
#top { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; }
#top .row { display: flex; align-items: center; gap: 8px; }
#pName { color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#lifeBox.low b { color: var(--red); animation: blink 1s steps(2) infinite; }
#cult { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 0; color: var(--text); text-align: left; cursor: pointer; flex: none; }
#cult .row { display: flex; gap: 8px; align-items: baseline; }
#cult #realm { color: var(--gold); flex: none; }
#cult #xpTxt { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cult #pw { color: var(--muted); flex: none; }
#cult .xbar { display: block; height: 8px; background: var(--panel-lo); position: relative; box-shadow: 0 0 0 1px var(--ink); }
#cult .xbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(var(--jade), #2f9a76); }
#cult .xbar i::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.35); }
#cult.ready { background: #4a2a1a; animation: readyPulse 1s steps(2) infinite; }
#cult.ready .xbar i { background: linear-gradient(var(--gold), #c08a1a); }
#cult.ready #xpTxt { color: var(--gold); }
#cult.away { opacity: .85; }
#stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: none; }
#stats button { border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; min-width: 0;
  background: var(--panel); color: var(--text);
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 2px 0 0 var(--panel-hi); }
#stats button .k { color: var(--muted); white-space: nowrap; }
#stats button b { font-weight: normal; color: var(--jade); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
#stats button[data-s="atk"] b { color: #ff9a8a; }
#stats button[data-s="inc"] b { color: var(--gold); }
#stats button[data-s="big"] { background: #3a2030; }
#stats button[data-s="big"] .k { color: #f0c8c8; }
#stats button[data-s="big"] b.lo { color: #ff7a7a; }
#stats button[data-s="big"] b.md { color: var(--gold); }
#stats button[data-s="big"] b.hi { color: var(--jade); }
#stats button[data-s="big"].soon { animation: navHint 1s steps(2) infinite; }
#stats button:active { transform: translateY(1px); }
.grow-sec { display: flex; flex-direction: column; gap: 4px; }
.grow-sec h3 { margin: 0; font-size: var(--fs); font-weight: normal; display: flex; justify-content: space-between; gap: 8px; color: var(--seal); }
.grow-sec h3 span { color: var(--paper-ink); font-variant-numeric: tabular-nums; }
.grow-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 6px; background: #f7eed6; }
.grow-row .gn { min-width: 0; }
.grow-row .gm { font-variant-numeric: tabular-nums; color: #1d8a63; }
.grow-row .gm.low { color: var(--seal); }
.grow-row .ga { justify-self: end; }
.grow-row .ga .btn { padding: 2px 8px; }
.grow-row .tipx { color: var(--paper-mute); grid-column: 1 / -1; }
@keyframes readyPulse { 50% { background: #6a3a1a; } }
#date { color: var(--muted); white-space: nowrap; }
.res { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.res img { width: 20px; height: 20px; }
.res b { font-weight: normal; }
#top .row.r2 { justify-content: space-between; }
.iconbtn {
  background: var(--panel-hi); border: 0; padding: 2px 6px; min-width: 32px; height: 24px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--panel-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
}
.iconbtn:active { transform: translateY(1px); }
.iconbtn img { width: 16px; height: 16px; }
.iconbtn.on { background: var(--jade); color: var(--ink); }
/* 场景 */
#sceneWrap { position: relative; width: 100%; aspect-ratio: 5 / 4; max-width: 100%; flex: none; overflow: hidden; }
#scene { width: 100%; height: 100%; display: block; cursor: pointer; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.float {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap; pointer-events: none;
  text-shadow: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 1px 0 var(--ink);
  animation: floatUp 1.6s steps(16) forwards;
}
.float.big { font-size: calc(var(--fs) * 2); }
@keyframes floatUp { from { margin-top: 0; opacity: 1; } 70% { opacity: 1; } to { margin-top: -28px; opacity: 0; } }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.shake { animation: shake .3s steps(6); }
@keyframes shake { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,2px); } 40% { transform: translate(4px,-2px); } 60% { transform: translate(-3px,-3px); } 80% { transform: translate(3px,3px); } }
#banner {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-size: calc(var(--fs) * 2); color: var(--gold); opacity: 0;
  text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink);
}
#banner small { display: block; font-size: var(--fs); color: var(--text); }
#banner.show { animation: bannerIn 2.4s steps(24) forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* 戒灵提示 */
#tip {
  position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; align-items: flex-start;
  background: var(--paper); color: var(--paper-ink); padding: 6px 8px; cursor: pointer;
  box-shadow: 0 -2px 0 0 var(--ink), 0 2px 0 0 var(--ink), -2px 0 0 0 var(--ink), 2px 0 0 0 var(--ink), inset 0 -2px 0 0 var(--paper-lo);
}
#tip img { width: 32px; height: 32px; flex: none; }
#tip .who { color: var(--seal); }
#tip .x { margin-left: auto; color: var(--paper-mute); flex: none; }
/* 目标 */
#goal { display: flex; align-items: center; gap: 6px; padding: 4px 8px; min-height: 22px; }
#goal .lab { color: var(--seal); background: var(--paper); padding: 0 4px; flex: none; }
#goal .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#goal .rw { color: var(--gold); flex: none; }
#goal { cursor: pointer; }
#goal .q { flex: none; color: var(--muted); }
/* 新手引导 */
#guide { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
#guide .spot { position: fixed; box-shadow: 0 0 0 3px var(--gold), 0 0 0 9999px rgba(8, 6, 14, .62); pointer-events: none; animation: spotPulse 1s steps(2) infinite; }
#guide .spot.none { left: 50%; top: 40%; width: 0; height: 0; box-shadow: 0 0 0 9999px rgba(8, 6, 14, .62); animation: none; }
@keyframes spotPulse { 50% { box-shadow: 0 0 0 5px #fff6c0, 0 0 0 9999px rgba(8, 6, 14, .62); } }
#guide .garrow { position: fixed; color: var(--gold); font-size: calc(var(--fs) * 2); line-height: 1; transform: translate(-50%, 0); text-shadow: 2px 2px 0 var(--ink); animation: arrowBob .6s steps(2) infinite; pointer-events: none; }
#guide .garrow.up { animation-name: arrowBobUp; }
@keyframes arrowBob { 50% { margin-top: 6px; } }
@keyframes arrowBobUp { 50% { margin-top: -6px; } }
#guide .gbox { position: fixed; left: 0; right: 0; margin: 0 auto; width: calc(100% - 24px); max-width: 456px; box-sizing: border-box; display: flex; gap: 8px; align-items: flex-start; padding: 10px; pointer-events: auto;
  background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 0 -3px 0 0 var(--paper-lo); }
#guide .gav { width: 40px; height: 40px; flex: none; }
#guide .gmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
#guide .gtext b { color: var(--seal); font-weight: normal; }
#guide .gbtns { display: flex; gap: 8px; justify-content: flex-end; }
#guide .gbtns .btn { flex: none; padding: 4px 12px; }

const EVENTS = [

/* ============================================================

 * 残魂封入戒指，反背三千年“弑师”骂名。墨无痕是墨离后人，奉祖训寻戒。

{
  id: 'story_r1', where: 'story', trigger: 'realm:1', speaker: 'elder',
  title: '混沌初醒',
  text: '筑基功成，丹田里杂乱的五色灵根竟融成一团混沌。戒指滚烫，老祖沉默半晌，声音头一回发颤：“混沌圣体……三千年了，本座只在一个人身上见过。”你追问是谁，老祖骂道：“问那么多，修炼去！”',

  ]
},
{
  id: 'story_sect', where: 'story', trigger: 'sect', maxR: 7, speaker: 'elder',
  title: '入宗第一天',

{

  title: '认主',
  text: '灵宠落进你怀里，先冲着你指间的锈戒又嗅又拱，仿佛认得里头的气息，接着转头舔了舔你的手，尾巴摇得飞快。从今往后，洞府里多了一张要吃饭的嘴。',

<script>/* ===== src/logic/core.js ===== */
/* 废柴仙途 · 逻辑模块 core：工具、参数、境界与灵根表、名字、基础公式、新档、日志、修为累加
 * 模块写法见 src/logic.js 顶部说明。 */
(function (install) { if (typeof module === 'object' && module.exports) module.exports = install; else install(globalThis.L || (globalThis.L = {})); })(function (L) {
'use strict';
L.rng = Math.random;
L.hook = null;
function emit(type, data) { if (L.hook) L.hook(type, data); }
L.emit = emit;

// ---------- 工具 ----------
const R = () => L.rng();
function ri(a, b) { return a + Math.floor(R() * (b - a + 1)); }
function pick(a) { return a[Math.floor(R() * a.length)]; }
function wpick(list) { let t = 0; for (const x of list) t += x[1]; let v = R() * t; for (const x of list) { if ((v -= x[1]) < 0) return x[0]; } return list[list.length - 1][0]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
L.ri = ri; L.pick = pick; L.clamp = clamp;
L.U = { R, ri, pick, wpick, clamp, emit };
L.fmt = function (n) {
  n = Math.floor(n);
  const neg = n < 0; if (neg) n = -n;
  let s;
  if (n < 1e4) s = String(n);
  else if (n < 1e8) s = trim(n / 1e4) + '万';
  else if (n < 1e12) s = trim(n / 1e8) + '亿';
  else if (n < 1e16) s = trim(n / 1e12) + '万亿';
  else s = trim(n / 1e16) + '京';
  return neg ? '-' + s : s;
  function trim(x) { return x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1).replace(/\.0$/, '') : x.toFixed(2).replace(/0$/, '').replace(/\.$/, ''); }
};
L.pct = p => Math.round(p * 100) + '%';

L.fmt1 = v => (v < 100 ? (Math.round(v * 10) / 10).toString() : L.fmt(v));

// ---------- 数值参数（模型见 docs/DESIGN.md §3；常数由 tools/sim.js 校准） ----------
// g0/gGrow：倍率为 1 时每周天修为 = g0 × gGrow^i；pw*：战力 = pw0 × pwStage^i × pwRealm^r
const P = L.P = { g0: 10, gGrow: 1.30, pw0: 10, pwStage: 1.5, pwRealm: 1.8 };
// TR：该境界在倍率 1 下的总周天；SW：四个小层各占的比例
L.TR = [50, 150, 400, 820, 1500, 2500, 4200, 6800, 10000];
L.SW = [0.19, 0.23, 0.27, 0.31];

// ---------- 静态数据 ----------
// rate: 冲击下一境界的基础成功率；life: 该境界寿元（年）；mpt: 一个周天流逝的年数（炼气期 12 周天一年）
L.REALMS = [
  { n: '炼气', robe: ['#5d6f8a', '#7f93ab', '#a9bacb'], trim: '#dfe7ef', rate: 0.85, trib: 0, life: 100, mpt: 1 / 12 },
  { n: '筑基', robe: ['#2f6e4b', '#4f9e68', '#7cc792'], trim: '#c9f0d4', rate: 0.60, trib: 0, life: 200, mpt: 1.6 },
  { n: '金丹', robe: ['#9a6a1c', '#d6a032', '#f2cc6a'], trim: '#fff0bd', rate: 0.50, trib: 3, life: 400, mpt: 2 },
  { n: '元婴', robe: ['#4f3a9e', '#7d5bd6', '#a98af0'], trim: '#e2d8ff', rate: 0.45, trib: 4, life: 800, mpt: 3 },
  { n: '化神', robe: ['#8e2a35', '#c8434e', '#ea7a80'], trim: '#ffd3d5', rate: 0.40, trib: 5, life: 1500, mpt: 5.5 },
  { n: '炼虚', robe: ['#24579a', '#3c84d6', '#76b0ee'], trim: '#d3e8ff', rate: 0.35, trib: 6, life: 3000, mpt: 11 },
  { n: '合体', robe: ['#18756c', '#2aa79b', '#5fd3c4'], trim: '#cff8f2', rate: 0.30, trib: 7, life: 6000, mpt: 20 },
  { n: '大乘', robe: ['#b9b3a5', '#e9e6dc', '#ffffff'], trim: '#ffd76a', rate: 0.25, trib: 8, life: 12000, mpt: 42 },
  { n: '渡劫', robe: ['#17131f', '#2e2838', '#4a4157'], trim: '#ffcc44', rate: 0.20, trib: 9, life: 24000, mpt: 80 },
  { n: '真仙', robe: ['#e8d48a', '#fff4c2', '#ffffff'], trim: '#ffffff', rate: 0, trib: 0, life: Infinity, mpt: 0 },
];
L.STAGES = ['初期', '中期', '后期', '圆满'];
L.MAXR = 8;

// 灵根七档。第一世（出身“弃徒”）的灵根靠四次觉醒一路抬上去，洗髓丹可以比剧情提前一档
L.TALENTS = [
  { n: '伪灵根', c: '#9aa0a6', cul: 0.7, atk: 0.85 },
  { n: '杂灵根', c: '#e6e1d3', cul: 1.0, atk: 1.0 },
  { n: '双灵根', c: '#62d26f', cul: 1.25, atk: 1.1 },
  { n: '单灵根', c: '#4aa8ff', cul: 1.5, atk: 1.2 },
  { n: '天灵根', c: '#c27dff', cul: 1.8, atk: 1.35 },
  { n: '先天道体', c: '#ffcf3f', cul: 2.1, atk: 1.5 },
  { n: '先天圣体', c: '#ff6b6b', cul: 2.5, atk: 1.7 },
];
// 觉醒：踏入 r 境界时把灵根抬到“至少 t 档”
L.AWAKE = [
  { r: 1, t: 3, n: '混沌灵根·初醒' },
  { r: 3, t: 4, n: '混沌灵根·二醒' },
  { r: 5, t: 5, n: '混沌道体·三醒' },
  { r: 7, t: 6, n: '混沌圣体·大成' },
];
// 灵根的显示信息：觉醒过的角色，档 3 以上用“混沌…”的名字和彩虹色
L.talentInfo = function (st, t) {
  if (t === undefined) t = st.p.t;
  const T0 = L.TALENTS[t];
  if (st && st.flags && st.flags.awoke && t >= 3) return { n: L.AWAKE[t - 3].n, c: 'rainbow', cul: T0.cul, atk: T0.atk };
  return T0;
};
L.awakens = st => (st.origin || 'qitu') === 'qitu';
// 洗髓丹的上限：比剧情觉醒高一档（没有剧情觉醒的出身不设限）
L.talentCap = function (st) {
  if (!L.awakens(st)) return 6;
  let t = 1;
  for (const a of L.AWAKE) if (st.p.r >= a.r) t = a.t;
  return Math.min(6, t + 1);
};
L.TRAITS = {
  hero:   { n: '主角光环', d: '奇遇把握 +5%，寻宝更容易出高阶' },
  sword:  { n: '先天剑骨', d: '战力×1.5' },
  wise:   { n: '悟性超群', d: '修炼速度×1.3' },
  alch:   { n: '丹道奇才', d: '突破成功率+15%，成丹率+15%' },
  lucky:  { n: '气运之子', d: '奇遇把握 +10%，宝物品质更高' },
  longev: { n: '长生之体', d: '寿元×1.5' },
  steady: { n: '道心坚定', d: '突破失败不受伤，修为只退半成' },
  koi:    { n: '锦鲤附体', d: '灵石收获×1.5' },
};

// ---------- 名字 ----------
const SUR = '李王张刘陈杨赵黄周吴徐孙胡朱高林何郭马罗梁宋郑谢韩唐冯于董萧程曹袁邓许傅沈曾彭吕苏卢蒋蔡贾丁魏薛叶阎余潘杜戴夏钟汪田任姜范方石姚谭廖邹熊金陆郝孔白崔康毛邱秦江史顾侯邵孟龙万段雷钱汤尹黎易常武乔贺赖龚文'.split('');
const SUR2 = ['慕容', '上官', '欧阳', '司马', '南宫', '独孤', '令狐', '东方', '西门', '公孙'];
const G1 = '清明子若无长玄凌紫寒星天云逸问浩景墨剑灵婉雪月风尘羽霜静素晴青轩昊沐辰瑶念知守怀承仲锦'.split('');
const G2 = '风云尘心玄渊河行遥霄羽霜烟月瑶儿宁澜歌舟白川竹秋书影然鸿野衡离渡宸璃笙岚溪'.split('');
L.randName = () => (R() < 0.08 ? pick(SUR2) : pick(SUR)) + pick(G1) + (R() < 0.85 ? pick(G2) : '');
const SECT_A = '青玄紫太灵万九赤寒落星凌归无金碧幽云烈苍昆神浩元'.split('');
const SECT_B = ['剑宗', '法阁', '虚宫', '霄宫', '机阁', '极殿', '霞宗', '元宗', '炎门', '冰谷', '灵宗', '华派', '兽山', '鼎派', '花谷', '刚寺', '阳宗', '月宫', '雷殿', '道院', '仙府', '剑阁', '魔宗'];
L.RIVALS = [
  { id: 'mu', q: 72, sect: '慕容家', title: '退婚之人' },
  { id: 'zhao', q: 45, name: '赵乾', sect: '天剑宗', title: '天剑宗大师兄' },
  { id: 'chu', q: 12, name: '楚天阔', sect: '天剑宗', title: '天剑宗圣子' },
  { id: 'xue', q: 4, name: '血无涯', sect: '血煞魔宗', title: '魔道圣子' },
  { id: 'yun', q: 1, name: '云无极', sect: '昆仑仙宫', title: '天下第一天骄' },
];

// ---------- 公式 ----------
L.si = p => p.r * 4 + p.s;
L.g0 = i => P.g0 * Math.pow(P.gGrow, i);
function sig2(x) { if (x <= 0) return 0; const e = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x / e) * e; }
L.need = i => { i = Math.min(i, 35); return sig2(L.g0(i) * L.TR[i >> 2] * L.SW[i & 3]); };
L.pNeed = p => L.need(L.si(p));
L.stageName = p => (p.r >= 9 ? '真仙' : L.REALMS[p.r].n + L.STAGES[p.s]);
// 修为圆满（不管人在哪）；isReady = 圆满且人在洞府，可以冲击大境界
L.isFull = st => st.p.r <= L.MAXR && st.p.s === 3 && st.p.xp >= L.pNeed(st.p);
L.isReady = st => !st.exp && L.isFull(st);
L.busy = st => !!(st.exp || st.retreat);
L.has = (st, k) => st.p.tr.includes(k);
L.lifespan = function (st) {
  const p = st.p;
  if (p.r >= 9) return Infinity;
  let y = L.REALMS[p.r].life * (1 + 0.05 * st.home.cave);
  if (L.has(st, 'longev')) y *= 1.5;
  if (L.friend(st, 'mo')) y *= 1.1;
  return y + (st.lifeBonus || 0);
};
L.lifeLeft = st => L.lifespan(st) - st.p.age;
L.lifeTicks = st => (st.p.r > L.MAXR ? Infinity : Math.max(0, Math.floor(L.lifeLeft(st) / L.REALMS[st.p.r].mpt)));
L.desperate = st => st.p.r <= L.MAXR && L.lifeLeft(st) < L.lifespan(st) * 0.12;
L.lifeLow = st => st.p.r <= L.MAXR && L.lifeLeft(st) < L.lifespan(st) * 0.30;
// 轮回加成：宿慧（修炼 +15%/级）与根骨（战力 +10%/级），各 5 级，存在 st.meta.perk
const perk = (st, k) => Math.min(5, ((st.meta && st.meta.perk) || {})[k] || 0);
L.rebCul = st => 1 + 0.15 * perk(st, 'wis');
L.rebAtk = st => 1 + 0.10 * perk(st, 'bone');

L.newStats = () => ({ exp: 0, expWin: 0, bt: 0, events: 0, tour: 0, tourWins: 0, leapWins: 0, crafts: 0, perfect: 0, goodPill: 0, jiuzhuan: 0, btFails: 0, bosses: 0, despWin: 0,

  const st = {
    v: 3, tick: 0, year: 0, stones: 20 + 500 * (meta.perk.purse || 0), pills: 0, lifeBonus: 0, lifePills: {},

      t: o.t !== undefined ? o.t : 1, tr: o.tr || ['hero'], r: 0, s: 0, xp: 0, over: 0, age: 16,
      w: 0, wn: '', a: 0, an: '', pet: null, inj: 0, fails: 0,
    },
    exName: female ? '慕容轩' : '慕容雪',
  };
  // 天骄榜
  const used = new Set([st.p.name]);
  const ladder = [];
  while (ladder.length < 99) {
    const n = L.randName();
    if (used.has(n)) continue;
    used.add(n);
    ladder.push({ n, s: pick(SECT_A) + pick(SECT_B) });
  }
  for (const rv of L.RIVALS) ladder[rv.q - 1] = { n: rv.id === 'mu' ? st.exName : rv.name, s: rv.sect, id: rv.id };
  st.ladder = ladder;
  return st;
};

L.log = function (st, text, cls) {

};

// ---------- 修为 ----------
// 圆满之后多出来的修为记入 p.over（至多下一境界初期所需的 20%），突破成功后带过去，不再白白浪费
L.overCap = p => (p.r >= L.MAXR ? 0 : 0.2 * L.need(L.si(p) + 1));
function addXp(st, g) {
  const p = st.p;
  if (p.r > L.MAXR || !(g > 0)) return;
  p.xp += g;
  let ups = 0;
  while (p.s < 3 && p.xp >= L.pNeed(p)) { p.xp -= L.pNeed(p); p.s++; ups++; }
  if (p.s === 3 && p.xp >= L.pNeed(p)) {
    const extra = p.xp - L.pNeed(p);
    p.xp = L.pNeed(p);
    if (extra > 0) p.over = Math.min((p.over || 0) + extra, L.overCap(p));
    if (!st.flags.readyNotified) { st.flags.readyNotified = 1; emit('ready', p); }
  } else st.flags.readyNotified = 0;
  if (ups) emit('stageUp', { ups });
}
L.addXp = addXp;
});

function curve(g, pts, r0, r1, fn) { // 沿控制点画一条由粗到细的身体

    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) { if (dx * dx + dy * dy > r * r + 0.4) continue; const ch = fn(u, dx, dy, r, i); if (ch) put(g, Math.round(px + dx), Math.round(py + dy), ch); }

  dusk: { top: '#36286a', mid: '#b8507a', hor: '#ffb872', far: '#aa7290', mid2: '#76507e', near: '#4c3c66', mist: '#ffd2ac', amb: '#ffc6a6', light: 0.74 },

const KEYS = [[0, 'night'], [0.16, 'night'], [0.27, 'dawn'], [0.37, 'day'], [0.63, 'day'], [0.73, 'dusk'], [0.84, 'night'], [1, 'night']];
ART.skyAt = function (ph) {
  ph = ((ph % 1) + 1) % 1;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [a, ka] = KEYS[i], [b, kb] = KEYS[i + 1];
    if (ph >= a && ph <= b) {
      const t = b === a ? 0 : (ph - a) / (b - a);
      const A = SKY[ka], B = SKY[kb], o = {};
      for (const k in A) o[k] = typeof A[k] === 'number' ? A[k] + (B[k] - A[k]) * t : lerpC(A[k], B[k], t);
      return o;
    }
  }
  return Object.assign({}, SKY.night);
};

// ---------- 场景基础绘制 ----------
let ctx = null, W = 200;
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) { ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function ellipse(cx, cy, rx, ry, c) { ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01)))); ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function line(x0, y0, x1, y1, c, th) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); th = th || 1; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, th, th, c); }
ART.R = R; ART.disc = disc;
ART.setCtx = (c, w) => { ctx = c; W = w; };
// 临时把绘制目标切到离屏画布
function on(c, fn) { const pc = ctx, pw = W; ctx = c.getContext('2d'); W = c.width; try { fn(ctx); } finally { ctx = pc; W = pw; } return c; }
function atop(fn) { ctx.save(); ctx.globalCompositeOperation = 'source-atop'; fn(); ctx.restore(); }
function cut(fn) { ctx.save(); ctx.globalCompositeOperation = 'destination-out'; fn(); ctx.restore(); }
// 有序抖动：lvl 0..16 表示覆盖比例
const pats = new Map();
function pat(c, lvl) {
  const k = c + lvl; let p = pats.get(k);
  if (!p) { const cv = mk(4, 4), g = cv.getContext('2d'); g.fillStyle = c; for (let i = 0; i < 16; i++) if (BAYER[i] < lvl) g.fillRect(i & 3, i >> 2, 1, 1); p = g.createPattern(cv, 'repeat'); pats.set(k, p); if (pats.size > 4000) pats.clear(); }

}

    ctx.globalAlpha = ca;

      for (let k = 0; k < 6; k++) parts.push({ x: x + (Math.random() - .5) * 14, y: y + 8, vx: (Math.random() - .5) * 0.08, vy: -Math.random() * 0.08, g: 0.0002, life: 500, max: 500, c: col, s: 1 });

  }

function itemLine(it) {

function deltaHTML(res) {
  const d = [];
  const arrow = (a, b) => (b > a ? '<span class="jadet">▲</span>' : '<span class="seal">▼</span>');
  if (res.pw1 !== undefined && fmt(res.pw1) !== fmt(res.pw0)) d.push(`<dt>战力</dt><dd class="num">${fmt(res.pw0)} → <b>${fmt(res.pw1)}</b> ${arrow(res.pw0, res.pw1)}</dd>`);
  if (res.gain1 !== undefined && dec(res.gain1) !== dec(res.gain0)) d.push(`<dt>修炼/周天</dt><dd class="num">+${dec(res.gain0)} → <b>+${dec(res.gain1)}</b> ${arrow(res.gain0, res.gain1)}</dd>`);
  if (!st.pact && res.pw1 !== undefined) {
    const a = L.pactAssist(st), p0 = L.duelChance(res.pw0 * a, L.PACT_POWER), p1 = L.duelChance(res.pw1 * a, L.PACT_POWER);
    if (L.pct(p0) !== L.pct(p1)) d.push(`<dt>约战胜算</dt><dd class="num">${L.pct(p0)} → <b>${L.pct(p1)}</b> ${arrow(p0, p1)}</dd>`);

}
function showExpResult(res) {

    for (const it of res.items) lines.push(itemLine(it));

    if (res.first) lines.push('<div class="quote">戒中老祖：“第一趟，老夫暗中替你挡了两爪子。以后可得靠你自己了。”</div>');

    SFX.fail();
  }
  const again = L.unlocked(st, res.k) && !L.isReady(st);
  sheet({ title: `历练归来 · ${rg.n}`, center: true, body: lines.join(''), foot: [{ t: '回洞府', alt: !!again, gold: !again, fn: closeModal }].concat(again ? [{ t: '再去一次', gold: true, fn: () => { L.startExp(st, res.k); closeModal(); } }] : []) });
}

// ---------- 对决（通用） ----------
function duel(o) {
  const S = o.S || L.power(st);
  const p = L.duelChance(S, o.Q);
  const s = sheet({
    title: o.title, center: true, noClose: true,
    body: `${o.intro ? `<p>${o.intro}</p>` : ''}<div class="vs"><div class="side">${myAvImg(66).replace('<img ', '<img id="vsL" ')}<div>${esc(st.p.name)}</div><div class="muted num">${fmt(S)}</div></div>
      <div class="vsx">VS</div>
      <div class="side">${o.right.img}<div>${esc(o.right.name)}</div><div class="muted num">${esc(o.right.sub)}</div></div></div>
      ${o.quote ? `<div class="quote">${esc(o.quote)}</div>` : ''}
      <div class="muted center">胜算 ${L.pct(p)}</div>
      <div id="vsRes" class="center" style="min-height:3em"></div>`,
    foot: [{ t: '……', alt: true, disabled: true, fn: () => o.done() }],
  });
  const l = s.querySelector('#vsL'), r = s.querySelector('#vsR');
  if (l) l.classList.add('clashL'); if (r) r.classList.add('clashR');
  let hits = 0; const hi = setInterval(() => { SFX.hit(); if (++hits >= 3) clearInterval(hi); }, 330);
  setTimeout(() => {
    const box = s.querySelector('#vsRes'), btn = s.querySelector('[data-fi="0"]');
    if (!box) return;
    box.innerHTML = o.win ? `<div class="big goldt">胜！</div><div>${o.winText}</div>` : `<div class="big seal">败</div><div>${o.loseText}</div>`;
    if (o.win) SFX.win(); else SFX.fail();
    btn.disabled = false; btn.textContent = o.btn || '继续'; btn.classList.remove('alt'); btn.classList.add('gold');
  }, 1150);
}

function showChoice(ev) {

  }).join('') + (ev.choices.some(c => L.costOk(st, c.cost)) ? '' : '<button class="btn alt" data-leave="1"><span>作罢</span><small>眼下拿不出这些，只好作罢</small></button>');

// 三年之约：双方数值摆在明面上，外加老祖锦囊（每条都写清楚能涨多少）
function showPact() {
  const pi = L.pactInfo(st), p = st.p;
  const row = (n, eff, act, tip) => `<div class="grow-row"><span class="gn">${n}</span><span class="gm">${eff}</span><span class="ga">${act || ''}</span>${tip ? `<span class="tipx">${tip}</span>` : ''}</div>`;
  const go = (t, k) => `<button class="btn sm alt" data-go="${k}">${t}</button>`;
  const with_ = m => L.pct(L.duelChance(pi.S * m, pi.Q));
  const tips = [];
  if (p.w < 2) tips.push(row('历练捡法宝', p.w ? '×1.3→×1.7' : '×1.3 起', go('去历练', 'exp'), `凡器 ×1.3、法器 ×1.7，后山野林、黑风岭都会掉。换上法器胜算 → <b>${with_(L.WEAPONS[2].m / L.WEAPONS[p.w].m)}</b>。`));
  if (p.r === 0 && p.s < 3) {
    const need = Math.max(0, L.pNeed(p) - p.xp), t = Math.ceil(need / Math.max(L.gain(st), 1e-9));
    tips.push(row('修为再升一层', '×1.5', go('聚灵阵', 'home'), `还差 ${fmt(need)} 修为，照现在约 ${t} 周天。升一层胜算 → <b>${with_(1.5)}</b>。聚灵阵、运功吐纳都能加快。`));
  } else if (p.r === 0) tips.push(row('突破筑基', '暴涨', '', '修为条变金色就点它。筑基后不光境界涨，还会有大机缘——到时她根本不是对手。'));
  if (!p.pet) tips.push(row('收服灵宠', '×1.2 起', navLock('market') ? go('去历练', 'exp') : go('去坊市', 'market'), '历练时偶尔能收服，坊市也能买灵兽蛋。'));
  if (p.inj > 0) tips.push(row('养伤', '负伤 ×0.6', '', `还要 ${p.inj} 周天才好，别赶在开打前受伤。`));
  const body = `<p class="center">还剩 <b>${pi.left} 个周天</b>，${esc(st.exName)}在落霞城擂台等你。</p>
    <div class="vs"><div class="side">${myAvImg(56)}<div>${esc(p.name)}</div><div class="num">${fmt(pi.base)}${pi.assist > 1 ? ` ×${pi.assist}` : ''}</div><div class="num jadet">= ${fmt(pi.S)}</div></div>
      <div class="vsx">VS</div>
      <div class="side">${rivalAvImg({ n: st.exName, id: 'mu' }, 56)}<div>${esc(st.exName)}</div><div class="muted">单灵根·炼气后期·法器</div><div class="num seal">${fmt(pi.Q)}</div></div></div>
    <div class="center big ${pi.p < 0.45 ? 'seal' : pi.p < 0.8 ? 'goldt' : 'jadet'}">胜算 ${L.pct(pi.p)}</div>
    ${pi.assist > 1 ? '<p class="muted center">×3 是老夫借你的神魂之力，只在你筑基之前有效。</p>' : ''}
    <div class="grow-sec"><h3>老祖锦囊<span>怎么提高胜算</span></h3>${tips.join('') || '<p class="muted">已经稳了，安心等着打脸吧。</p>'}</div>`;
  const s = sheet({ title: '三年之约', body });
  s.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { SFX.tap(); GO[b.dataset.go](); });
}

// ---------- 人物 ----------
function ladderHTML() {
  const rows = [];
  const add = q => { const rv = L.rivalAt(st, q); rows.push(`<div class="${q === st.rank ? 'me' : ''}"><b>第${q}</b><span>${esc(rv ? rv.n : st.p.name)}${rv && rv.id ? ' <span class="seal">宿敌</span>' : ''}</span><span class="num">${fmt(q === st.rank ? L.power(st) : L.rivalPower(st, q))}</span></div>`); };
  const qs = new Set([1, 2, 3]);
  for (let q = st.rank - 2; q <= st.rank + 2; q++) if (q >= 1 && q <= 100) qs.add(q);
  let prev = 0;
  for (const q of [...qs].sort((a, b) => a - b)) { if (q - prev > 1) rows.push('<div class="muted"><b>…</b></div>'); add(q); prev = q; }
  return `<div class="ladder">${rows.join('')}</div>`;
}

    }).join('') + '<div class="muted">好感来自奇遇中的选择。好感 60 结为知己获得永久加成；医修与魔门圣女二人中可择一结为道侣。</div>';
  } else if (tab === 'ach') {
    const got = L.ACHS.filter(a => st.ach[a.id]).length;
    body = `<div class="muted">已达成 ${got} / ${L.ACHS.length} · 点已获得的称号可佩戴</div>` + L.ACHS.map(a => `<div class="ach ${st.ach[a.id] ? '' : 'off'}" data-title="${st.ach[a.id] ? esc(a.t) : ''}"><b>${a.n}<br><span class="muted">${a.d}</span></b><span class="${st.title === a.t ? 'chip ok' : 'chip'}">「${a.t}」</span></div>`).join('')

function rebirthPick() {
  const cards = L.rebirthCards(st, 3);
  const n = st.rebirth + 1;
  const s = sheet({ title: `第 ${n + 1} 世 · 选择天赋`, center: true, noClose: true,
    body: `<p>轮回之中，三道命格浮现。选择你下一世的根骨：</p>
      <div class="cands">${cards.map((c, i) => { const T0 = L.TALENTS[c.t]; const tr = L.TRAITS[c.tr[0]]; const beam = T0.c === 'rainbow' ? 'linear-gradient(#ff7a7a,#ffd36b,#7dff9a,#7ad7ff,#c48bff)' : T0.c; return `<div class="cand hide" data-i="${i}"><div class="beam" style="background:${beam}"></div>${talentTag(c.t)}<div class="tr" style="color:var(--text)">${tr.n}</div><div class="tr">${tr.d}</div><div class="cover">？</div></div>`; }).join('')}</div>
      <p class="muted center">仙缘加身：修炼速度 ×${(1 + 0.5 * n).toFixed(1)}，战力 ×${(1 + 0.25 * n).toFixed(2)}，初始灵石更多</p>`,
    foot: [{ t: '投胎转世', gold: true, disabled: true, fn: () => {} }] });
  const ok = s.querySelector('[data-fi="0"]');
  s.querySelectorAll('.cand').forEach((c, i) => {
    setTimeout(() => { c.classList.remove('hide'); const cv = c.querySelector('.cover'); if (cv) cv.remove(); c.classList.add('reveal'); SFX.reveal(cards[i].t); }, 350 + i * 450);

      if (c.classList.contains('hide')) return;
      SFX.tap();
      s.querySelectorAll('.cand').forEach(x => x.classList.toggle('sel', x === c));
      ok.disabled = false;
      ok.onclick = () => {
        const old = st, card = cards[i];
        const ns = L.newState({ name: old.p.name, female: old.p.look.f, rebirth: n, t: card.t, tr: card.tr, lives: old.lives });
        ns.guide = { step: GUIDE.length, done: true };
        ns.hintSeen = Object.assign({}, old.hintSeen || {}, { pactSoon: 0, afterPact: 0 });
        closeModal();

        saveLocal();
      };
    };
  });
}

  let female = 0;

  box.innerHTML = `<div class="setup sheet" style="margin:0"><div class="rod"></div><header><h2>踏上仙途</h2></header>
    <div class="body">
      <div class="center"><img class="px" id="setupAv" alt=""></div>
      <label for="inName">姓名</label><div class="row"><input class="txt grow" id="inName" maxlength="6" value="${esc(pickName())}"><button class="btn sm alt" id="rdName" aria-label="随机姓名">换</button></div>
      <div class="row"><span>性别</span><button class="btn sm gold" id="gM">少年</button><button class="btn sm alt" id="gF">少女</button></div>
      <div class="muted">操作很简单：打坐自动涨修为 → 点【历练】打怪拿资源 → 升级洞府、买丹药 → 修为条变金时点它突破。</div>
    </div><div class="foot"><button class="btn gold" id="goStart">踏入仙途</button></div><div class="rod"></div></div>`;
  const inN = box.querySelector('#inName');
  const av = () => { const c = ART.avatar({ hair: '#2a2230', skin: '#f2c9a0', f: female }, 0, '#e6e1d3'); const img = box.querySelector('#setupAv'); img.src = c.toDataURL(); img.style.cssText = avStyle(c, 78); };
  av();
  box.querySelector('#rdName').onclick = () => { inN.value = pickName(); SFX.tap(); };
  const setG = f => { female = f; box.querySelector('#gM').className = 'btn sm ' + (f ? 'alt' : 'gold'); box.querySelector('#gF').className = 'btn sm ' + (f ? 'gold' : 'alt'); if ((f ? NAMES_M : NAMES_F).includes(inN.value)) inN.value = pickName(); av(); SFX.tap(); };
  box.querySelector('#gM').onclick = () => setG(0);
  box.querySelector('#gF').onclick = () => setG(1);
  box.querySelector('#goStart').onclick = () => {
    ac();
    const s = L.newState({ name: inN.value.trim() || pickName(), female });
    L.log(s, `${s.p.name}在荒山破庙中盘膝坐下，仙途由此开始`, 'gold');
    loadState(s);
    box.hidden = true;
    monthAcc = 0;
    SFX.gong();
    banner('废柴仙途', '三年之约 · 倒计时');
    st.guide = { step: 0, done: false }; st.hintSeen = {};
    saveLocal();
  };
}

/* ===== src/ui/boot.js ===== */
/* 废柴仙途 · 界面片段 boot：每周天、主循环、输入、启动
 * 所有片段共用一个作用域，由 tools/build.py 按 UI_PARTS 的顺序拼进同一个 IIFE。 */
// ---------- 每周天 ----------
let monthAcc = 0;
function onTick() {
  const xpBefore = st.p.xp, stBefore = st.stones;
  const out = L.tick(st, true);
  if (!st.exp && !cine && $('#modal').hidden) {
    const g = L.gain(st), inc = L.income(st);
    if (st.p.r <= L.MAXR && !L.isReady(st)) floatText(HOMEPOS.x + 14, HOMEPOS.y - D().sit.h + 2, '+' + fmt(g), '#8ff5d0', false, true);
    floatText(30, 108, '+' + fmt(inc), '#ffe39a', false, true);
  }
  void xpBefore; void stBefore;
  if (out.exp) { const r = out.exp; pushPopup(() => showExpResult(r)); }
  if (out.choice && !(st.guide && !st.guide.done)) { const ce = out.choice; pushPopup(() => showChoice(ce)); }
  if (out.event) {
    const ev = out.event;
    if (ev.big) pushPopup(() => showEvent(ev));
    else if (ev.pop && !st.exp) floatText(HOMEPOS.x, HOMEPOS.y - D().sit.h - 10, ev.pop, ev.cls === 'red' ? '#ff8a8a' : '#ffe39a');
  }
  if (out.pact) pushPopup(runPact);
  if (out.invite) pushPopup(showInvite);
  if (out.war) pushPopup(runWar);
  if (out.tourney) pushPopup(runTournament);
  if (out.meet) pushPopup(runSectMeet);
  if (out.death) pushPopup(showDeath);
  saveLocal();
}

// ---------- 主循环 ----------
let last = performance.now(), cloudAcc = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  const sp = SPEEDS[speedIdx];
  const running = st && sp > 0 && $('#modal').hidden && !cine && $('#intro').hidden && st.p.r < 9 && !guideHold;
  if (running) {
    L.flow(st, dt * sp / TICK_MS);
    monthAcc += dt * sp;
    if (monthAcc >= TICK_MS) { monthAcc -= TICK_MS; onTick(); }
    craneTimer -= dt;
    if (craneTimer <= 0 && !crane && !st.exp) { crane = { x: -12, y: 14 + Math.random() * 22, v: 0.02 }; craneTimer = 70000 + Math.random() * 60000; }
  }
  if (crane) { crane.x += crane.v * dt; if (crane.x > W + 14) crane = null; }
  drawScene(dt);
  if (st) updateGuide();
  hudTimer += dt;
  if (hudTimer > 200) { hudTimer = 0; updateHUD(); }
  cloudAcc += dt;
  if (cloudAcc > 60000) { cloudAcc = 0; saveCloud(); }
  requestAnimationFrame(frame);
}
function sceneClick(e) {
  if (!st || cine) return;
  ac();
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H - OY;
  if (crane && Math.abs(x - crane.x + 3) < 14 && Math.abs(y - crane.y) < 8) {
    if (Math.random() < 0.3) { st.pills++; floatText(crane.x, crane.y, '仙鹤衔丹 破境丹+1', '#ffe39a'); }
    else { const v = Math.floor(L.income(st) * 15 + 60); st.stones += v; floatText(crane.x, crane.y, '仙鹤献瑞 灵石+' + fmt(v), '#ffe39a'); }
    for (let k = 0; k < 24; k++) { const a = Math.random() * 6.28; parts.push({ x: crane.x, y: crane.y, vx: Math.cos(a) * 0.04, vy: Math.sin(a) * 0.04, life: 700, max: 700, c: '#ffe39a', s: 1 }); }
    SFX.coin(); crane = null; return;
  }
  if (st.exp) { SFX.tap(); showExp(); return; }
  const S = D().sit;
  if (Math.abs(x - HOMEPOS.x) < S.w / 2 + 6 && y > HOMEPOS.y - S.h - 16 && y < HOMEPOS.y + 6) {
    if (L.isReady(st)) { SFX.tap(); showBreakthrough(); return; }
    const g = L.tuna(st);
    if (g > 0) {
      tone(523 + (L.TUNA_MAX - st.tunaLeft) * 40, 0, 0.08, 'triangle', 0.1);
      floatText(HOMEPOS.x + (Math.random() - 0.5) * 20, HOMEPOS.y - S.h - 4 - Math.random() * 12, `吐纳 +${dec(g)}`, '#8ff5d0', false, true);
      for (let k = 0; k < 8; k++) { const a = Math.random() * 6.28, r = 18; parts.push({ x: HOMEPOS.x + Math.cos(a) * r, y: HOMEPOS.y - S.h / 2 + Math.sin(a) * r * 0.6, vx: -Math.cos(a) * 0.03, vy: -Math.sin(a) * 0.018, life: 500, max: 500, c: '#9ff5d8', s: 1 }); }
    } else floatText(HOMEPOS.x, HOMEPOS.y - S.h - 4, '气息已尽，下个周天再来', '#9d93b8', false, true);
    return;
  }
  if (y > 30 && y < 104 && x > 50 && x < 150) { SFX.tap(); showHome(); }
}
cvs.addEventListener('click', sceneClick);
$('#cult').addEventListener('click', () => { if (!st || cine) return; ac(); SFX.tap(); if (L.isReady(st)) showBreakthrough(); else showMe(); });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-nav]'); if (!b || !st || cine) return;
  ac(); SFX.tap();
  const lk = navLock(b.dataset.nav);
  if (lk) { tempHint = { id: 'tmp', target: `[data-nav="${b.dataset.nav}"]`, text: lk, btn: '好' }; return; }
  ({ exp: showExp, home: showHome, sect: showSect, market: showMarket, me: showMe })[b.dataset.nav]();
});
$('#btnSpeed').onclick = () => { ac(); speedIdx = (speedIdx + 1) % SPEEDS.length; SFX.tap(); savePref(); updateHUD(); };
$('#btnSound').onclick = () => { soundMode = (soundMode + 1) % 3; ac(); SFX.tap(); setSoundIcon(); savePref(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); saveCloud(); } });
window.addEventListener('pagehide', saveLocal);
window.addEventListener('resize', () => { setFontSize(); fitScene(); });

// ---------- 启动 ----------
function start(data) {
  loadPref();
  setSoundIcon();
  const saved = (data && data.st && data.st.v === 2) ? data.st : loadLocal();
  if (saved && saved.v === 2) { loadState(saved); $('#intro').hidden = true; }
  else showIntro();
  updateHUD();
  fitScene();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  initCloud();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ st })); } catch (e) { /* ignore */ }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
window.__xm = { get st() { return st; }, L, ART, setSpeed: i => { speedIdx = i; }, onTick, showBreakthrough, closeModal, showEvent, showInvite, runTournament, runPact, runWar, doPromote, showDeath, rebirthPick, showChoice, showAlchemy, fightBossUI, showMe, runSectMeet, showGrowth, get cine() { return !!cine; } };

})();
</script>
